<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b4a0c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<title>맞고 한판</title>
<style>/* 맞고 한판 v3 — 가로 고정 스테이지 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d2306;overscroll-behavior:none;touch-action:none}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select{font-family:inherit;user-select:text;-webkit-user-select:text;touch-action:manipulation}
#root{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden}
#root.bg-felt{background:radial-gradient(ellipse 70% 80% at 32% 40%,#9ad457 0%,#7cbb40 28%,#55922a 55%,#2f5f15 80%,#1d3f0b 100%)}
#root.bg-night{background:radial-gradient(ellipse at 50% 0%,#2a58a8 0%,#173a7a 40%,#0c1d46 75%,#070f26 100%)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:visible}
.scr{position:absolute;inset:0}
:root{--bh:'Black Han Sans','Jua',sans-serif;--gold:#f5cf5a;--bounce:cubic-bezier(.34,1.56,.64,1)}

/* ---------- 버튼 ---------- */
.gbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:52px;padding:0 22px;border-radius:12px;font-size:21px;color:#fff;
  border:2px solid rgba(255,255,255,.6);text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -6px 10px rgba(0,0,0,.15);transition:transform .08s,filter .1s;white-space:nowrap}
.gbtn::after{content:'';position:absolute;left:6%;right:6%;top:3px;height:42%;border-radius:9px 9px 40% 40%;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.05));pointer-events:none}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4)}
.gbtn:disabled{filter:grayscale(.85) brightness(.8);cursor:default}
.gbtn.blue{background:linear-gradient(#5fb8ff,#1f74e0 60%,#1559b8)}
.gbtn.green{background:linear-gradient(#9fe04c,#4aa317 60%,#327d0b)}
.gbtn.orange{background:linear-gradient(#ffc04a,#f17a12 60%,#cf5606)}
.gbtn.gray{background:linear-gradient(#cdd3d9,#8a939c 60%,#6b737b)}
.gbtn.red{background:linear-gradient(#ff7b6a,#d92b22 60%,#a81610)}
.gbtn.gold{background:linear-gradient(#fff0a0,#f2bf2e 55%,#c98a0a);color:#5a3200;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.gbtn.big{height:64px;font-size:27px;padding:0 34px}
.gbtn.sm{height:40px;font-size:17px;padding:0 14px;border-radius:10px}
.chip{display:inline-block;padding:7px 14px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);font-size:16px;margin:3px}
.chip.on{background:linear-gradient(#ffe27a,#e2a51c);color:#4a2a00;border-color:#fff3b8}
.chip.gold{background:linear-gradient(#ffe27a,#e2a51c);color:#4a2a00}
.ibtn{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);font-size:24px}
.small{font-size:14px;opacity:.85}
.dots::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.coin{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#f5c533 45%,#b57c06);box-shadow:inset 0 0 0 2px #9a6200;vertical-align:-4px;margin-right:6px}

/* ---------- 로고/닉네임/로비 ---------- */
.logo{font-family:var(--bh);text-align:center;line-height:.95;cursor:pointer}
.logo .l1{display:block;font-size:110px;background:linear-gradient(#fff7c0,#ffd34a 45%,#e08a0c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #7a2c00;filter:drop-shadow(0 6px 0 #3a1400)}
.logo .l2{display:inline-block;font-size:40px;color:#fff;background:#d8261e;padding:2px 18px;border-radius:10px;border:3px solid #ffd24a;margin-top:-6px;transform:rotate(-4deg)}
.logo.sm .l1{font-size:56px;-webkit-text-stroke:2px #7a2c00;filter:drop-shadow(0 3px 0 #3a1400)}.logo.sm .l2{font-size:20px;padding:1px 10px;border-width:2px}
.nickwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:70px}
.npanel{width:500px;padding:28px 30px;border-radius:20px;background:rgba(5,12,35,.75);border:3px solid var(--gold);box-shadow:0 10px 40px rgba(0,0,0,.5);text-align:center}
.ptitle{font-family:var(--bh);font-size:28px;color:var(--gold);margin-bottom:14px}
.npanel input,.mbox input{width:100%;height:56px;border-radius:12px;border:2px solid #c9a650;background:#fffdf3;color:#222;font-size:24px;padding:0 16px;text-align:center;outline:none}
.avsel{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:16px 0}
.avb{border-radius:12px;padding:3px;background:rgba(255,255,255,.08);border:2px solid transparent}
.avb img{width:100%;display:block}
.avb.on{border-color:#ffd84a;background:rgba(255,216,74,.25);transform:scale(1.08)}
.hint2{margin-top:12px;font-size:15px;opacity:.75}
.topbar{position:absolute;left:0;right:0;top:0;height:66px;display:flex;align-items:center;gap:18px;padding:0 22px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.35));border-bottom:2px solid rgba(245,207,90,.6)}
.tb-me{display:flex;align-items:center;gap:10px;min-width:240px}
.tb-av{width:50px;height:50px;border-radius:12px;background:linear-gradient(#ffe9a3,#e3a73a);padding:2px;border:2px solid #fff3c4}.tb-av img{width:100%;height:100%;display:block}
.tb-nk{font-size:20px}.lv{font-size:13px;background:#2f7de1;padding:1px 6px;border-radius:6px;vertical-align:2px}.tb-st{font-size:14px;opacity:.8}
.tb-money{flex:1;display:flex;align-items:center;justify-content:center;font-size:24px;font-family:var(--bh);color:#ffe27a}
.tb-money span{background:rgba(0,0,0,.4);padding:4px 16px;border-radius:20px;border:1px solid rgba(255,226,122,.4)}
.tb-plus{width:34px;height:34px;margin-left:8px;border-radius:50%;background:linear-gradient(#9fe04c,#3f9612);border:2px solid #fff;font-size:24px;line-height:28px;color:#fff}
.selfc{margin-right:6px}
.lob{position:absolute;left:28px;right:28px;top:70px;bottom:6px}
.lob-head{display:flex;align-items:center;gap:30px;height:84px}
.lob-tabs span{font-family:var(--bh);font-size:26px;padding:8px 26px;border-radius:24px;margin-right:8px;background:rgba(255,255,255,.08)}
.lob-tabs .on{background:linear-gradient(#ffe27a,#e2a51c);color:#4a2a00}.lob-tabs .dim{opacity:.45;font-size:18px}
.lob-sec{font-family:var(--bh);font-size:24px;color:#ffe27a;margin:6px 4px 8px}.lob-sec small{font-family:'Jua';font-size:15px;color:#cfe;opacity:.8;margin-left:10px}
.chans{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 12px;scroll-snap-type:x mandatory;touch-action:pan-x;scrollbar-width:none}
.chans::-webkit-scrollbar{display:none}
.chan{flex:0 0 172px;height:228px;border-radius:16px;padding:14px 12px;text-align:center;position:relative;scroll-snap-align:start;border:3px solid rgba(255,230,150,.75);box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center}
.chan.c0{background:linear-gradient(#5cc46a,#1f7f34)}.chan.c1{background:linear-gradient(#44c0c4,#14757f)}.chan.c2{background:linear-gradient(#5b9cff,#2049b8)}
.chan.c3{background:linear-gradient(#a777ff,#5a2db8)}.chan.c4{background:linear-gradient(#ff7a6a,#b8261f)}.chan.c5{background:linear-gradient(#ffd66a,#c98a0a)}
.chan.cx{background:linear-gradient(#ffb04a,#c4520a)}
.chan.lock{filter:grayscale(.8) brightness(.7)}
.ch-t{font-size:16px;opacity:.9}.ch-n{font-family:var(--bh);font-size:34px;text-shadow:0 3px 0 rgba(0,0,0,.35);margin:2px 0 6px;white-space:nowrap}
.ch-s{font-size:14px;line-height:1.35;opacity:.92;flex:1}.chan .gbtn{width:100%;height:48px}.chan input{width:100%;height:40px;border-radius:10px;border:2px solid #fff3c4;font-size:18px;text-align:center;margin:2px 0 6px;color:#222}
.lk{height:48px;line-height:48px;font-size:18px;background:rgba(0,0,0,.35);border-radius:10px;width:100%}
.friend{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.joinbox{display:flex;gap:8px;align-items:center}
.joinbox input{width:210px;height:48px;border-radius:12px;border:2px solid #c9a650;font-size:21px;text-align:center;color:#222;background:#fffdf3;text-transform:uppercase}
.recent{font-size:16px;opacity:.9}
.matching{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.matching .spin{width:110px;height:110px;border-radius:50%;border:10px solid rgba(255,255,255,.2);border-top-color:#ffe14a;animation:spin 1s linear infinite}
.matching .mt{font-family:var(--bh);font-size:40px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 대기실 ---------- */
.room{position:absolute;inset:0;padding:20px 28px}
.rhead{display:flex;align-items:center;gap:20px;height:50px}.rnet{font-size:18px;background:rgba(0,0,0,.3);padding:6px 16px;border-radius:20px}
.rbody{display:flex;gap:24px;margin-top:12px;height:560px}
.rleft{width:480px;display:flex;flex-direction:column;gap:16px}
.rcard{background:rgba(0,0,0,.4);border:2px solid rgba(245,207,90,.7);border-radius:16px;padding:16px 18px}
.rlab{font-size:17px;color:#ffe27a;margin-bottom:6px}
.rcode{font-family:var(--bh);font-size:64px;letter-spacing:10px;text-align:center;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.rppp{font-family:var(--bh);font-size:36px;color:#ffe27a}
.ropts{margin-top:8px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:17px}
.rright{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px}
.seats{display:flex;align-items:center;gap:26px;margin-top:10px}
.seat{width:240px;height:300px;border-radius:18px;background:rgba(0,0,0,.4);border:3px solid rgba(245,207,90,.8);display:flex;flex-direction:column;align-items:center;padding:16px;gap:6px}
.seat.empty{border-style:dashed;opacity:.8}
.sav{width:130px;height:130px;border-radius:20px;background:linear-gradient(#ffe9a3,#e3a73a);padding:4px;display:flex;align-items:center;justify-content:center;font-size:70px}.sav img{width:100%}
.seat.empty .sav{background:rgba(255,255,255,.1)}
.snk{font-size:26px}.srl{font-size:16px;opacity:.8}.smoney{font-family:var(--bh);font-size:20px;color:#ffe27a}
.vs{font-family:var(--bh);font-size:60px;color:#ffe14a;-webkit-text-stroke:2px #8a1a00}
.waitmsg{font-size:22px;background:rgba(0,0,0,.35);padding:12px 26px;border-radius:14px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:18px;margin:6px 8px}.chk input{width:22px;height:22px}
.scc{background:rgba(0,0,0,.3);padding:6px 12px;border-radius:12px}

/* ---------- 게임 ---------- */
#game{overflow:hidden}
#game .arcs{position:absolute;inset:0;pointer-events:none;background:
  repeating-radial-gradient(circle at 30% 130%,rgba(255,255,255,.045) 0 2px,transparent 3px 180px),
  radial-gradient(ellipse 60% 55% at 30% 38%,rgba(255,255,255,.12),transparent 70%)}
.cd{position:absolute;width:56px;height:91px;border-radius:5px;background:#fff;box-shadow:1px 2px 3px rgba(0,0,0,.45);overflow:visible;backface-visibility:visible}
.cd img{width:100%;height:100%;display:block;border-radius:inherit;pointer-events:none}
.cd.back,.cd.fdown{background:#d42020;background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1.6px),linear-gradient(150deg,#f04236,#c0161a 55%,#9e0d10);background-size:5px 5px,100% 100%;box-shadow:inset 0 0 0 2px rgba(110,0,0,.55),1px 2px 3px rgba(0,0,0,.45)}
.cd.fdown img,.cd.fdown i,.cd.fdown span{visibility:hidden}
.cd.hc{width:89px;height:145px;border-radius:7px;transition:transform .12s;box-shadow:2px 3px 5px rgba(0,0,0,.5);cursor:pointer;touch-action:none}
.cd.hc.lift{transform:translateY(-16px)}
.cd.hc.selc{transform:translateY(-20px);box-shadow:0 0 0 3px #ffe14a,0 0 18px #ffe14a}
.cd.sm{width:30px;height:49px;border-radius:3px;box-shadow:1px 1px 2px rgba(0,0,0,.5)}
.cd.xs{width:28px;height:44px;border-radius:3px}
.cd.big{width:84px;height:137px;border-radius:7px;position:relative}
.cd.pc{position:relative;width:70px;height:114px;display:inline-block;margin:0 4px}
.cd.mc{position:relative;width:27px;height:44px;display:inline-block;margin:0 2px;border-radius:3px}
.cd.mc.got{box-shadow:0 0 0 2px #2fd25a,0 0 8px #2fd25a}.cd.mc.lost{filter:grayscale(1) brightness(.6)}
.cd.bonus{background:linear-gradient(#fffdf0,#ffe9a6);box-shadow:inset 0 0 0 3px #e2a51c,1px 2px 3px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b32012;line-height:1}
.cd.bonus .bn{font-family:var(--bh);font-size:2.2em}.cd.bonus .bt{font-size:.75em;color:#8a5200}.cd.bonus .bp{font-size:.7em}
.cd.hc.bonus{font-size:22px}.cd.fl.bonus{font-size:15px}.cd.sm.bonus{font-size:8px}.cd.pc.bonus{font-size:18px}
.cd.dummy{display:flex;align-items:center;justify-content:center}.cd.dummy .dl{font-size:20px;color:#fff;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:8px}
.cd.dead img{filter:brightness(.42) saturate(.6)}
.cd .dd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);background:#2a2a2a;color:#ff5a4a;border:2px solid #ff5a4a;font-style:normal;font-size:18px;padding:1px 8px;border-radius:8px;white-space:nowrap}
.cd .mk{position:absolute;right:-6px;top:-7px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b0,#ffc21a 60%,#c77a00);color:#9a2c00;font-style:normal;font-size:14px;line-height:21px;text-align:center;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.cd.fl .mk{width:18px;height:18px;font-size:11px;line-height:17px}
.cd.fl{cursor:pointer}
.cd.fl.pick{z-index:45!important;box-shadow:0 0 0 3px #ffe14a,0 0 20px 4px #ffe14a;animation:pk .7s ease-in-out infinite alternate}
@keyframes pk{to{transform:translateY(-6px)}}
.cd.pend{box-shadow:0 0 0 3px #fff,0 0 16px #fff}
.cg{position:absolute;height:49px}
.cg .cnt{position:absolute;right:-8px;bottom:-5px;min-width:20px;height:19px;padding:0 4px;border-radius:4px;background:rgba(35,35,35,.9);border:1px solid #9a9a9a;font-size:13px;line-height:17px;text-align:center;z-index:30;font-family:Arial,sans-serif;font-weight:bold}
.cg .cnt.pt{background:#ffe14a;color:#222;border-color:#fff7c0}
.gline{position:absolute;top:121px;height:2px;background:linear-gradient(90deg,transparent,#f2d64b 6%,#f2d64b 94%,transparent);opacity:.85}
.sbox{position:absolute;width:114px;height:30px;border-radius:4px;background:rgba(0,0,0,.32);font-family:var(--bh);font-size:23px;line-height:30px;text-align:right;padding-right:10px;color:#c7ff5e}
.sbox small{font-size:15px;color:#fff;margin-left:2px}
.stake{position:absolute;top:150px;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.stake b{background:rgba(0,0,0,.22);padding:3px 16px;border-radius:14px;font-size:17px;font-weight:normal}
.stake span{font-size:13px;color:#e4f6d8;padding-left:8px}.stake .nm{color:#ffe14a}
.ohand{position:absolute;top:10px;height:44px;width:200px}
.deck{position:absolute;width:56px;height:91px}
.deck .dcnt{position:absolute;right:-12px;bottom:-8px;background:rgba(0,0,0,.6);font-size:12px;padding:0 5px;border-radius:6px;z-index:8;font-family:Arial;font-weight:bold}
.ppb{position:absolute;z-index:30;font-style:normal;background:#111;color:#ff4a3a;border:2px solid #ff4a3a;font-size:14px;padding:0 6px;border-radius:7px;font-weight:bold}
.arrow{position:absolute;width:28px;height:30px;z-index:35;pointer-events:none;background:linear-gradient(#8fe2ff,#1d7cf0);clip-path:polygon(30% 0,70% 0,70% 45%,100% 45%,50% 100%,0 45%,30% 45%);filter:drop-shadow(0 2px 0 #0a3a8a);animation:bob .55s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-6px)}to{transform:translateY(4px)}}
.pickov{position:absolute;left:0;top:0;width:var(--pw);height:660px;background:rgba(0,0,0,.5);z-index:40;display:flex;justify-content:center}
.pickov span{position:absolute;left:var(--cx);top:92px;transform:translateX(-50%);font-family:var(--bh);font-size:30px;color:#fff;text-shadow:0 3px 0 #000;white-space:nowrap}
.hand{position:absolute;left:0;top:482px;width:100%;height:145px}
.hslot{position:absolute;top:0;width:89px;height:145px;border-radius:8px;background:rgba(10,45,5,.32);box-shadow:inset 0 2px 6px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.hslot span{font-family:Arial Black,Arial;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.12)}
.autob{position:absolute;top:500px;width:64px;height:100px;border-radius:12px;background:linear-gradient(#b4f05c,#56b51b 55%,#36870c);border:2px solid #e2ffb0;color:#fff;font-size:21px;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.autob.on{background:linear-gradient(#fff28a,#ffb21a 55%,#e07a00);border-color:#fff;animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 18px 4px #ffe14a,0 4px 0 rgba(0,0,0,.35)}}
.emob{position:absolute;top:336px;width:50px;height:46px;border-radius:9px;background:linear-gradient(#9de04e,#4c9e1a);border:2px solid #d8ffa6;font-size:32px;line-height:38px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.clock{position:absolute;width:68px;height:76px;display:none;z-index:60;pointer-events:none}
.clock.on{display:block;animation:clockin .3s var(--bounce)}
.clock.theirs{transform:scale(.72);opacity:.9}
.clock .csvg{width:100%;height:100%}
.clock .cnum,.sclock .cnum{position:absolute;left:0;right:0;top:31px;text-align:center;font-family:var(--bh);font-size:26px;color:#d01818;line-height:1;margin-top:8px}
.clock.hurry .csvg{animation:ring .12s linear infinite}
@keyframes ring{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
@keyframes clockin{from{transform:scale(.2)}}
.rpanel{position:absolute;top:52px;width:228px;height:408px;display:flex;flex-direction:column;gap:4px}
.pbox{position:relative;height:98px;flex:none;border-radius:4px;padding:8px 10px;background:linear-gradient(rgba(215,250,180,.30),rgba(150,210,110,.18));border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.pbox.turn{border-color:#ffe14a;box-shadow:0 0 0 2px #ffe14a,0 0 14px rgba(255,225,74,.7)}

<script>/* 맞고 규칙 엔진 (순수 JS, 브라우저/Node 공용) */
(function (root) {

    7: [['y', 'Tane'], ['t', 'Tanzaku', { dan: 'cho' }], ['p', 'Kasu_1'], ['p', 'Kasu_2']],

  };
  for (var m = 1; m <= 12; m++) D[m].forEach(function (d) {
    add(m, d[0], (m < 10 ? '0' : '') + m + '_' + d[1], d[2]);
  });
  add(0, 'p', 'B2', { pi: 2, bonus: 1 }); // 48 보너스 쌍피
  add(0, 'p', 'B3', { pi: 3, bonus: 1 }); // 49 보너스 쓰리피
  var GUKJIN = 32, B2 = 48, B3 = 49, DUMMY0 = 100;
  var TNAME = { g: '광', y: '열끗', t: '띠', p: '피' };
  CARDS.forEach(function (c) {
    c.name = c.bonus ? (c.pi === 3 ? '보너스 쓰리피' : '보너스 쌍피') :
      MONTH[c.m] + ' ' + (c.t === 'p' && c.pi === 2 ? '쌍피' : (c.gukjin ? '국진' : (c.rain ? '비광' : TNAME[c.t])));
  });

  function C(id) { return id >= DUMMY0 ? { id: id, m: 0, t: 'd', pi: 0, name: '패스' } : CARDS[id]; }
  function clone(s) { return JSON.parse(JSON.stringify(s)); }
  function err(msg, code) { var e = new Error(msg); e.code = code || 'bad'; return e; }
  function shuffle(a, rng) {

  }

  function ev(s, k, o) { var e = { k: k }; for (var x in (o || {})) e[x] = o[x]; s.events.push(e); s.log.push(e); }

        st: { jjok: [0, 0], ttadak: [0, 0], sseul: [0, 0], pang: [0, 0] }, mission: null, redeal: tries
      };
      if (cfg.missions) s.mission = makeMission(rng, opts.missionKind);
      s.hands[first] = deck.splice(0, 10);
      s.hands[1 - first] = deck.splice(0, 10);
      s.floor = deck.splice(0, 8);
      s.deck = deck;
      // 바닥에 같은 월 4장 → 다시 섞기
      var cnt = {}, four = false;
      s.floor.forEach(function (id) { var mm = C(id).m; if (mm) { cnt[mm] = (cnt[mm] || 0) + 1; if (cnt[mm] === 4) four = true; } });
      if (four && !opts.deck) continue;
      // 바닥 보너스패 → 선 플레이어가 가져가고 채움
      for (var guard = 0; guard < 10; guard++) {
        var bi = s.floor.findIndex(function (id) { return C(id).bonus; });
        if (bi < 0) break;
        s.caps[first].push(s.floor[bi]);
        ev(s, 'bonusFloor', { p: first, id: s.floor[bi] });
        s.floor.splice(bi, 1);
        if (s.deck.length) s.floor.push(s.deck.shift());
      }
      // 총통
      [first, 1 - first].some(function (p) {
        var c2 = {};
        for (var j = 0; j < s.hands[p].length; j++) {
          var mm = C(s.hands[p][j]).m; if (!mm) continue;
          c2[mm] = (c2[mm] || 0) + 1;
          if (c2[mm] === 4) { ev(s, 'chongtong', { p: p, m: mm }); endRound(s, { winner: p, special: '총통', pts: cfg.chongtong }); return true; }
        }
        return false;
      });
      missionEval(s);
      return s;
    }
    throw err('딜 실패');
  }

  function isPiCard(s, owner, id) { var c = C(id); return c.t === 'p' || (c.gukjin && s.gukjin[owner] === true); }
  function piVal(s, owner, id) { var c = C(id); return c.gukjin ? 2 : c.pi; }

  function score(s, p, gkOverride) {

  function steal(s, from, to, n, why) {

  }

function startSeon() {

}
function freePick(p) { var a = []; for (var i = 0; i < 5; i++) if (G.seon.picks[0] !== i && G.seon.picks[1] !== i) a.push(i); return a[Math.floor(Math.random() * a.length)]; }

function publish() { // 연습/방장: 현재 상태를 화면과 손님에게

function newRoundHost() {
  closeRes();
  G.round++; G.stage = 'play'; G.blockMsg = '';
  G.state = R.newRound({ first: G.first, mult: G.mult, cfg: { missions: G.missions, piBakZero: true } });
  G.paid = 0; G.settled = false; G.lastWin = null; G.contAt = 0;

}
function payMoney(from, to, amt) {
  amt = B(amt); var capped = false;
  if (!G.free) { var have = B(G.chips[from]); if (have < 0n) have = 0n; if (amt > have) { amt = have; capped = true; } }
  G.chips[from] = (B(G.chips[from]) - amt).toString(); G.chips[to] = (B(G.chips[to]) + amt).toString();
  return { amt: amt, capped: capped };
}
function afterState(fresh) {
  var s = G.state, ppp = B(G.ppp);
  while (G.paid < s.instant.length) { var x = s.instant[G.paid++]; payMoney(1 - x.to, x.to, B(x.pts) * ppp); }
  if (s.phase === 'end' && !G.settled) {
    G.settled = true; var r = s.result;
    if (r.nagari) G.mult = r.nextMult;
    else { var pr = payMoney(1 - r.winner, r.winner, B(r.pts) * ppp); G.lastWin = { winner: r.winner, paid: pr.amt.toString(), capped: pr.capped }; G.first = r.winner; G.mult = 1; }
    G.contAt = Date.now() + 6500 + 3500 * SP();
    if (G.mode === 'ai') aiRefill();
    G.blockMsg = nextBlock();
    G.deadline = 0;
  } else if (s.phase !== 'end') {
    G.dlFor = s.turn;
    G.deadline = Date.now() + TURN_MS[G.speed ? 'speed' : 'normal'] + (fresh ? 4500 : 1900) * SP();
  }
  if (G.mode === 'ai') { me.chips = G.chips[0]; saveMe(); }
  if (G.mode === 'host') { G.room.chips = G.chips; G.room.status = 'play'; saveHost(); broadcast(); }
  G.view = R.view(s, G.seat);

}
function aiRefill() { // 컴퓨터 머니는 바닥나면 다시 채움
  var ch = findChannel(G.ppp), need = ch && !G.free ? B(ch.min) * 20n : B(G.ppp) * 1000n;

}
function nextBlock() {

  for (var i = 0; i < 2; i++) if (B(G.chips[i]) < B(ch.min) || B(G.chips[i]) <= 0n) {
    var nk = G.players[i] ? G.players[i].nick : '';
    return nk + '님 머니가 이 채널 입장 최소(' + money(ch.min) + ')보다 적어요. ' + (isAdmin() ? '메뉴에서 충전하세요.' : '충전 후 계속할 수 있어요.');
  }

}
function continueNext() {

  G.blockMsg = nextBlock();
  if (G.blockMsg) { toast(G.blockMsg, 3000); if (isAdmin()) chargeWho(); return; }
  if (G.mode === 'host' && !(NET.conn && NET.conn.open)) return toast('상대가 연결되면 계속할 수 있어요');
  newRoundHost();
}
function doAction(a) {

    if (!NET.conn || !NET.conn.open) return toast('연결 중이에요. 잠시만요');

<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b4a0c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="landscape"><meta name="x5-orientation" content="landscape"><meta name="full-screen" content="yes"><meta name="x5-fullscreen" content="true">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="맞고"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon-192.png">

<title>맞고 한판</title>
<style>/* 맞고 한판 v3 — 가로 고정 스테이지 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d2306;overscroll-behavior:none;touch-action:none}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select{font-family:inherit;user-select:text;-webkit-user-select:text;touch-action:manipulation}
#root{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden}
#root.bg-felt{background:radial-gradient(ellipse 70% 80% at 32% 40%,#9ad457 0%,#7cbb40 28%,#55922a 55%,#2f5f15 80%,#1d3f0b 100%)}
#root.bg-night{background:radial-gradient(ellipse at 50% 0%,#2a58a8 0%,#173a7a 40%,#0c1d46 75%,#070f26 100%)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:visible}
.scr{position:absolute;inset:0}
:root{--bh:'Black Han Sans','Jua',sans-serif;--gold:#f5cf5a;--bounce:cubic-bezier(.34,1.56,.64,1)}

/* ---------- 버튼 ---------- */
.gbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:52px;padding:0 22px;border-radius:12px;font-size:21px;color:#fff;
  border:2px solid rgba(255,255,255,.6);text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -6px 10px rgba(0,0,0,.15);transition:transform .08s,filter .1s;white-space:nowrap}
.gbtn::after{content:'';position:absolute;left:6%;right:6%;top:3px;height:42%;border-radius:9px 9px 40% 40%;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.05));pointer-events:none}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4)}
.gbtn:disabled{filter:grayscale(.85) brightness(.8);cursor:default}
.gbtn.blue{background:linear-gradient(#5fb8ff,#1f74e0 60%,#1559b8)}
.gbtn.green{background:linear-gradient(#9fe04c,#4aa317 60%,#327d0b)}
.gbtn.orange{background:linear-gradient(#ffc04a,#f17a12 60%,#cf5606)}
.gbtn.gray{background:linear-gradient(#cdd3d9,#8a939c 60%,#6b737b)}
.gbtn.red{background:linear-gradient(#ff7b6a,#d92b22 60%,#a81610)}
.gbtn.gold{background:linear-gradient(#fff0a0,#f2bf2e 55%,#c98a0a);color:#5a3200;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.gbtn.big{height:64px;font-size:27px;padding:0 34px}
.gbtn.sm{height:40px;font-size:17px;padding:0 14px;border-radius:10px}
.chip{display:inline-block;padding:7px 14px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);font-size:16px;margin:3px}
.chip.on{background:linear-gradient(#ffe27a,#e2a51c);color:#4a2a00;border-color:#fff3b8}
.chip.gold{background:linear-gradient(#ffe27a,#e2a51c);color:#4a2a00}
.ibtn{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);font-size:24px}
.small{font-size:14px;opacity:.85}
.dots::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.coin{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#f5c533 45%,#b57c06);box-shadow:inset 0 0 0 2px #9a6200;vertical-align:-4px;margin-right:6px}

/* ---------- 로고/닉네임/로비 ---------- */
.logo{font-family:var(--bh);text-align:center;line-height:.95;cursor:pointer}
.logo .l1{display:block;font-size:110px;background:linear-gradient(#fff7c0,#ffd34a 45%,#e08a0c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #7a2c00;filter:drop-shadow(0 6px 0 #3a1400)}
.logo .l2{display:inline-block;font-size:40px;color:#fff;background:#d8261e;padding:2px 18px;border-radius:10px;border:3px solid #ffd24a;margin-top:-6px;transform:rotate(-4deg)}
.logo.sm .l1{font-size:56px;-webkit-text-stroke:2px #7a2c00;filter:drop-shadow(0 3px 0 #3a1400)}.logo.sm .l2{font-size:20px;padding:1px 10px;border-width:2px}
.nickwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:70px}
.npanel{width:500px;padding:28px 30px;border-radius:20px;background:rgba(5,12,35,.75);border:3px solid var(--gold);box-shadow:0 10px 40px rgba(0,0,0,.5);text-align:center}
.ptitle{font-family:var(--bh);font-size:28px;color:var(--gold);margin-bottom:14px}
.npanel input,.mbox input{width:100%;height:56px;border-radius:12px;border:2px solid #c9a650;background:#fffdf3;color:#222;font-size:24px;padding:0 16px;text-align:center;outline:none}
.avsel{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:16px 0}
.avb{border-radius:12px;padding:3px;background:rgba(255,255,255,.08);border:2px solid transparent}
.avb img{width:100%;display:block}
.avb.on{border-color:#ffd84a;background:rgba(255,216,74,.25);transform:scale(1.08)}
.hint2{margin-top:12px;font-size:15px;opacity:.75}
.topbar{position:absolute;left:0;right:0;top:0;height:66px;display:flex;align-items:center;gap:18px;padding:0 22px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.35));border-bottom:2px solid rgba(245,207,90,.6)}
.tb-me{display:flex;align-items:center;gap:10px;min-width:240px}
.tb-av{width:50px;height:50px;border-radius:12px;background:linear-gradient(#ffe9a3,#e3a73a);padding:2px;border:2px solid #fff3c4}.tb-av img{width:100%;height:100%;display:block}
.tb-nk{font-size:20px}.lv{font-size:13px;background:#2f7de1;padding:1px 6px;border-radius:6px;vertical-align:2px}.tb-st{font-size:14px;opacity:.8}
.tb-money{flex:1;display:flex;align-items:center;justify-content:center;font-size:24px;font-family:var(--bh);color:#ffe27a}
.tb-money span{background:rgba(0,0,0,.4);padding:4px 16px;border-radius:20px;border:1px solid rgba(255,226,122,.4)}
.tb-plus{width:34px;height:34px;margin-left:8px;border-radius:50%;background:linear-gradient(#9fe04c,#3f9612);border:2px solid #fff;font-size:24px;line-height:28px;color:#fff}
.selfc{margin-right:6px}
.lob{position:absolute;left:28px;right:28px;top:70px;bottom:6px}
.lob-head{display:flex;align-items:center;gap:30px;height:84px}
.lob-tabs span{font-family:var(--bh);font-size:26px;padding:8px 26px;border-radius:24px;margin-right:8px;background:rgba(255,255,255,.08)}
.lob-tabs .on{background:linear-gradient(#ffe27a,#e2a51c);color:#4a2a00}.lob-tabs .dim{opacity:.45;font-size:18px}
.lob-sec{font-family:var(--bh);font-size:24px;color:#ffe27a;margin:6px 4px 8px}.lob-sec small{font-family:'Jua';font-size:15px;color:#cfe;opacity:.8;margin-left:10px}
.chans{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 12px;scroll-snap-type:x mandatory;touch-action:pan-x;scrollbar-width:none}
.chans::-webkit-scrollbar{display:none}
.chan{flex:0 0 172px;height:228px;border-radius:16px;padding:14px 12px;text-align:center;position:relative;scroll-snap-align:start;border:3px solid rgba(255,230,150,.75);box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center}
.chan.c0{background:linear-gradient(#5cc46a,#1f7f34)}.chan.c1{background:linear-gradient(#44c0c4,#14757f)}.chan.c2{background:linear-gradient(#5b9cff,#2049b8)}
.chan.c3{background:linear-gradient(#a777ff,#5a2db8)}.chan.c4{background:linear-gradient(#ff7a6a,#b8261f)}.chan.c5{background:linear-gradient(#ffd66a,#c98a0a)}
.chan.cx{background:linear-gradient(#ffb04a,#c4520a)}
.chan.lock{filter:grayscale(.8) brightness(.7)}
.ch-t{font-size:16px;opacity:.9}.ch-n{font-family:var(--bh);font-size:34px;text-shadow:0 3px 0 rgba(0,0,0,.35);margin:2px 0 6px;white-space:nowrap}
.ch-s{font-size:14px;line-height:1.35;opacity:.92;flex:1}.chan .gbtn{width:100%;height:48px}.chan input{width:100%;height:40px;border-radius:10px;border:2px solid #fff3c4;font-size:18px;text-align:center;margin:2px 0 6px;color:#222}
.lk{height:48px;line-height:48px;font-size:18px;background:rgba(0,0,0,.35);border-radius:10px;width:100%}
.friend{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.joinbox{display:flex;gap:8px;align-items:center}
.joinbox input{width:210px;height:48px;border-radius:12px;border:2px solid #c9a650;font-size:21px;text-align:center;color:#222;background:#fffdf3;text-transform:uppercase}
.recent{font-size:16px;opacity:.9}
.matching{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.matching .spin{width:110px;height:110px;border-radius:50%;border:10px solid rgba(255,255,255,.2);border-top-color:#ffe14a;animation:spin 1s linear infinite}
.matching .mt{font-family:var(--bh);font-size:40px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 대기실 ---------- */
.room{position:absolute;inset:0;padding:20px 28px}
.rhead{display:flex;align-items:center;gap:20px;height:50px}.rnet{font-size:18px;background:rgba(0,0,0,.3);padding:6px 16px;border-radius:20px}
.rbody{display:flex;gap:24px;margin-top:12px;height:560px}
.rleft{width:480px;display:flex;flex-direction:column;gap:16px}
.rcard{background:rgba(0,0,0,.4);border:2px solid rgba(245,207,90,.7);border-radius:16px;padding:16px 18px}
.rlab{font-size:17px;color:#ffe27a;margin-bottom:6px}
.rcode{font-family:var(--bh);font-size:64px;letter-spacing:10px;text-align:center;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.rppp{font-family:var(--bh);font-size:36px;color:#ffe27a}
.ropts{margin-top:8px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:17px}
.rright{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px}
.seats{display:flex;align-items:center;gap:26px;margin-top:10px}
.seat{width:240px;height:300px;border-radius:18px;background:rgba(0,0,0,.4);border:3px solid rgba(245,207,90,.8);display:flex;flex-direction:column;align-items:center;padding:16px;gap:6px}
.seat.empty{border-style:dashed;opacity:.8}
.sav{width:130px;height:130px;border-radius:20px;background:linear-gradient(#ffe9a3,#e3a73a);padding:4px;display:flex;align-items:center;justify-content:center;font-size:70px}.sav img{width:100%}
.seat.empty .sav{background:rgba(255,255,255,.1)}
.snk{font-size:26px}.srl{font-size:16px;opacity:.8}.smoney{font-family:var(--bh);font-size:20px;color:#ffe27a}
.vs{font-family:var(--bh);font-size:60px;color:#ffe14a;-webkit-text-stroke:2px #8a1a00}
.waitmsg{font-size:22px;background:rgba(0,0,0,.35);padding:12px 26px;border-radius:14px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:18px;margin:6px 8px}.chk input{width:22px;height:22px}
.scc{background:rgba(0,0,0,.3);padding:6px 12px;border-radius:12px}

/* ---------- 게임 ---------- */
#game{overflow:hidden}
#game .arcs{position:absolute;inset:0;pointer-events:none;background:
  repeating-radial-gradient(circle at 30% 130%,rgba(255,255,255,.045) 0 2px,transparent 3px 180px),
  radial-gradient(ellipse 60% 55% at 30% 38%,rgba(255,255,255,.12),transparent 70%)}
.cd{position:absolute;width:56px;height:91px;border-radius:5px;background:#fff;box-shadow:1px 2px 3px rgba(0,0,0,.45);overflow:visible;backface-visibility:visible}
.cd img{width:100%;height:100%;display:block;border-radius:inherit;pointer-events:none}
.cd.back,.cd.fdown{background:#d42020;background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1.6px),linear-gradient(150deg,#f04236,#c0161a 55%,#9e0d10);background-size:5px 5px,100% 100%;box-shadow:inset 0 0 0 2px rgba(110,0,0,.55),1px 2px 3px rgba(0,0,0,.45)}
.cd.fdown img,.cd.fdown i,.cd.fdown span{visibility:hidden}
.cd.hc{width:89px;height:145px;border-radius:7px;transition:transform .12s;box-shadow:2px 3px 5px rgba(0,0,0,.5);cursor:pointer;touch-action:none}
.cd.hc.lift{transform:translateY(-16px)}
.cd.hc.selc{transform:translateY(-20px);box-shadow:0 0 0 3px #ffe14a,0 0 18px #ffe14a}
.cd.sm{width:30px;height:49px;border-radius:3px;box-shadow:1px 1px 2px rgba(0,0,0,.5)}
.cd.xs{width:28px;height:44px;border-radius:3px}
.cd.big{width:84px;height:137px;border-radius:7px;position:relative}
.cd.pc{position:relative;width:70px;height:114px;display:inline-block;margin:0 4px}
.cd.mc{position:relative;width:27px;height:44px;display:inline-block;margin:0 2px;border-radius:3px}
.cd.mc.got{box-shadow:0 0 0 2px #2a8bff,0 0 8px #2a8bff}.cd.mc.lost{filter:grayscale(1) brightness(.6)}
.cd.bonus{background:linear-gradient(#fffdf0,#ffe9a6);box-shadow:inset 0 0 0 3px #e2a51c,1px 2px 3px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b32012;line-height:1}
.cd.bonus .bn{font-family:var(--bh);font-size:2.2em}.cd.bonus .bt{font-size:.75em;color:#8a5200}.cd.bonus .bp{font-size:.7em}
.cd.hc.bonus{font-size:22px}.cd.fl.bonus{font-size:15px}.cd.sm.bonus{font-size:8px}.cd.pc.bonus{font-size:18px}
.cd.dummy{display:flex;align-items:center;justify-content:center}.cd.dummy .dl{font-size:20px;color:#fff;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:8px}
.cd.dead img{filter:brightness(.42) saturate(.6)}
.cd .dd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);background:#2a2a2a;color:#ff5a4a;border:2px solid #ff5a4a;font-style:normal;font-size:18px;padding:1px 8px;border-radius:8px;white-space:nowrap}
.cd .mk{position:absolute;right:-6px;top:-7px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b0,#ffc21a 60%,#c77a00);color:#9a2c00;font-style:normal;font-size:14px;line-height:21px;text-align:center;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.cd.fl .mk{width:18px;height:18px;font-size:11px;line-height:17px}
.cd.fl{cursor:pointer;box-shadow:0 0 0 2px rgba(255,255,255,.85),3px 5px 8px rgba(0,0,0,.55)}
/* v3.2: 먹을 수 있는 손패 = 파란 테두리, 이미 끝난 월(먹을 게 없는 죽은 패) = 회색 테두리 (둘 다 언제든 낼 수 있음) */
.cd.hc.can{box-shadow:0 0 0 4px #1f8bff,0 0 14px 3px rgba(31,139,255,.85)}
.cd.hc.dead{box-shadow:0 0 0 4px #9a9a9a,2px 3px 5px rgba(0,0,0,.5);filter:saturate(.45) brightness(.86)}
.cd.hc.can.selc{box-shadow:0 0 0 4px #ffe14a,0 0 18px #ffe14a}
.cd.fl.pick{z-index:45!important;box-shadow:0 0 0 3px #ffe14a,0 0 20px 4px #ffe14a;animation:pk .7s ease-in-out infinite alternate}
@keyframes pk{to{transform:translateY(-6px)}}
.cd.pend{box-shadow:0 0 0 3px #fff,0 0 16px #fff}
.cg{position:absolute;height:49px}
.cg .cnt{position:absolute;right:-8px;bottom:-5px;min-width:20px;height:19px;padding:0 4px;border-radius:4px;background:rgba(35,35,35,.9);border:1px solid #9a9a9a;font-size:13px;line-height:17px;text-align:center;z-index:30;font-family:Arial,sans-serif;font-weight:bold}
.cg .cnt.pt{background:#ffe14a;color:#222;border-color:#fff7c0}
.gline{position:absolute;top:121px;height:2px;background:linear-gradient(90deg,transparent,#f2d64b 6%,#f2d64b 94%,transparent);opacity:.85}
.sbox{position:absolute;width:114px;height:30px;border-radius:4px;background:rgba(0,0,0,.32);font-family:var(--bh);font-size:23px;line-height:30px;text-align:right;padding-right:10px;color:#c7ff5e}
.sbox small{font-size:15px;color:#fff;margin-left:2px}
.stake{position:absolute;top:150px;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.stake b{background:rgba(0,0,0,.22);padding:3px 16px;border-radius:14px;font-size:17px;font-weight:normal}
.stake span{font-size:13px;color:#e4f6d8;padding-left:8px}.stake .nm{color:#ffe14a}
.ohand{position:absolute;top:10px;height:44px;width:200px}
.deck{position:absolute;width:56px;height:91px}
.deck .dcnt{position:absolute;right:-12px;bottom:-8px;background:rgba(0,0,0,.6);font-size:12px;padding:0 5px;border-radius:6px;z-index:8;font-family:Arial;font-weight:bold}
.ppb{position:absolute;z-index:30;font-style:normal;background:#111;color:#ff4a3a;border:2px solid #ff4a3a;font-size:14px;padding:0 6px;border-radius:7px;font-weight:bold}
.arrow{position:absolute;width:28px;height:30px;z-index:35;pointer-events:none;background:linear-gradient(#8fe2ff,#1d7cf0);clip-path:polygon(30% 0,70% 0,70% 45%,100% 45%,50% 100%,0 45%,30% 45%);filter:drop-shadow(0 2px 0 #0a3a8a);animation:bob .55s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-6px)}to{transform:translateY(4px)}}
.pickov{position:absolute;left:0;top:0;width:var(--pw);height:470px;background:rgba(0,0,0,.5);z-index:40;display:flex;justify-content:center}
.pickov span{position:absolute;left:var(--cx);top:92px;transform:translateX(-50%);font-family:var(--bh);font-size:30px;color:#fff;text-shadow:0 3px 0 #000;white-space:nowrap}
.hand{position:absolute;left:0;top:482px;width:100%;height:145px}
.hslot{position:absolute;top:0;width:89px;height:145px;border-radius:8px;background:rgba(10,45,5,.32);box-shadow:inset 0 2px 6px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.hslot span{font-family:Arial Black,Arial;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.12)}
.autob{position:absolute;top:500px;width:64px;height:100px;border-radius:12px;background:linear-gradient(#b4f05c,#56b51b 55%,#36870c);border:2px solid #e2ffb0;color:#fff;font-size:21px;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.autob.on{background:linear-gradient(#fff28a,#ffb21a 55%,#e07a00);border-color:#fff;animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 18px 4px #ffe14a,0 4px 0 rgba(0,0,0,.35)}}
.emob{position:absolute;top:336px;width:50px;height:46px;border-radius:9px;background:linear-gradient(#9de04e,#4c9e1a);border:2px solid #d8ffa6;font-size:32px;line-height:38px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.clock{position:absolute;width:68px;height:76px;display:none;z-index:60;pointer-events:none}
.clock.on{display:block;animation:clockin .3s var(--bounce)}
.clock.theirs{transform:scale(.72);opacity:.9}
.clock .csvg{width:100%;height:100%}
.clock .cnum,.sclock .cnum{position:absolute;left:0;right:0;top:31px;text-align:center;font-family:var(--bh);font-size:26px;color:#d01818;line-height:1;margin-top:8px}
.clock.hurry .csvg{animation:ring .12s linear infinite}
@keyframes ring{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}

/* ---------- FX ---------- */
.fx{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;--dur:1150ms}
.fx .burst{position:absolute;left:50%;top:50%;width:330px;height:330px;margin:-165px 0 0 -165px;animation:burst var(--dur) ease-out forwards;z-index:0}
@keyframes burst{0%{transform:scale(.1) rotate(-30deg);opacity:0}15%{transform:scale(1.15) rotate(0);opacity:1}70%{transform:scale(1) rotate(8deg);opacity:1}100%{transform:scale(1.3) rotate(12deg);opacity:0}}
.fx .fw{position:relative;z-index:2;font-family:var(--bh);font-size:118px;line-height:1.05;white-space:nowrap;background:linear-gradient(#fffbb8,#ffe81a 45%,#ffa800);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:4px #d01408;animation:word var(--dur) var(--bounce) forwards}
.fx .fw::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;-webkit-text-stroke:18px #160800;color:#160800;background:none}
@keyframes word{0%{transform:scale(2.6);opacity:0}14%{transform:scale(.92);opacity:1}24%{transform:scale(1.06)}32%{transform:scale(1)}78%{transform:scale(1);opacity:1}100%{transform:scale(1.05) translateY(-30px);opacity:0}}
.fx .fs{position:relative;z-index:2;margin-top:-6px;font-family:var(--bh);font-size:36px;color:#fff;-webkit-text-stroke:2px #222;text-shadow:0 3px 0 #000;animation:word var(--dur) var(--bounce) forwards}
.fx.fail .fw{background:linear-gradient(#ffffff,#c9c9c9 50%,#8a8a8a);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:4px #444}
.fx.fail .fs{background:#666;border:3px solid #ddd;border-radius:10px;padding:0 14px;-webkit-text-stroke:0;font-size:30px;order:-1;margin:0 0 -4px}
.fx.stop .fw{background:linear-gradient(#ff9a8a,#f02a1a 50%,#a80a04);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:4px #ffd24a;font-size:130px}
.fx.stop::before{content:'';position:absolute;left:50%;top:50%;width:380px;height:150px;margin:-75px 0 0 -190px;border-radius:30px;background:radial-gradient(rgba(255,230,120,.65),transparent 70%);animation:burst var(--dur) ease-out forwards}
.fx.go .fw{background:linear-gradient(#fff6b0,#ffb21a 50%,#ff5a00);-webkit-background-clip:text;background-clip:text}
.fx.gold .fw{background:linear-gradient(#fffbe0,#ffd84a 45%,#c98a0a);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:4px #7a3a00;font-size:92px}
.fx.pink .fw{background:linear-gradient(#ffe0f4,#ff5ab8 50%,#c0157a);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:4px #fff}
.fx.warn .fw{background:linear-gradient(#e0f2ff,#4aa8ff 50%,#1559b8);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:4px #fff}
.fx .sp{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;background:#fff6a0;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);z-index:3;animation:spark var(--dur) ease-out forwards}

.cd.mc .mar{position:absolute;left:50%;top:-11px;transform:translateX(-50%);font-style:normal;font-size:11px;line-height:1;text-shadow:0 1px 0 #000}
.cd.mc .mar.me{color:#2a8bff}.cd.mc .mar.op{color:#ff3b30;top:auto;bottom:-11px}
.mban.failed{filter:grayscale(.6)}
.mfail{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-style:normal;font-family:Arial Black,Arial;font-size:84px;line-height:1;color:rgba(90,90,90,.78);pointer-events:none}
.cd.fl.pb{box-shadow:0 0 0 2px #ffd23a,3px 5px 8px rgba(0,0,0,.55)}

/* v3.2: 팝업 ✕ 닫기 버튼 — 스크롤과 무관하게 항상 오른쪽 위에 보임 */
.mwrap{position:relative;display:inline-block}
.mwrap>.xbtn{position:absolute;right:-16px;top:-16px;width:50px;height:50px;font-size:26px;font-weight:900;line-height:46px;border-radius:50%;background:#fff;color:#d0281c;border:3px solid #d0281c;box-shadow:0 3px 8px rgba(0,0,0,.5);z-index:10;padding:0}

.badge{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:10px;background:#ff3b30;color:#fff;font-size:13px;font-style:normal;font-weight:900;margin-left:4px;padding:0 5px;vertical-align:middle;box-shadow:0 0 0 2px #fff}
.rqstat{display:block;font-size:11px;color:#ffe08a;margin-left:6px;max-width:170px;line-height:1.1}
.flist,.creqs{max-height:300px;overflow-y:auto;margin:8px 0;text-align:left}
.frow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;background:rgba(255,255,255,.07);margin-bottom:6px}
.fav,.inav,.cqav{width:42px;height:42px;border-radius:50%;overflow:hidden;background:#fff3;flex:none}.fav img,.inav img,.cqav img{width:100%;height:100%;object-fit:cover}
.fnm{flex:1;font-size:18px;font-weight:700}.fnm small{display:block;font-size:12px;font-weight:400;opacity:.85}
.fnm small b.ok{color:#5dff8a}.fnm small b.wt{color:#ffd23a}.fnm small b.no{color:#ff8a7a}

.invnote .intx{flex:1;font-size:18px}.invnote .intx small{display:block;font-size:13px;opacity:.8}.invnote .invx{background:none;border:0;font-size:22px;color:#7a4a00}
.ov.creq textarea{width:100%;box-sizing:border-box;font-size:20px;padding:8px 10px;border-radius:10px;border:2px solid #ffb84a;resize:none;font-family:inherit}
.ov.creq .crow input{width:100%}
.rqlist{margin-top:8px;text-align:left;font-size:14px}.rqrow{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.12)}.rqrow b{font-weight:600;color:#ffe08a;white-space:nowrap}
.linkb{background:none;border:0;color:#9fd2ff;text-decoration:underline;font-size:13px;margin-top:4px}
.creq{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;margin-bottom:8px;border:2px solid #ffcc4a}.creq.done{border-color:transparent;opacity:.75}
.cqh{display:flex;align-items:center;gap:8px;font-size:17px}.cqh i{margin-left:auto;font-size:12px;opacity:.8;font-style:normal}
.cqm{font-size:18px;margin:4px 0 6px}.cqs{font-size:14px;color:#9effb5}
.cqb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.cqb .chip{padding:6px 12px;font-size:15px}.ov .cqb input.cqc{width:84px!important;flex:none;font-size:15px;padding:5px 6px;height:auto;min-height:0;margin:0}

window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); BIP = e; var b = document.getElementById('inst'); if (b) b.style.display = ''; });
window.addEventListener('appinstalled', function () { BIP = null; toast('앱이 설치됐어요! 홈 화면의 맞고 아이콘으로 실행하세요', 2600); var b = document.getElementById('inst'); if (b) b.style.display = 'none'; });
// 설치된 앱으로 실행 중인지 (브라우저 탭의 전체화면 API는 제외)
function isStandalone() { try { return (matchMedia('(display-mode: fullscreen)').matches && !document.fullscreenElement && !document.webkitFullscreenElement) || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } }
var IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var IS_SAMSUNG = /SamsungBrowser/i.test(navigator.userAgent);
function installApp() {
  if (BIP) { BIP.prompt(); BIP.userChoice.then(function (c) { if (c && c.outcome === 'accepted') toast('설치 중이에요…'); BIP = null; }).catch(function () {}); return; }
  var how = IS_IOS ? 'Safari 아래쪽 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b> → 추가<br><small>(아이폰은 Safari에서만 설치할 수 있어요)</small>'
    : IS_SAMSUNG ? '삼성 인터넷 아래쪽 <b>메뉴(≡)</b> → <b>현재 페이지 추가</b> → <b>홈 화면</b><br><small>주소창 오른쪽에 설치(⬇) 아이콘이 보이면 그걸 눌러도 돼요</small>'
      : '크롬 오른쪽 위 <b>메뉴(⋮)</b> → <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>';
  modal('<div class="mtitle">맞고 앱 설치</div><div class="pdesc">' + how + '</div><div class="small" style="margin-top:8px">설치하면 주소창 없이 전체화면·가로로 바로 실행돼요</div><div class="mrow"><button class="gbtn blue" data-close>확인</button></div>', 'pop');
}
window.__mgOnUpdate = function () {
  if (!G) location.reload();
  else { UI.needReload = true; toast('새 버전이 준비됐어요. 게임을 마치고 로비로 가면 적용돼요', 2600); }
};

/* 화면: 닉네임, 로비, 모드 선택, 매칭, 관리자/충전, 설정, 대기실 */
function show(html, cls) {
  closeModal();
  wipeStage('<div class="scr ' + (cls || '') + '">' + html + '</div>');
  root.className = cls && cls.indexOf('felt') >= 0 ? 'bg-felt' : 'bg-night';
}
function logoHtml(small) { return '<div class="logo' + (small ? ' sm' : '') + '" id="logo"><span class="l1">맞고</span><span class="l2">한판</span></div>'; }

function scrNick() {
  var sel = (me && me.av) || AVS[0];
  show('<div class="nickwrap">' + logoHtml() +
    '<div class="npanel"><div class="ptitle">닉네임을 정해 주세요</div>' +
    '<input id="nk" maxlength="8" placeholder="닉네임 (2~8자)" value="' + esc((me && me.nick) || '') + '" autocomplete="off">' +
    '<div class="avsel">' + AVS.map(function (a) { return '<button class="avb' + (a === sel ? ' on' : '') + '" data-av="' + a + '">' + avImg(a) + '</button>'; }).join('') + '</div>' +
    '<button class="gbtn blue big" id="go">게임 시작</button><div class="hint2">회원가입 없이 바로 시작 · 게임머니 전용</div></div></div>', 'night');
  $$('.avb').forEach(function (b) { b.onclick = function () { SND.play('click'); sel = b.dataset.av; $$('.avb').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
  $('#go').onclick = function () {
    var n = $('#nk').value.trim();
    if (n.length < 2) return toast('닉네임은 2자 이상이에요');
    SND.play('click');
    if (!me) me = { uid: uid(), chips: START_MONEY };
    me.nick = n.slice(0, 8); me.av = sel; saveMe(); route();
  };
}

function topBar() {
  return '<div class="topbar"><div class="tb-me"><div class="tb-av">' + avImg(me.av) + '</div><div><div class="tb-nk">' + esc(me.nick) + ' <span class="lv">Lv.' + level() + '</span></div>' +
    '<div class="tb-st">' + stats.win + '승 ' + stats.lose + '패</div></div></div>' +
    '<div class="tb-money"><i class="coin"></i><span id="mymoney">' + money(me.chips) + '</span><button class="gbtn green sm tb-chg" id="code">충전</button><small class="rqstat" id="rqstat"></small></div>' +
    (selfChargeOK() ? '<button class="gbtn gold sm selfc" id="selfc">+1억 충전</button>' : '') + (isStandalone() ? '' : '<button class="gbtn green sm" id="inst">📲 앱 설치</button>') + '<div class="tb-btns"><button class="ibtn" id="opt" title="설정">⚙</button></div></div>';
}

function scrLobby() {
  if (UI.needReload) { location.reload(); return; }
  stopNet(); G = null; UI.queue = []; UI.busy = false;
  if (history.replaceState && location.search) history.replaceState(null, '', location.pathname);
  var recent = ls('mg_recent', []).slice(0, 3), invi = inviteInfo();
  show(topBar() +
    '<div class="lob">' +
    '<div class="lob-head">' + logoHtml(true) + '<div class="lob-tabs"><span class="on">맞고</span><span class="dim">고스톱 (준비중)</span></div></div>' +
    '<div class="lob-sec">컴퓨터와 한판 <small>보유머니에 맞는 채널을 고르세요 · 좌우로 넘겨 더 높은 채널</small></div>' +
    '<div class="chans" id="chans">' +
    '<div class="chan cx"><div class="ch-t">자유입장</div><div class="ch-n">직접입력</div><input id="cust" placeholder="예) 5만, 3억" value=""><div class="ch-s">보유머니 제한 없음</div><button class="gbtn orange" id="custgo">입장</button></div>' +
    channelList(me.chips).map(function (c, i) {
      var okk = chOk(c, me.chips), low = B(me.chips) < B(c.min);
      return '<div class="chan c' + (i % 6) + (okk ? '' : ' lock') + '"><div class="ch-t">점당</div><div class="ch-n">' + c.n + '</div><div class="ch-s">입장 ' + kor(c.min, 1) + '↑' + '<br>최대 ' + kor(c.max, 1) + '</div>' +
        (okk ? '<button class="gbtn blue" data-ch="' + c.p + '">입장</button>' : '<div class="lk">🔒 ' + (low ? '머니 부족' : '머니 초과') + '</div>') + '</div>';
    }).join('') + '</div>' +
    '<div class="lob-sec">친구와 한판 <small>방을 만들고 초대 링크를 보내세요</small></div>' +
    '<div class="friend"><button class="gbtn orange" id="mk">방 만들기</button><button class="gbtn blue" id="fr">👥 친구 <small>' + friends().length + '</small></button>' +
    '<div class="joinbox"><input id="jc" maxlength="6" placeholder="방 코드 6자리"><button class="gbtn green" id="jg">입장</button></div>' +
    (invi ? '<div class="invbar" id="invbar">📩 초대받은 방 <b>' + invi.code + '</b><button class="gbtn green sm" id="invgo">입장</button><button class="invx" id="invx">✕</button></div>' : '') +
    (recent.length ? '<div class="recent">최근 방 ' + recent.map(function (r) { return '<button class="chip" data-room="' + r.code + '">' + r.code + (r.role === 'host' ? ' (방장)' : '') + '</button>'; }).join('') + '</div>' : '') +
    '</div></div>', 'night');
  // 로고 5번 → 관리자
  var taps = [];
  $('#logo').onclick = function () { var n = Date.now(); taps = taps.filter(function (t) { return n - t < 2500; }); taps.push(n); if (taps.length >= 5) { taps = []; adminEntry(); } };
  $$('[data-ch]').forEach(function (b) { b.onclick = function () { SND.play('click'); modePopup(b.dataset.ch, function (o) { o.free = false; startPractice(b.dataset.ch, o); }); }; });
  // 내가 들어갈 수 있는 가장 높은 채널이 보이게 스크롤
  var okc = $$('.chan:not(.lock):not(.cx)'); if (okc.length > 2) $('#chans').scrollLeft = okc[okc.length - 1].offsetLeft - 400;
  $('#custgo').onclick = function () {
    var v = M$.parse($('#cust').value);
    if (!v || v <= 0n) return toast('금액을 입력해 주세요 (예: 5만, 3억)');
    SND.play('click'); modePopup(v.toString(), function (o) { o.free = true; startPractice(v.toString(), o); }, true);
  };
  $('#mk').onclick = function () { SND.play('click'); hostRoom(newCode(), true); };
  $('#jg').onclick = function () { var c = $('#jc').value.trim().toUpperCase(); if (!/^[A-Z0-9]{6}$/.test(c)) return toast('방 코드 6자리를 넣어 주세요'); SND.play('click'); openRoom(c); };
  $$('[data-room]').forEach(function (b) { b.onclick = function () { openRoom(b.dataset.room); }; });
  if ($('#invgo')) $('#invgo').onclick = function () { SND.play('click'); openRoom(invi.code); };
  if ($('#invx')) $('#invx').onclick = function () { localStorage.removeItem('mg_invite'); var e = $('#invbar'); if (e) e.remove(); };
  $('#opt').onclick = function () { SND.play('click'); showSettings(); };
  $('#code').onclick = function () { SND.play('click'); chargeRequestPopup(); };
  $('#fr').onclick = function () { SND.play('click'); friendsPopup(); };
  applyPendingCharges(); refreshMoney(); homeStart(); updHomeUi();
  if ($('#selfc')) $('#selfc').onclick = function () { selfCharge(); };
  if ($('#inst')) $('#inst').onclick = function () { SND.play('click'); installApp(); };
  SND.bgm(true);
}

function modePopup(ppp, cb, free) {
  var o = modal('<div class="mtitle">모드 선택</div><div class="modes">' +
    '<button class="mode" data-m="normal"><b>일반 모드</b><span>한 턴 ' + TURN_MS.normal / 1000 + '초 · 보통 속도</span></button>' +
    '<button class="mode sp" data-m="speed"><b>⚡ 스피드 모드</b><span>한 턴 ' + TURN_MS.speed / 1000 + '초 · 1.5배속</span></button></div>' +
    '<label class="chk"><input type="checkbox" id="mis" ' + (prefs.missions ? 'checked' : '') + '> 판 미션 켜기</label>' +
    '<div class="mfoot">' + (free ? '자유입장 · ' : '') + '점당 ' + money(ppp) + (free ? ' · 머니가 마이너스가 되어도 계속 진행' : '') + '</div><button class="xbtn" data-close>✕</button>', 'pop');
  $$('.mode', o).forEach(function (b) {
    b.onclick = function () { SND.play('click'); prefs.speed = b.dataset.m === 'speed'; prefs.missions = $('#mis').checked; savePrefs(); closeModal(); cb({ speed: prefs.speed, missions: prefs.missions }); };
  });
}

function matching(cb) {
  show('<div class="matching"><div class="spin"></div><div class="mt">대전 상대 찾는 중<span class="dots"></span></div></div>', 'felt');
  SND.play('shuffle');
  setTimeout(cb, 1300);
}

// ---- 관리자 ----
function adminEntry() {
  if (isAdmin()) return adminPanel();
  var o = modal('<div class="mtitle">관리자 모드</div><input id="pin" type="password" inputmode="numeric" maxlength="12" placeholder="관리자 PIN"><div class="mrow"><button class="gbtn gray" data-close>취소</button><button class="gbtn blue" id="pok">확인</button></div>', 'pop');
  $('#pok', o).onclick = function () {
    if (M$.pinHash($('#pin', o).value.trim()) !== pinHashNow()) { SND.play('fail'); return toast('PIN이 틀렸어요'); }
    ss('mg_admin', pinHashNow()); SND.play('mission'); closeModal(); homeStart(); if (!G) scrLobby(); adminPanel();
  };
}
function amountPicker(id) {
  return '<div class="amts">' + ['10만', '100만', '1000만', '1억', '10억', '100억'].map(function (a) { return '<button class="chip" data-amt="' + a + '">' + a + '</button>'; }).join('') + '</div><input id="' + id + '" placeholder="금액 (예: 5억 3000만)">';
}
function bindAmts(o, id) { $$('[data-amt]', o).forEach(function (b) { b.onclick = function () { $('#' + id, o).value = b.dataset.amt; }; }); }
function adminPanel() {
  var nr = newReqCount();
  var o = modal('<div class="mtitle">관리자 메뉴</div>' +
    '<div class="mrow"><button class="gbtn gold" id="ainb">💰 충전 요청함' + (nr ? ' <i class="badge">' + nr + '</i>' : '') + '</button></div>' +
    '<div class="sec">내 머니: <b>' + money(me.chips) + '</b></div>' + amountPicker('am') +
    '<div class="mrow"><button class="gbtn green" id="addm">충전(+)</button><button class="gbtn orange" id="setm">이 금액으로 설정</button></div>' +
    '<div class="sec">충전허용코드 발급 (예비) <small>충전 요청이 안 될 때만 · 한 번 충전용 · 받은 사람이 충전 버튼에 붙여넣으면 그 금액만큼 1회 충전</small></div>' +
    '<div class="amts" id="cpre">' + ['1억', '3억', '5억', '10억'].map(function (a) { return '<button class="chip' + (a === '1억' ? ' on' : '') + '" data-camt="' + a + '">' + a + '</button>'; }).join('') + '</div><input id="cam" value="1억" placeholder="직접 입력 (예: 2억 5000만)">' +
    '<div class="mrow"><button class="gbtn blue" id="mkc">새 허용코드 만들기</button></div><div id="codeout"></div>' +
    '<div class="mrow sm"><button class="gbtn gray" id="pinc">PIN 변경</button><button class="gbtn gray" id="aoff">관리자 끄기</button></div><div class="mrow"><button class="gbtn blue" data-close>닫기</button></div><button class="xbtn" id="admx" data-close aria-label="닫기">✕</button>', 'pop wide adm bgclose');
  bindAmts(o, 'am');
  $('#ainb', o).onclick = function () { SND.play('click'); adminInbox(); };
  function amt() { var v = M$.parse($('#am', o).value); if (!v || v <= 0n) { toast('금액을 넣어 주세요'); return null; } return v; }
  $('#addm', o).onclick = function () { var v = amt(); if (!v) return; me.chips = (B(me.chips) + v).toString(); saveMe(); SND.play('coin'); toast(money(v) + ' 충전 완료'); adminPanel(); refreshMoney(); };
  $('#setm', o).onclick = function () { var v = amt(); if (!v) return; me.chips = v.toString(); saveMe(); SND.play('coin'); toast('머니를 ' + money(v) + '으로 설정'); adminPanel(); refreshMoney(); };
  $$('[data-camt]', o).forEach(function (b) { b.onclick = function () { $$('[data-camt]', o).forEach(function (x) { x.classList.toggle('on', x === b); }); $('#cam', o).value = b.dataset.camt; }; });
  $('#cam', o).oninput = function () { $$('[data-camt]', o).forEach(function (x) { x.classList.toggle('on', x.dataset.camt === $('#cam', o).value.trim()); }); };
  $('#mkc', o).onclick = function () {
    var v = M$.parse($('#cam', o).value); if (!v || v <= 0n) return toast('금액을 넣어 주세요');
    var c = newChargeCode(v); SND.play('click');
    $('#codeout', o).innerHTML = '<div class="codebox">' + c + '</div><div class="small"><b>' + money(v) + '</b> · 한 번 충전용 (한 번 쓰면 소진) · 누를 때마다 새 코드</div><div class="mrow"><button class="gbtn blue" id="cpc">복사/공유</button></div>';
    try { $('#cpc', o).scrollIntoView({ block: 'nearest' }); } catch (e) {}
    $('#cpc', o).onclick = function () { shareText('맞고 한판 충전허용코드 (' + money(v) + ', 한 번 충전용)\n' + c + '\n로비나 게임 화면의 [충전] 버튼을 눌러 붙여넣으세요'); };
  };
  $('#pinc', o).onclick = function () {
    var p = prompt('새 PIN (4~12자리)'); if (!p) return; p = p.trim();
    if (p.length < 4) return toast('4자리 이상');
    ss('mg_pinhash', M$.pinHash(p)); ss('mg_admin', M$.pinHash(p)); toast('PIN이 바뀌었어요');
  };
  $('#aoff', o).onclick = function () { localStorage.removeItem('mg_admin'); closeModal(); toast('관리자 모드를 껐어요'); homeStart(); if (!G) scrLobby(); };
}
function refreshMoney() { var e = $('#mymoney'); if (e) e.textContent = money(me.chips); }
// 충전 입력창 (로비·대기실·게임·결과 어디서든). 코드 1개 = 1회 충전, 코드 금액만큼
function redeemPopup() {
  var body = ('<div class="mtitle">충전</div><div class="pdesc">관리자에게 받은 <b>충전허용코드</b>를 붙여넣으세요<br><small>코드 1개 = 1회 충전 (코드에 담긴 금액)</small></div>' +
    '<div class="crow"><input id="rc" placeholder="MC-…" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="gbtn gray sm" id="rpaste">붙여넣기</button></div>') +
    '<div class="mrow"><button class="gbtn gray" data-cclose>닫기</button><button class="gbtn green" id="rok">충전</button></div>';
  closeCode();
  var o = document.createElement('div'); o.id = 'ovc'; o.className = 'ov top pop'; o.innerHTML = '<div class="mbox">' + body + '</div>'; stage.appendChild(o);
  $$('[data-cclose]', o).forEach(function (b) { b.onclick = function () { SND.play('click'); closeCode(); }; });
  function go() { if (redeemCode($('#rc', o).value)) closeCode(); }
  $('#rok', o).onclick = function () { SND.play('click'); go(); };
  $('#rc', o).onkeydown = function (e) { if (e.key === 'Enter') go(); };
  $('#rc', o).addEventListener('paste', function () { setTimeout(function () { if (M$.readCode($('#rc', o).value)) go(); }, 30); });
  $('#rpaste', o).onclick = function () {
    SND.play('click');
    if (navigator.clipboard && navigator.clipboard.readText) navigator.clipboard.readText().then(function (txt) { $('#rc', o).value = String(txt || '').trim(); if (M$.readCode(txt)) go(); else toast('복사한 내용에 코드가 없어요'); }, function () { toast('입력칸을 길게 눌러 붙여넣어 주세요'); $('#rc', o).focus(); });
    else { toast('입력칸을 길게 눌러 붙여넣어 주세요'); $('#rc', o).focus(); }
  };
  return o;
}
function redeemCode(str, quiet) {
  var r = M$.readCode(str);
  if (!r) { SND.play('fail'); toast(/MG-/i.test(String(str)) ? '예전 형식 코드예요. 새 충전허용코드를 받아 주세요' : '올바르지 않은 코드예요'); return false; }
  if (codeUsed(r.id)) { SND.play('fail'); toast('이미 사용한 코드예요'); return false; }
  markUsed(r.id); addMyMoney(r.amount);
  SND.play('coin'); SND.play('mission'); toast((quiet || '') + money(r.amount) + ' 충전됐어요! 보유 ' + money(me.chips), 2400);
  return true;
}
function updPm() { if (!G || !G.chips) return; [0, 1].forEach(function (i) { var e = $('#pb' + i + ' .pm'); if (e) e.textContent = money(G.chips[i]); }); }
function addMyMoney(a) {
  if (G && (G.mode === 'ai' || G.mode === 'host')) {
    G.chips[G.seat] = (B(G.chips[G.seat]) + a).toString(); if (G.room) G.room.chips = G.chips; me.chips = G.chips[G.seat]; saveMe();
    if (G.mode === 'host') { saveHost(); broadcast(); }
    updPm(); if (G.room && !G.view && !$('#game')) scrRoom();
  } else if (!G) { me.chips = (B(me.chips) + a).toString(); saveMe(); refreshMoney(); }
}
function shareText(txt) {
  if (navigator.share) { navigator.share({ text: txt }).catch(function () {}); return; }
  copy(txt);
}
function copy(txt) {
  function fb() { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('복사했어요'); } catch (e) { prompt('복사해서 보내세요', txt); } ta.remove(); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('복사했어요'); }, fb); else fb();
}

function showSettings() {
  var o = SND.opt;
  var m = modal('<div class="mtitle">설정</div><div class="opts">' +
    [['sfx', '효과음'], ['bgm', '배경음악'], ['voice', '음성']].map(function (x) { return '<label class="tog"><span>' + x[1] + '</span><input type="checkbox" data-o="' + x[0] + '" ' + (o[x[0]] !== false ? 'checked' : '') + '><i></i></label>'; }).join('') +

/* 입력, 시계, 연출(FX), 이모티콘 */
function SP() { return G && G.speed ? 0.67 : 1; }
function fxLayer() { var e = $('#fxl'); if (!e) { e = document.createElement('div'); e.id = 'fxl'; stage.appendChild(e); } return e; }

function bindGame() {
  var hand = $('#hand');
  $$('#hand .hc').forEach(function (el) {
    var id = +el.dataset.k;
    el.addEventListener('pointerdown', function (e) {
      if (!canInput()) return;
      e.preventDefault();
      var st = toStage(e.clientX, e.clientY), moved = false;
      try { el.setPointerCapture(e.pointerId); } catch (x) {}
      el.classList.add('lift');
      function mv(ev) {
        var p = toStage(ev.clientX, ev.clientY), dx = p.x - st.x, dy = p.y - st.y;
        if (!moved && Math.abs(dx) + Math.abs(dy) > 12) moved = true;
        if (moved) el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.05)';
      }
      function up(ev) {
        el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
        el.classList.remove('lift');
        var p = toStage(ev.clientX, ev.clientY);
        if (moved && p.y - st.y > -70) { el.style.transform = ''; return; } // 위로 충분히 안 끌면 취소
        el.style.transform = '';
        onHand(id);
      }
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
  });
  // 바닥 패: 터치 즉시(pointerup) 반응 + 마우스 click 보조 (중복 호출은 onFloor 안에서 무시)
  $$('#game .cd.fl').forEach(function (el) {
    var k = +el.dataset.k;
    el.addEventListener('pointerup', function (e) { if (e.pointerType !== 'mouse') onFloor(k); });
    el.onclick = function () { onFloor(k); };
  });
  // 선택창 바깥(어두운 곳) 탭 → 선택 취소. 손패를 고른 그 탭에서 따라오는 click(고스트)은 무시
  var po = $('.pickov'); if (po) po.onclick = function (e) { if (e.target === po && UI.sel && Date.now() - (UI.selAt || 0) > 450) { UI.sel = null; renderGame(); } };
  $('#autob').onclick = function () { UI.auto = !UI.auto; SND.play('click'); this.classList.toggle('on', UI.auto); toast(UI.auto ? '자동 치기 켜짐' : '자동 치기 꺼짐', 900); kickAuto(); };
  $('#emob').onclick = function () { SND.play('click'); emoPalette(); };
  $('#exit').onclick = function () { SND.play('click'); confirmLeave(); };
  $('#menu').onclick = function () { SND.play('click'); gameMenu(); };
  $('#sett').onclick = function () { SND.play('click'); showSettings(); };
  if ($('#chg')) $('#chg').onclick = function () { SND.play('click'); chargeWho(); };
  if ($('#stat')) $('#stat').onclick = function () { SND.play('click'); statPopup(); };
}
function onHand(id) {
  var v = UI.view; if (!canInput() || v.phase !== 'play') return;
  if (UI.sel) { UI.sel = null; }
  SND.play('click');
  var c = R.C(id);
  if (id >= R.DUMMY0 || c.bonus) return doAction({ type: 'play', card: id });
  var o = R.playOptions(v, G.seat, id);
  function normal(shake) {
    if (o.targets) { UI.sel = { card: id, shake: shake, targets: o.targets }; UI.selAt = Date.now(); renderGame(); return; }
    doAction({ type: 'play', card: id, shake: shake || undefined });
  }
  if (o.canBomb) return askPrompt('폭탄', '같은 월 3장을 한꺼번에 내고 바닥 패까지 먹어요 (×2, 피 1장)', v.hands[G.seat].filter(function (x) { return x < 48 && R.C(x).m === c.m; }), '폭탄!', function (y) { if (y) doAction({ type: 'play', card: id, bomb: true }); else normal(false); });
  if (o.canGrenade) return askPrompt('수류탄', '같은 월 2장을 내고 바닥 2장을 먹어요 (피 1장)', v.hands[G.seat].filter(function (x) { return x < 48 && R.C(x).m === c.m; }), '수류탄!', function (y) { if (y) doAction({ type: 'play', card: id, grenade: true }); else normal(false); });
  if (o.canShake) return askPrompt('흔들기', '같은 월 3장을 보여 주고 이기면 ×2', v.hands[G.seat].filter(function (x) { return x < 48 && R.C(x).m === c.m; }), '흔들기!', function (y) { normal(y); });
  normal(false);
}
function onFloor(id) {
  var v = UI.view;
  if (!canInput()) return;
  if (UI.sel && UI.sel.targets.indexOf(id) >= 0) { var s = UI.sel; UI.sel = null; SND.play('click'); return doAction({ type: 'play', card: s.card, target: id, shake: s.shake || undefined }); }
  if (v.phase === 'pickFlip' && v.pending && v.pending.opts.indexOf(id) >= 0) { SND.play('click'); doAction({ type: 'pickFlip', target: id }); }
}

  $('#pyes', o).onclick = function () { SND.play('click'); closeModal(); cb(true); };

function newRoundHost() {

  G.state = R.newRound({ first: G.first, mult: G.mult, cfg: { missions: G.missions, piBakZero: true } });
  G.paid = 0; G.settled = false; G.lastWin = null; G.contAt = 0;
  G.ver++;

}
function payMoney(from, to, amt) {
  amt = B(amt); var capped = false;
  if (!G.free) { var have = B(G.chips[from]); if (have < 0n) have = 0n; if (amt > have) { amt = have; capped = true; } }
  G.chips[from] = (B(G.chips[from]) - amt).toString(); G.chips[to] = (B(G.chips[to]) + amt).toString();

}
function afterState(fresh) {
  var s = G.state, ppp = B(G.ppp);
  while (G.paid < s.instant.length) { var x = s.instant[G.paid++]; payMoney(1 - x.to, x.to, B(x.pts) * ppp); }
  if (s.phase === 'end' && !G.settled) {
    G.settled = true; var r = s.result;
    if (r.nagari) G.mult = r.nextMult;
    else { var pr = payMoney(1 - r.winner, r.winner, B(r.pts) * ppp); G.lastWin = { winner: r.winner, paid: pr.amt.toString(), capped: pr.capped }; G.first = r.winner; G.mult = 1; }
    G.contAt = Date.now() + 6500 + 3500 * SP();
    if (G.mode === 'ai') aiRefill();
    G.blockMsg = nextBlock();
    G.deadline = 0;
  } else if (s.phase !== 'end') {
    G.dlFor = s.turn;
    G.deadline = Date.now() + TURN_MS[G.speed ? 'speed' : 'normal'] + (fresh ? 4500 : 1900) * SP();
  }
  if (G.mode === 'ai') { me.chips = G.chips[0]; saveMe(); }
  if (G.mode === 'host') { G.room.chips = G.chips; G.room.status = 'play'; saveHost(); broadcast(); }
  G.view = R.view(s, G.seat);
  present(G.view, { round: G.round, ver: G.ver });
}

    var nk = G.players[i] ? G.players[i].nick : '';
    return nk + '님 머니가 이 채널 입장 최소(' + money(ch.min) + ')보다 적어요. ' + (isAdmin() ? '메뉴에서 충전하세요.' : '충전 후 계속할 수 있어요.');

/* v3.2 홈 연결 (서버 없음): 앱이 켜져 있는 동안 기기마다 고정 peer id로 PeerJS 중계 서버에 접속
   - 친구 초대: 친구 기기 peer id로 직접 초대 메시지 → 앱 안 알림 → 탭 한 번 입장 (꺼져 있으면 10분 동안 재전송, 대신 웹앱 링크 공유)
   - 충전 요청: 참가자 → 관리자 고정 peer id, 관리자 지급 → 참가자 peer id (상대가 꺼져 있으면 보관 후 자동 재전송)
   한계: 받는 쪽 앱(브라우저 탭)이 켜져 있어야 전달됨. 푸시 알림·서버 보관 없음. 기록은 각 기기 localStorage */
var ADMIN_PEER = PEER_PREFIX + 'admin-jb';
var HOME = { peer: null, id: '', state: '', sending: {} };
var INV_TTL = 10 * 60e3, REQ_DEF = '돈주세요멍멍!';
function myPid() { return isAdmin() ? ADMIN_PEER : PEER_PREFIX + 'u-' + me.uid; }
function shortPid(pid) { return String(pid || '').replace(PEER_PREFIX, ''); }
function fullPid(s) { s = String(s || ''); return s.indexOf(PEER_PREFIX) === 0 ? s : PEER_PREFIX + s; }

function homeStop() { try { if (HOME.peer) HOME.peer.destroy(); } catch (e) {} HOME.peer = null; HOME.state = ''; }
function homeStart() {
  if (!me || !me.nick) return;
  if (!window.Peer) { clearTimeout(HOME.wt); HOME.wt = setTimeout(homeStart, 2000); return; }
  var id = myPid();
  if (HOME.peer && HOME.id === id && !HOME.peer.destroyed && HOME.state !== 'err') return;
  homeStop();
  HOME.id = id; HOME.state = 'opening';
  var p = new window.Peer(id, { debug: 0 }); HOME.peer = p;
  p.on('open', function () { if (HOME.peer !== p) return; HOME.state = 'open'; updHomeUi(); flushOutbox(); });
  p.on('connection', function (c) { c.on('data', function (d) { homeOnData(c, d); }); });
  p.on('disconnected', function () { if (HOME.peer === p && !p.destroyed) setTimeout(function () { try { p.reconnect(); } catch (e) {} }, 2000); });
  p.on('error', function (e) {
    if (HOME.peer !== p || e.type === 'peer-unavailable') return; // 보낼 상대가 꺼져 있음 → 보관함에서 다시 시도
    HOME.state = e.type === 'unavailable-id' ? 'taken' : 'err'; updHomeUi();
    try { p.destroy(); } catch (x) {}
    clearTimeout(HOME.rt); HOME.rt = setTimeout(function () { if (HOME.peer === p) { HOME.peer = null; homeStart(); } }, e.type === 'unavailable-id' ? (isAdmin() ? 10000 : 4000) : 6000);
  });
}
window.addEventListener('pagehide', function () { homeStop(); });
setInterval(function () { if (me && me.nick) { homeStart(); if (HOME.state === 'open') flushOutbox(); } }, 12000);

function queueMsg(to, msg, ttl) {
  var ob = outbox(); msg.id = msg.id || uid();
  ob = ob.filter(function (x) { return x.msg.id !== msg.id; });
  ob.push({ to: to, msg: msg, ts: Date.now(), ttl: ttl || 0 }); ss('mg_outbox', ob);
  flushOutbox(); return msg.id;
}
function obRemove(id) { ss('mg_outbox', outbox().filter(function (x) { return x.msg.id !== id; })); }
function flushOutbox() {
  if (!HOME.peer || HOME.state !== 'open') return;
  var now = Date.now(), ob = outbox(), keep = ob.filter(function (x) { return !x.ttl || now - x.ts < x.ttl; });
  if (keep.length !== ob.length) { ss('mg_outbox', keep); ob.filter(function (x) { return keep.indexOf(x) < 0; }).forEach(function (x) { onExpired(x); }); }
  keep.forEach(function (x) { sendNow(x); });
}
function sendNow(x) {
  var id = x.msg.id; if (HOME.sending[id]) return; HOME.sending[id] = 1;
  var c, done = false;
  function fin(ok) { if (done) return; done = true; delete HOME.sending[id]; try { c && c.close(); } catch (e) {} if (ok) { obRemove(id); onDelivered(x); } else onPending(x); }
  try { c = HOME.peer.connect(x.to, { reliable: true }); } catch (e) { return fin(false); }
  var to = setTimeout(function () { fin(false); }, 8000);
  c.on('open', function () { try { c.send(x.msg); } catch (e) {} });
  c.on('data', function (d) { if (d && d.t === 'ack' && d.id === id) { clearTimeout(to); fin(true); } });
  c.on('error', function () { clearTimeout(to); fin(false); });
}
function onDelivered(x) {
  var m = x.msg;
  if (m.t === 'creq') { setMyReq(m.id, { st: 'sent' }); }
  if (m.t === 'inv') { if (!x.quiet) toast('초대 알림을 보냈어요 ✓', 1400); setInvState(x.to, 'sent'); }
  if (m.t === 'chg' || m.t === 'cdecl') setCreq(m.id, { dl: 1 });
  updHomeUi();
}
function onPending(x) { if (x.msg.t === 'inv') setInvState(x.to, 'wait'); if (x.msg.t === 'creq') setMyReq(x.msg.id, { st: 'wait' }); updHomeUi(); }
function onExpired(x) { if (x.msg.t === 'inv') setInvState(x.to, 'exp'); updHomeUi(); }

// ---- 받기 ----
function homeOnData(c, d) {
  if (!d || typeof d !== 'object' || !d.t) return;
  var ack = function () { try { c.send({ t: 'ack', id: d.id }); } catch (e) {} setTimeout(function () { try { c.close(); } catch (e) {} }, 1500); };
  var from = d.from && d.from.pid === c.peer ? d.from : (d.from ? { pid: c.peer, nick: d.from.nick, av: d.from.av } : null);
  if (d.t === 'inv') {
    ack(); if (!from || !/^[A-Z0-9]{6}$/.test(d.room || '') || Date.now() - (d.ts || 0) > INV_TTL + 60e3) return;
    addFriend(from, 'invite'); showInviteNote(from, d.room);
  } else if (d.t === 'fadd') {
    ack(); if (!from) return; var isNew = addFriend(from, 'link'); if (isNew) toast(String(from.nick).slice(0, 8) + '님과 친구가 됐어요', 1800);
  } else if (d.t === 'creq') {
    ack(); if (!isAdmin() || !from) return;
    var L = ls('mg_creqs', []); if (L.some(function (r) { return r.id === d.id; })) return;
    L.unshift({ id: String(d.id).slice(0, 20), from: { pid: from.pid, nick: String(from.nick || '손님').slice(0, 8), av: normAv(from.av) }, msg: String(d.msg || REQ_DEF).slice(0, 60), amt: d.amt ? String(d.amt).replace(/\D/g, '').slice(0, 20) : '', ts: Date.now(), st: 'new' });
    ss('mg_creqs', L.slice(0, 50)); SND.play('coin'); toast('💰 ' + L[0].from.nick + '님 충전 요청: ' + L[0].msg, 2600); updHomeUi();
    if ($('#creqs')) adminInbox();
  } else if (d.t === 'chg' || d.t === 'cdecl') {
    ack(); if (c.peer !== ADMIN_PEER) return; // 관리자 고정 id에서 온 것만
    var dn = ls('mg_chgdone', []); if (dn.indexOf(d.id) >= 0) return; dn.push(d.id); ss('mg_chgdone', dn.slice(-200));
    if (d.t === 'cdecl') { setMyReq(d.id, { st: 'decl' }); toast('관리자가 이번 충전 요청을 거절했어요', 2400); updHomeUi(); return; }
    var a = B(String(d.amt || '0').replace(/\D/g, '') || '0'); if (a <= 0n) return;
    setMyReq(d.id, { st: 'done', got: a.toString() });
    if (G) { var pd = ls('mg_pendchg', []); pd.push(a.toString()); ss('mg_pendchg', pd); toast('💰 관리자가 ' + money(a) + ' 충전해 줬어요! 로비로 가면 들어와요', 3000); }
    else { me.chips = (B(me.chips) + a).toString(); saveMe(); refreshMoney(); SND.play('coin'); toast('💰 관리자가 ' + money(a) + ' 충전해 줬어요!', 3000); }
    updHomeUi();
  }
}
function applyPendingCharges() { var pd = ls('mg_pendchg', []); if (!pd.length || G) return; var s = 0n; pd.forEach(function (x) { s += B(x); }); me.chips = (B(me.chips) + s).toString(); saveMe(); ss('mg_pendchg', []); toast('💰 관리자 충전 ' + money(s) + ' 들어왔어요', 2400); }

// ---- 친구 ----
function friends() { return ls('mg_friends', []); }

  var L = friends(), ex = L.find(function (x) { return x.pid === f.pid; });
  if (ex) { ex.nick = String(f.nick || ex.nick).slice(0, 8); ex.av = normAv(f.av || ex.av); ex.ts = Date.now(); }
  else L.unshift({ pid: f.pid, nick: String(f.nick || '친구').slice(0, 8), av: normAv(f.av), ts: Date.now(), src: src || 'game' });
  L.sort(function (a, b) { return b.ts - a.ts; }); ss('mg_friends', L.slice(0, 60)); return !ex;
}
function removeFriend(pid) { ss('mg_friends', friends().filter(function (x) { return x.pid !== pid; })); }

  queueMsg(card.pid, { t: 'fadd', from: myCard(), ts: Date.now() }, 7 * 24 * 3600e3);
  setTimeout(function () { toast((isNew ? '' : '이미 ') + card.nick.slice(0, 8) + '님과 친구예요 · 친구 목록에서 탭 한 번으로 초대할 수 있어요', 2600); }, 600);
  return true;
}

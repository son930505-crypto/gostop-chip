<body>
<header><h1>맞고 칩 관리</h1><div style="display:flex;align-items:center;gap:8px"><button type="button" class="fsbtn fsx" onclick="fsToggle()">⛶ 전체화면</button><span id="mult" class="tag hide"></span></div></header>
<div id="robar" class="robar hide"></div>
<main id="app"></main>

<script id="logic">
// ===== 순수 로직 (node 테스트 대상) =====
var L = (function(){
  function won(n){ n = Math.round(n); return (n<0?'-':'') + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '원'; }
  // 충전 버튼 금액 (고정): +1만원, +5만원, +10만원
  var CHARGE_AMTS = [10000, 50000, 100000];
  // limit = 기본 충전 금액(예전 데이터 호환용). 새 게임은 항상 모두 잔액 0원, 넣은 돈 0원에서 시작 (자동 충전 없음)
  function newGame(names, limit, ppp){
    var st0 = 0;
    return { limit: limit, ppp: ppp, start: st0, nextMult: 1, round: 0, gwangpal: true, ctScore: 10, giveupMult: 2, gwangPrice: 1500, gwangPayer: 'noSeon',
      players: names.map(function(n){ return {name:n, bal:st0, charges:st0>0?1:0, invested:st0}; }),
      log: [], chg: [], chgSeq: 0, tierOn: true, t0: null };
  }
  function active(g, i){ return g.players[i].bal > 0; }
  // 이번 판에 실제로 치는 사람: 잔액>0, 광팔이(rest)·죽은 사람(dead) 제외. 광팔이 규칙이 켜져 있으면 치는 사람은 2~3명
  function roundPlayers(g, rest, dead){
    rest = rest || {}; dead = dead || {};
    var act = g.players.map(function(p,i){return i;}).filter(function(i){ return g.players[i].bal>0; });
    if (g.gwangpal === false){ var pl = act.filter(function(i){ return !dead[i]; }); return {ok: pl.length>=2, play: pl, need: 0}; }
    var nDead = act.filter(function(i){ return dead[i] && !rest[i]; }).length;
    var need = Math.max(0, act.length-3-nDead);
    var play = act.filter(function(i){ return !rest[i] && !dead[i]; });
    return {ok: play.length>=2 && play.length<=3, play: play, need: need};
  }
  // 4명 순서 자동 판정: order=[선, 두 번째, 세 번째, 마지막], d2·d3 = 'go'(진행) 또는 'die'(포기)
  // 두 번째·세 번째가 모두 진행하면 마지막 주자가 광팔이, 한 명이라도 포기하면 마지막 주자는 참여
  function autoSeat(order, d2, d3){
    var rest = {}, dead = {};
    if (d2==='die') dead[order[1]] = true;
    if (d3==='die') dead[order[2]] = true;
    if (d2!=='die' && d3!=='die') rest[order[3]] = true;
    return {rest: rest, dead: dead, lastRests: d2!=='die' && d3!=='die'};
  }
  // 단순 순서: 선만 고르면 사람 목록(자리) 순서대로 선 다음부터 두 번째·세 번째·마지막 (잔액 있는 사람만)
  function seatOrder(g, seon){
    var act = g.players.map(function(p,i){return i;}).filter(function(i){ return g.players[i].bal>0; });
    var k = act.indexOf(seon); if (k<0) k = 0;
    return act.slice(k).concat(act.slice(0,k));
  }
  // 선·광팔이만 고르는 방식: 광팔이가 있으면 나머지는 모두 진행(죽은 사람 없음). 광팔이 없음이면 고른 죽은 사람만 빠짐
  // 4명 이상이고 광팔이 규칙이 켜져 있으면 기본 광팔이 = 마지막 주자 (두 번째·세 번째가 모두 진행한 경우)
  // gpOn: 광팔이 체크 → 마지막 주자가 광팔이로 쉬고 나머지(2·3번째 포함)는 모두 진행. 체크 안 하면 dead(2·3번째 중 죽은 사람)만 빠짐
  // gpPick: 카드에서 체크한 광팔이 번호(있으면 마지막 주자 자동 판정 대신 그 사람이 쉼, 나머지 모두 진행).
  // 선이면 쉴 수 없어 적용 안 함(conflict 'seon'), 마지막 주자가 아니면 그대로 적용하고 안내(conflict 'notLast')
  function simpleSeat(g, seon, gpOn, dead, gpPick){
    var order = seatOrder(g, seon), rest = {}, dd = {}, conflict = null, picked = false;
    var canGp = g.gwangpal!==false && order.length>=4;
    if (gpPick!==undefined && gpPick!==null && canGp && order.indexOf(gpPick)>=0){
      if (gpPick===order[0]) conflict = 'seon';
      else { rest[gpPick] = true; picked = true; if (gpPick!==order[order.length-1]) conflict = 'notLast'; }
    }
    // 죽음(쉼) 체크가 하나라도 있으면 '광팔이 있음(마지막 주자 자동 쉼)'은 자동으로 풀리고 죽음 체크대로만 진행 (JB: 광팔이 = 쉬는 사람)
    var anyDead = Object.keys(dead||{}).some(function(i){ return dead[i] && +i!==order[0] && order.indexOf(+i)>=0 && !rest[i]; });
    var lastP = order[order.length-1], lastBlocked = false; // 직전 판 죽은 사람도 마지막 주자면 광팔이가 됨 (광팔이는 항상 마지막 주자)
    if (!picked && conflict!=='seon' && gpOn && canGp && !anyDead && !lastBlocked) rest[lastP] = true;
    // 죽은 사람: 선과 광팔이를 뺀 사람 (카드의 죽음 체크와 같은 상태). 광팔이가 있으면 나머지는 모두 진행 → 죽음 무시
    // (단 5명 이상이라 광팔이를 빼고도 4명 이상 남으면 죽은 사람이 따로 빠질 수 있음)
    Object.keys(dead||{}).forEach(function(i){ i=+i; var k = order.indexOf(i); if (dead[i] && k>0 && !rest[i]) dd[i] = true; });
    return {order: order, seon: order[0], rest: rest, dead: dd, conflict: conflict, picked: picked};
  }
  function gwangPriceOf(g){ return g.gwangPrice>0 ? g.gwangPrice : 1500; }
  // 광값 낼 사람: 'noSeon'(기본) = 선 제외, 두 번째·세 번째 주자만 / 'all' = 선 포함 치는 사람 모두. 죽은 사람은 항상 제외
  function gwangMode(g){ return g.gwangPayer==='all' ? 'all' : 'noSeon'; }
  function gwangPayerText(g){ return gwangMode(g)==='all' ? '선 포함 치는 사람 모두 (죽은 사람 제외)' : '선 제외, 두 번째·세 번째 주자만 (죽은 사람 제외)'; }
  // 광값: 광팔이가 든 광·쌍피 개수 x 개당 금액을 낼 사람 각각이 광팔이에게. 죽은 사람은 치는 사람이 아니라 항상 제외
  // 점수 정산 뒤 남는 잔액 안에서만 낸다 (잔액 한도)
  // seon: 선의 번호 (모르면 치는 사람 모두가 냄)
  function gwangCalc(g, res, gwangs, seon){
    var price = gwangPriceOf(g), noSeon = gwangMode(g)==='noSeon';
    var play = [res.winner].concat(res.lines.map(function(x){ return x.idx; }));
    var bal = {}; play.forEach(function(i){ bal[i] = g.players[i].bal; });
    res.lines.forEach(function(x){ bal[x.idx] -= x.pay; }); bal[res.winner] += res.total;
    var out = [];
    (gwangs||[]).forEach(function(r){
      var cnt = Math.max(0, Math.floor(+r.count||0)); if (!cnt) return;
      var each = cnt * price;
      play.filter(function(i){ return i!==r.idx && !(noSeon && i===seon); }).forEach(function(i){
        var pay = Math.min(each, Math.max(0, bal[i])); bal[i] -= pay;
        out.push({from:i, to:r.idx, count:cnt, price:price, each:each, pay:pay, capped: pay<each});
      });
    });
    return out;
  }
  function gwangFormula(g, x){ return '광값: '+x.count+'개 x '+won(x.price)+' = '+won(x.each)+'씩, '+g.players[x.from].name+' → '+g.players[x.to].name; }
  function roundNote(g, res, opt){
    var detail = res.lines.filter(function(x){return x.pay>0;}).map(function(x){return g.players[x.idx].name+' → '+g.players[res.winner].name+' '+won(x.pay);}).join(', ');
    var extra = (opt.deadNames&&opt.deadNames.length?' / 죽음 '+opt.deadNames.join(','):'');
    var gw = (res.gwang||[]).filter(function(x){return x.pay>0;});

  function pkCanUndo(g, rec){ return !!rec && g.players[rec.i] && g.players[rec.i].bal >= rec.total; }
  function pkText(g, r){
    var nm = function(j){ return g.players[j] ? g.players[j].name : '?'; }, cap = r.to.filter(function(x){ return x.pay < r.each; });
    return nm(r.i)+' '+PPEOK_NAMES[r.level]+' +각 '+won(r.each)+'씩 ('+(r.to.length?r.to.map(function(x){ return nm(x.i); }).join('·'):'받을 사람 없음')+(r.dead&&r.dead.length?', 죽음 '+r.dead.map(nm).join('·')+' 제외':'')+', '+r.points+'점 x '+won(r.ppp)+(cap.length?', 잔액 부족: '+cap.map(function(x){ return nm(x.i)+' '+won(x.pay)+'만'; }).join(', '):'')+')';

  // 뻑 미리 체크(돈 이동 없음): 카드·판 끝 화면 어디서든 그 판 뻑 단계를 g.pkPick에 기록 → 판 반영 때 한 번만 정산

  function pkMark(g, i, d, sep){

    if (d>0 && (g.deadPick||{})[i]) return {ok:false, msg: p.name+' 님은 죽음으로 체크돼 있어서 뻑을 먹을 수 없어요'};
    if (d>0 && g.gpPick===i) return {ok:false, msg: p.name+' 님은 광팔이로 체크돼 있어서 뻑을 먹을 수 없어요'};
    if (d>0 && p.bal<=0) return {ok:false, msg: p.name+' 님은 잔액이 0원이라 이번 판에 치지 않아요'};
    if (d>0){
      if (sep && cur){

        done.push(cur); cur = 1;

  }

  // 아주 예전 버전(판 반영 때 정산, 기록 글만 남음)의 뻑: 판 기록 글에서 한 건씩 꺼냄. key = '판 번호:받은 사람 번호:순서'
  function pkTextItems(g){
    var out = [], recR = {}, done = {}, pl = g.players||[];
    (g.pks||[]).forEach(function(r){ if (r.src==='round') recR[r.r] = 1; if (r.key) done[r.key] = 1; });
    var byLen = pl.map(function(p,i){ return i; }).sort(function(a,b){ return String(pl[b].name).length - String(pl[a].name).length; });
    var who = function(str){ for (var q=0;q<byLen.length;q++){ var nm = String(pl[byLen[q]].name); if (str===nm || str.indexOf(nm+' ')===0) return byLen[q]; } return -1; };
    (g.log||[]).forEach(function(e){
      if (!e || e.t!=='판' || !/뻑 \+각/.test(e.txt||'') || recR[e.r]) return;
      String(e.txt).split(' / ').forEach(function(part, k){
        if (!/뻑 \+각/.test(part)) return;
        var i = who(part), m = /^(.*?) (첫뻑|2연뻑|3연뻑) \+각 ([\d,]+)원씩(?: \((.*)\))?$/.exec(part);
        if (i<0 || !m) return;
        var key = (num(e.r)||0)+':'+i+':'+k, cap = {};

        out.push({key:key, e:e, part:part, r:num(e.r)||0, i:i, level:PPEOK_NAMES.indexOf(m[2]), each:+m[3].replace(/,/g,''), cap:cap, done:!!done[key]});
      });
    });
    return out;
  }
  // 기록 글만 있는 예전 뻑을 고칠 수 있는 정산 기록으로 바꿈 (돈은 안 움직임). 낸 사람은 그 판 기록 글(승리자·진 사람·광팔이·죽음)과 그때 규칙
  // (뻑 값 낼 사람 설정: 앉은 전원 = 받은 사람 빼고 모두 / 친 사람만 = 승리자+진 사람)으로 되살리고, 잔액 부족이라 적힌 사람은 적힌 금액으로
  function pkImportText(g, key, now){
    var it = pkTextItems(g).filter(function(x){ return x.key===key; })[0], pl = g.players;
    if (!it) return {ok:false, msg:'그 뻑 기록을 찾지 못했어요'};
    var ex = (g.pks||[]).filter(function(r){ return r.key===key; })[0]; if (ex) return {ok:true, id:ex.id, rec:ex};
    var segs = String(it.e.txt).split(' / '), byName = {}; pl.forEach(function(p,j){ byName[p.name] = j; });
    var head = segs[0], win = -1; pl.forEach(function(p,j){ if (head.indexOf(p.name+' ')===0 && (win<0 || p.name.length>pl[win].name.length)) win = j; });
    var losers = [], rest = [], dead = [];
    segs.forEach(function(sg){
      if (/^광팔이 /.test(sg)) sg.slice(4).split(',').forEach(function(n){ if (byName[n.trim()]!==undefined) rest.push(byName[n.trim()]); });
      else if (/^죽음 /.test(sg)) sg.slice(3).split(',').forEach(function(n){ if (byName[n.trim()]!==undefined) dead.push(byName[n.trim()]); });
      else if (win>=0 && !/^광값 /.test(sg)) sg.split(', ').forEach(function(d){ var mm = /^(.*) → (.*) [\d,]+원$/.exec(d); if (mm && mm[2]===pl[win].name && byName[mm[1]]!==undefined) losers.push(byName[mm[1]]); });
    });
    var payers = (g.ppeokPayer==='play' && win>=0) ? [win].concat(losers) : pl.map(function(p,j){ return j; });
    payers = payers.filter(function(j, q){ return j!==it.i && payers.indexOf(j)===q; }).sort(function(a,b){ return a-b; });
    Object.keys(it.cap).forEach(function(j){ j = +j; if (j!==it.i && payers.indexOf(j)<0){ payers.push(j); payers.sort(function(a,b){ return a-b; }); } });
    var to = payers.map(function(j){ return {i:j, pay: it.cap[j]!==undefined ? it.cap[j] : it.each}; });

    if (!g.pks) g.pks = [];

  // 저장된 뻑 기록 손보기: 번호가 없거나 겹치면 새 번호, 빠진 값은 기본값 (돈은 안 움직임)
  function pksFix(g){
    var seen = {}, mx = 0;
    (g.pks||[]).forEach(function(r){ var n = +r.id; if (n>0 && n===Math.floor(n)) mx = Math.max(mx, n); });
    (g.pks||[]).forEach(function(r){
      var n = +r.id; if (!(n>0) || n!==Math.floor(n) || seen[n]){ n = ++mx; } r.id = n; seen[n] = 1;

      r.i = +r.i; r.total = r.to.reduce(function(s,x){ return s+x.pay; }, 0);

  // 이미 정산된 뻑 1건의 죽은 사람 수정: 죽음으로 고르면 그 사람이 낸 돈을 정확히 돌려줌, 풀면 다시 냄(잔액 한도). 합계 보존, 기록 남김
  function pkRecDead(g, id, j, on, now){
    var rec = pkFind(g, id), nm = function(k){ return g.players[k] ? g.players[k].name : '?'; };
    if (!rec || !g.players[j] || j===rec.i) return {ok:false};
    if (!rec.dead) rec.dead = [];
    var x = rec.to.filter(function(t){ return t.i===j; })[0], isDead = rec.dead.indexOf(j)>=0, txt;
    if (on){
      if (isDead) return {ok:false};
      var pay = x ? x.pay : 0;
      if (g.players[rec.i].bal < pay) return {ok:false, msg: nm(rec.i)+' 님 잔액이 '+won(pay)+'보다 적어서 돌려줄 수 없어요'};
      if (x){ g.players[rec.i].bal -= pay; g.players[j].bal += pay; rec.to.splice(rec.to.indexOf(x), 1); rec.total -= pay; }
      rec.dead.push(j);
      txt = '뻑 수정: '+nm(rec.i)+' '+PPEOK_NAMES[rec.level]+(rec.r?' ('+rec.r+'판)':'')+' - '+nm(j)+' 죽음 → '+won(pay)+' 돌려줌 ('+nm(rec.i)+' -'+won(pay)+')';
    } else {
      if (!isDead) return {ok:false};
      var pay2 = Math.min(rec.each, Math.max(0, g.players[j].bal));
      g.players[j].bal -= pay2; g.players[rec.i].bal += pay2; rec.to.push({i:j, pay:pay2}); rec.to.sort(function(a,b){ return a.i-b.i; }); rec.total += pay2;
      rec.dead.splice(rec.dead.indexOf(j), 1);
      txt = '뻑 수정: '+nm(rec.i)+' '+PPEOK_NAMES[rec.level]+(rec.r?' ('+rec.r+'판)':'')+' - '+nm(j)+' 죽음 취소 → '+won(pay2)+' 다시 냄';
    }
    g.log.unshift({t:'뻑', r:g.round+1, txt:txt});
    return {ok:true, txt:txt};
  }
  // 뻑 1건의 낸 사람 직접 수정: pays=false → 그 사람 몫 정확히 환불(빠진 사람으로 기록), pays=true → 같은 금액(잔액 한도)으로 정산. 기록 남김
  function pkRecPayer(g, id, j, pays, now){
    pksFix(g); j = +j; var rec = pkFind(g, +id), nm = function(k){ return g.players[k] ? g.players[k].name : '?'; };
    if (!rec) return {ok:false, msg:'그 뻑 기록을 찾지 못했어요. 뻑 내역을 다시 열어 주세요'};
    if (!g.players[j] || j===rec.i) return {ok:false, msg:'뻑 먹은 사람은 낸 사람이 될 수 없어요'};
    if (!rec.dead) rec.dead = [];
    var x = rec.to.filter(function(t){ return t.i===j; })[0], txt, tag = nm(rec.i)+' '+PPEOK_NAMES[rec.level]+(rec.r?' ('+rec.r+'판)':'');
    if (!pays){
      if (!x) return {ok:false, msg:nm(j)+' 님은 이미 안 낸 사람이에요'};
      if (g.players[rec.i].bal < x.pay) return {ok:false, msg: nm(rec.i)+' 님 잔액이 '+won(x.pay)+'보다 적어서 돌려줄 수 없어요'};
      g.players[rec.i].bal -= x.pay; g.players[j].bal += x.pay; rec.to.splice(rec.to.indexOf(x), 1); rec.total -= x.pay;
      if (rec.dead.indexOf(j)<0) rec.dead.push(j);
      txt = '뻑 재정산(낸 사람 수정): '+tag+' - '+nm(j)+' 빠짐 → '+won(x.pay)+' 돌려줌';
    } else {
      if (x) return {ok:false, msg:nm(j)+' 님은 이미 낸 사람이에요'};
      var pay = Math.min(rec.each, Math.max(0, g.players[j].bal));
      if (!pay) return {ok:false, msg: nm(j)+' 님은 잔액이 0원이라 낼 수 없어요'};
      g.players[j].bal -= pay; g.players[rec.i].bal += pay; rec.to.push({i:j, pay:pay}); rec.to.sort(function(a,b){ return a.i-b.i; }); rec.total += pay;
      var k = rec.dead.indexOf(j); if (k>=0) rec.dead.splice(k, 1);
      txt = '뻑 재정산(낸 사람 수정): '+tag+' - '+nm(j)+' 추가 → '+won(pay)+' 냄';
    }
    g.log.unshift({t:'뻑', r:g.round+1, txt:txt});
    return {ok:true, txt:txt};
  }
  // 카드 + / - : 한 단계 올리거나 내림. 이전 단계 정산은 정확히 되돌리고 새 단계 정산으로 바꿈 → 받은 돈은 항상 지금 단계 금액
  function pkStep(g, i, d, now){
    if (!g.pkPick) g.pkPick = {}; if (!g.pkRec) g.pkRec = {};
    var cur = g.pkPick[i]||0, nx = Math.max(0, Math.min(3, cur + d)), p = g.players[i];
    if (nx===cur) return {ok:false};
    if (d>0 && (g.deadPick||{})[i]) return {ok:false, msg: p.name+' 님은 죽음으로 체크돼 있어서 뻑을 먹을 수 없어요 (광팔이·죽은 사람은 뻑 선택 불가)'};
    if (d>0 && g.gpPick===i) return {ok:false, msg: p.name+' 님은 광팔이로 체크돼 있어서 뻑을 먹을 수 없어요 (광팔이·죽은 사람은 뻑 선택 불가)'};
    var rec = pkFind(g, g.pkRec[i]);
    if (d>0 && !rec && p.bal<=0) return {ok:false, msg: p.name+' 님은 잔액이 0원이라 이번 판에 치지 않아요. 뻑을 먹을 수 없어요'};
    if (rec && !pkCanUndo(g, rec)) return {ok:false, msg: p.name+' 님이 뻑으로 받은 돈을 이미 써서 '+PPEOK_NAMES[cur]+' 정산을 되돌릴 수 없어요'};
    var nr = null, txt;
    if (rec) pkReverse(g, rec);
    if (nx>0){
      if (d>0){
        nr = pkApplyNew(g, i, nx, now, g.ppp, null);
        if (rec) nr.prev = {level:rec.level, ppp:rec.ppp, to:rec.to.map(function(x){ return {i:x.i, pay:x.pay}; }), prev: rec.prev||null};
      } else if (rec && rec.prev){
        var pv = rec.prev, exact = pv.to.every(function(x){ return g.players[x.i].bal >= x.pay; });
        nr = pkApplyNew(g, i, nx, now, pv.ppp, exact ? pv.to : null); nr.prev = pv.prev || null;
      } else if (rec) nr = pkApplyNew(g, i, nx, now, rec.ppp, null);
    }
    if (nr){ g.pkPick[i] = nx; g.pkRec[i] = nr.id; }
    else if (nx>0){ g.pkPick[i] = nx; delete g.pkRec[i]; }
    else { delete g.pkPick[i]; delete g.pkRec[i]; }
    if (d>0) txt = nr ? (rec ? p.name+' '+PPEOK_NAMES[nx]+'으로 올림 ('+PPEOK_NAMES[cur]+' 정산 되돌림): ' : '')+pkText(g, nr) : '';
    else txt = p.name+' 뻑 내림 ('+PPEOK_NAMES[cur]+' → '+(nx?PPEOK_NAMES[nx]:'없음')+', '+(rec?'+'+won(rec.total)+' 되돌림':'정산 전')+')'+(nr?': '+pkText(g, nr):'');

  }
  // ===== 카드 광팔이 + : 누를 때마다(광·쌍피 1개) 광팔이가 죽은 사람을 뺀 나머지(잔액 있는 사람, 선 포함) 각자에게서 광값을 즉시 받음 =====
  // g.gws: 광값 정산 기록, g.gwCur: 이번 판 광값 기록 id들(- 로 최근 것부터 환불), g.deadPick: 카드 죽음 체크. 판 반영·무효 후 gwCur·deadPick 풀림(돈은 그대로)
  // 이번 판 선: 판 끝 화면에서 고른 선(g.seonPick) → 직전 판 승리자 → 직전 판 선 → 첫 사람 (잔액 있는 사람 중)
  function curSeon(g){
    var act = g.players.map(function(p,j){ return j; }).filter(function(j){ return g.players[j].bal>0; }), lw;
    if (g.seonPick!==undefined && act.indexOf(g.seonPick)>=0) return g.seonPick;
    lw = lastWinner(g); if (lw>=0 && act.indexOf(lw)>=0) return lw;
    if (g.order && act.indexOf(g.order[0])>=0) return g.order[0];

  }
  // 광값 낼 사람(JB 규칙): 광팔이 본인과 선을 뺀 나머지(2·3번째 주자). 죽은 사람도 치지 않으니 내지 않음. 잔액 있는 사람만
  function gwPayers(g, i){ var dp = g.deadPick||{}, sn = curSeon(g); return g.players.map(function(p,j){return j;}).filter(function(j){ return j!==i && j!==sn && g.players[j].bal>0 && !dp[j]; }); }
  function gwCurRecs(g){ var cur = g.gwCur||[]; return (g.gws||[]).filter(function(r){ return cur.indexOf(r.id)>=0; }); }
  function gwCount(g, i){ return gwCurRecs(g).filter(function(r){ return r.i===i; }).length; }
  function gwText(g, r){
    var nm = function(j){ return g.players[j] ? g.players[j].name : '?'; }, cap = r.to.filter(function(x){ return x.pay < r.each; });
    return nm(r.i)+' 광팔이 '+r.n+'개째 +각 '+won(r.each)+'씩 ('+(r.to.length?r.to.map(function(x){ return nm(x.i); }).join('·'):'낼 사람 없음')+(r.seon!==undefined&&r.seon>=0?', 선 '+nm(r.seon)+' 제외':'')+(r.dead&&r.dead.length?', 죽음 '+r.dead.map(nm).join('·')+' 제외':'')+(cap.length?', 잔액 부족: '+cap.map(function(x){ return nm(x.i)+' '+won(x.pay)+'만'; }).join(', '):'')+')';
  }
  // 직전 판 승리자: g.lastWin, 없으면(예전 버전 저장분) 가장 최근 '판' 기록의 "이름 ... 승"에서 찾음. 없으면 -1

  h+='<p>1점당 금액 (원) — 자동을 끄면 이 금액으로 고정</p><input type="number" id="ppp" value="'+(st.ppp||1500)+'" oninput="st.ppp=+this.value">';
  h+='<button class="b1" onclick="start()">게임 시작</button><button class="b3" onclick="st.hid=0;view=\'hist\';render()">지난 정산 기록 보기</button></div>'+RULES();
  app.innerHTML=h;
}
function start(){
  var n=2, names=[];
  for (var i=0;i<n;i++){ var v=$('nm'+i).value.trim()||((i+1)+'번'); names.push(v); }
  var ppp=+$('ppp').value, auto=$('tieron').checked;
  if (!auto && !(ppp>0)) return alert('금액을 확인해 주세요');
  g=L.newGame(names, 100000, auto ? 1500 : ppp); g.tierOn=auto; if (auto) g.ppp=L.tiersOf(g)[0].ppp; L.syncGwang(g); prev=null; view='main'; st={}; render();
}

function orderNote(){
  var act=actList().length, n=g.players.length;
  if (act<2) return '<p class="note">잔액 있는 사람이 2명 이상이어야 판을 시작할 수 있어요. 각자 카드의 +1만원·+5만원·+10만원 버튼으로 충전해 주세요.</p>';
  if (g.gwangpal!==false && n>=4 && act<4) return '<p class="note">지금 잔액 있는 사람은 '+act+'명이에요. 0원인 사람은 이번 판에 못 껴요. 4명 모두 충전하면 광팔이 체크가 나와요.</p>';
  return '';
}
function renderMain(){
  var lc=L.lastCharge(g), flash='', lf=null;

  if (lf && st.fineFlash===lf.id){
    flash='<div class="flash" style="background:#7a2e2e">'+esc(L.fineText(g,lf))+(st.fineWarn?'<br><span style="color:#ffd166">'+esc(st.fineWarn)+'</span>':'')+
      (L.canUndoFine(g,lf.id)?'<button class="b3 small" onclick="cancelFine('+lf.id+')">방금 벌금 취소</button>':'')+'</div>';
  }
  if (lc && st.flash===lc.id){
    flash='<div class="flash">'+esc(g.players[lc.i].name)+' +'+W(lc.amt)+' 충전 완료 (잔액 '+W(g.players[lc.i].bal)+')'+
      (L.canUndoCharge(g,lc.id)?'<button class="b3 small" onclick="cancelCharge('+lc.id+')">방금 충전 취소</button>':'')+'</div>';
  }
  var h=(g.admin?'<div class="flash" style="background:#b00020">관리자 모드 — 자유 수정 (규칙 검사 꺼짐)</div>'+adminHtml():'')+evHtml()+dashHtml()+flash+'<div id="tierbar" class="note" style="text-align:center;font-size:15px;margin:4px 0">'+tierBarHtml()+'</div><div class="grid">';
  g.players.forEach(function(p,i){
    var out=p.bal<=0;
    var dOn=false;
    h+='<div class="card '+(out?'out':'')+'" data-i="'+i+'">'+'<div class="nm">'+(L.lastWinner(g)===i?'<span class="winb">👑 승</span> ':'')+(!out&&L.curSeon(g)===i?'<span class="seonb">선</span> ':'')+esc(p.name)+'</div><div class="bal">'+W(p.bal)+'</div>'+
      '<div class="sub">넣은 돈 '+W(p.invested)+' ('+p.charges+'회)</div>'+
      (out?'<div class="tag">쉬는 중 (충전하면 참여)</div>':'')+
      '<div class="chgrow3">'+L.CHARGE_AMTS.map(function(a){ return '<button class="b2 chg" data-amt="'+a+'" onclick="doCharge('+i+','+a+')">+'+(a/10000)+'만원</button>'; }).join('')+'</div>'+
      mbRow(i)+
      '</div>';
  });
  h+='</div>'+orderNote()+'<button class="b1 big" onclick="toS1()">판 끝! 점수 넣기</button>'+
   '<div class="row"><button class="b3 small" onclick="doVoid()">나가리 (다음 판 2배)</button><button class="b3 small" onclick="undo()">방금 것 되돌리기</button></div>'+
   '<div class="row"><button class="b3 small" onclick="view=\'chg\';render()">충전 내역</button><button class="b3 small" onclick="view=\'log\';render()">기록 보기</button><button class="b3 small" onclick="view=\'set\';render()">설정</button></div>'+
   '<button class="b3 small" id="adminbtn" onclick="toggleAdmin()">'+(g.admin?'관리자 모드 끄기':'관리자 모드 (강제 수정)')+'</button><button class="b2" onclick="view=\'share\';render()">보기용 링크 만들기 (참가자 공유)</button>'+
   '<button class="b4" onclick="view=\'end\';render()">끝내고 정산하기</button>'+'<div class="pool" style="margin-top:12px"><div class="lab">모인 돈 (딜러 계좌 총액)</div><div class="val">'+W(L.pool(g))+'</div><div class="lab">점당 '+W(g.ppp)+'</div></div>'+RULES();
  app.innerHTML=h;

function mbRow(i){ var p=g.players[i], dis=(p.bal<=0||L.mbonusFrom(g,i)<0)?' disabled':'';

function fineCnt(c){ return '<div class="fcnt">벌금 '+c.n+'회'+(c.paid||c.got?'<br>낸 벌금 '+(c.paid?'-':'')+W(c.paid)+' / 받은 벌금 '+(c.got?'+':'')+W(c.got):'')+'</div>'; }

// 카드의 광팔이 체크: 한 번에 한 명, 다시 누르면 해제. 판 끝 화면의 선·광팔이 설정과 같은 상태(g.gpPick)
// 카드 광팔이 +/-: + 한 번 = 광·쌍피 1개, 그 자리에서 죽은 사람 뺀 나머지 각자에게서 광값 받음. - 는 가장 최근 1개 정확히 환불
function gwStepUI(i,d){
  var tmp=JSON.stringify(g), r=L.gwStep(g,i,d);
  if (!r.ok){ if (r.msg) alert(r.msg); return; }
  prev=tmp;
  var warn = r.capped ? '잔액 부족: '+r.rec.to.filter(function(x){ return x.pay<r.rec.each; }).map(function(x){ return g.players[x.i].name+' 님은 '+W(x.pay)+'만 냈어요'; }).join(', ') : '';
  var dn=r.cleared&&r.cleared.length ? deadNote(r) : '';
  st={pkMsg:g.log.slice(0, d<0 ? 1+((r.resettled||[]).length) : 1).reverse().map(function(e){ return e.txt; }).join(' / '), pkWarn:[dn,warn].filter(Boolean).join(' / ')}; if(d>0) maybeShowEvent(); render();
  if (dn||warn) alert([dn,warn].filter(Boolean).join('\n'));
}
function foolStepUI(i,d){
  var tmp=JSON.stringify(g), r=L.foolStep(g,i,d);
  if (!r.ok){ if (r.msg) alert(r.msg); return; }
  prev=tmp;
  var warn = r.capped ? '잔액 부족: '+r.rec.to.filter(function(x){ return x.pay<r.rec.each; }).map(function(x){ return g.players[x.i].name+' 님은 '+W(x.pay)+'만 냈어요'; }).join(', ') : '';
  st={pkMsg:g.log[0]?g.log[0].txt:'', pkWarn:warn}; render(); if (warn) alert(warn);
}

// 대기 중인 이벤트: 판 반영 때 g.evPending에만 넣고, 다음 판에서 죽음·광팔이를 켠 뒤에만 팝업(g.evNow)
// 10판마다 4~6판 이벤트(개수·판 모두 랜덤)(어느 판인지는 랜덤): g.evBag에서 하나씩 꺼냄
function evDraw(){ if(typeof window.EV_P==='number') return Math.random()<window.EV_P; if(!g.evBag||!g.evBag.length){ var n=4+Math.floor(Math.random()*3), b=[]; for(var k=0;k<10;k++) b.push(k<n?1:0); for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=b[i];b[i]=b[j];b[j]=t;} g.evBag=b; g.evUsed=[]; } return !!g.evBag.shift(); }
// 비슷한 이벤트 묶음: 10판 안에서 같은 묶음은 한 번만, 묶음부터 고르게 뽑음
var EVGROUP={godori:'godori',hong:'hong',cheong:'cheong',cho:'cho',samgwang:'gwang',must2:'must',must3:'must',daebak_a:'daebak',daebak_b:'daebak',daebak_c:'daebak'};
function evGrp(id){ return EVGROUP[id]||id; }
function evPick(){ var used=g.evUsed||(g.evUsed=[]), grps=[]; L.EVENTS.forEach(function(e){ var k=evGrp(e.id); if(grps.indexOf(k)<0&&used.indexOf(k)<0) grps.push(k); }); if(!grps.length){ used.length=0; L.EVENTS.forEach(function(e){ var k=evGrp(e.id); if(grps.indexOf(k)<0) grps.push(k); }); }
  var k=grps[Math.floor(Math.random()*grps.length)], c=L.EVENTS.filter(function(e){ return evGrp(e.id)===k; }); used.push(k); return c[Math.floor(Math.random()*c.length)].id; }
function maybeShowEvent(){ if(RO||!g||!g.evPending||g.evNow) return false; g.evNow=g.evPending; delete g.evPending; return true; }
function evHtml(){ if(!g.evNow||RO) return ''; var ev=L.EVENTS.filter(function(e){ return e.id===g.evNow; })[0]; if(!ev) return '';
  var units=ev.kind==='mult'?(ev.mult||1):(ev.pts||0); var tip=ev.kind==='mult'?('미션 배수 x'+units+' → 각 '+W(Math.floor(units*g.ppp))+'씩'):('+'+units+'점 → 각 '+W(Math.floor(units*g.ppp))+'씩');
  if(g.evMin) return '';
  var h='<div class="evov" id="evov"><div class="evbox"><button class="evback" onclick="g.evMin=true;render()">⬅ 뒤로 (작게)</button><div class="evt">🎉 이벤트 발동! 🎉</div><div class="evn">'+esc(ev.title)+'</div>'+evCards(ev.id)+'<button class="b3 evx" onclick="evCancel()">취소 / 미션 실패</button><p>'+esc(ev.note)+' → 성공하면 잔액 있는 다른 사람 각자에게서 '+tip+' 받아요</p><p><b>판이 끝나면 결과 화면에서 성공한 사람을 골라요. 그때 판이랑 같이 정산돼요.</b></p><button class="pick evpick" onclick="g.evMin=true;render()">확인 (작게 두기)</button>';
  return h+'</div></div>'; }
function evCancel(){ var ev=L.EVENTS.filter(function(e){ return e.id===g.evNow; })[0]; if(ev){ g.log.unshift({t:'이벤트', r:g.round, txt:'이벤트 '+ev.title+' 취소/미션 실패 (적용 안 함)'}); } g.evNow=null; g.evMin=false; render(); }
function evApply(i){ var ev=L.EVENTS.filter(function(e){ return e.id===g.evNow; })[0]; if(!ev) return; snap(); var r=L.eventApply(g,i,ev); g.evNow=null; g.evMin=false; render(); if(r) alert(g.players[i].name+' 님 이벤트 성공! +'+W(r.total)); }
function cardTap(e,i){ return; // 맞고: 카드 눌러 죽음 없음
  var t=e&&e.target; if (!t || !t.closest) return;
  if (t.closest('button,input,label,a,select,textarea,[onclick]:not(.card),.pkdet')) return;
  var card=t.closest('.card'); if (!card || card.classList.contains('out')) return;

}
function toggleDeadCard(i){
  var on=!(g.deadPick||{})[i], tmp=JSON.stringify(g), r=L.setDead(g,i,on);
  if (!r.ok){ if (r.msg) alert(r.msg); if (view==='s1') seatApply(); return render(); }

  h+='<div class="box"><h2>누가 누구에게 보내나요</h2>';
  if(!s.transfers.length) h+='<p>보낼 돈이 없어요</p>';
  s.transfers.forEach(function(t){ h+='<div class="calc big" style="font-size:22px">'+esc(g.players[t.from].name)+' → '+esc(g.players[t.to].name)+' <b>'+W(t.amt)+'</b></div>'; });
  h+='<p style="font-size:16px;color:#555">딜러 계좌에 돈을 모아 뒀다면, 위 대신 딜러가 각자에게 남은 칩만큼 돌려주면 돼요.</p></div>';
  h+='<button class="b3" onclick="st.hid=0;view=\'hist\';render()">지난 정산 기록 보기</button><button class="b3" onclick="view=\'main\';render()">게임으로 돌아가기</button>';
  app.innerHTML=h;
}

// ===== 보기용 링크 (편집 모드에서 생성) =====
var shareUrl='';
function renderShare(){
  app.innerHTML='<div class="box"><h2>보기용 링크</h2><p>만드는 중...</p></div>';
  L.encodeState(g).then(function(code){
    shareUrl=location.href.split('#')[0]+'#v='+code;
    if (view!=='share') return;
    var h='<div class="box"><h2>보기용 링크</h2><p>지금 상태(잔액, 충전·판 기록, 딜러 계좌 총액, 설정)가 담긴 읽기 전용 링크예요. 참가자는 보기만 할 수 있어요.</p>'+
      '<div class="linkbox" id="lnk">'+esc(shareUrl)+'</div>'+
      '<button class="b2" onclick="copyLink()">링크 복사</button>'+
      (navigator.share?'<button class="b4" onclick="shareLink()">공유하기 (카톡 등)</button>':'')+
      '<p id="cpmsg" style="font-size:17px;color:#2a9d8f"></p>'+
      '<p style="font-size:16px;color:#555">판이 끝날 때마다 새로 만들어서 다시 올려 주세요. 예전 링크는 그때 상태 그대로예요.</p>'+
      '<button class="b3" onclick="view=\'main\';render()">돌아가기</button></div>';
    app.innerHTML=h;
  }, function(){ app.innerHTML='<div class="box"><h2>보기용 링크</h2><p class="warn">링크를 만들지 못했어요</p><button class="b3" onclick="view=\'main\';render()">돌아가기</button></div>'; });
}
function copyLink(){
  function done(){ var m=$('cpmsg'); if(m) m.textContent='복사했어요. 단톡방에 붙여 넣으세요.'; }
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(shareUrl).then(done, fallback);
  fallback();
  function fallback(){ var t=document.createElement('textarea'); t.value=shareUrl; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); done(); }catch(e){ alert('복사가 안 되면 링크를 길게 눌러 복사해 주세요'); } document.body.removeChild(t); }
}
function shareLink(){ navigator.share({title:'고스톱 칩 현황 (보기 전용)', text:'고스톱 칩 현황 보기', url:shareUrl}).catch(function(){}); }

// ===== 보기 전용 모드 (해시 #v= 로 열었을 때). localStorage 읽기·쓰기 없음 =====
function fmtTime(t){ var d=new Date(t); if(!t||isNaN(d)) return '시각 모름'; function z(n){return (n<10?'0':'')+n;} return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+z(d.getHours())+':'+z(d.getMinutes()); }
function renderRO(){
  var bar=$('robar'); bar.textContent='보기 전용 (마지막 갱신 '+fmtTime(roT)+')'; bar.classList.remove('hide');
  var m=$('mult');
  if (g.nextMult>1){ m.textContent='다음 판 x'+g.nextMult; m.classList.remove('hide'); } else m.classList.add('hide');
  var h=dashHtml()+'<div class="pool"><div class="lab">모인 돈 (딜러 계좌 총액)</div><div class="val">'+W(L.pool(g))+'</div><div class="lab">점당 '+W(g.ppp)+' · '+g.round+'판 진행</div></div><div class="grid">';
  var fc=L.fineCounts(g,true);
  g.players.forEach(function(p,i){
    var out=p.bal<=0;
    h+='<div class="card '+(out?'out':'')+'"><div class="nm">'+(L.lastWinner(g)===i?'<span class="winb">👑 승</span> ':'')+esc(p.name)+'</div><div class="bal">'+W(p.bal)+'</div>'+
      '<div class="sub">넣은 돈 '+W(p.invested)+' ('+p.charges+'회)</div>'+(out?'<div class="tag">쉬는 중</div>':'')+'</div>';
  });
  h+='</div>';
  var s=L.settle(g);
  h+='<div class="box"><h2>지금 끝내면 정산</h2>';
  s.rows.forEach(function(r){ h+='<div class="calc"><b>'+esc(r.name)+'</b> 손익 <b style="color:'+(r.net>=0?'#2a9d8f':'#c00')+'">'+(r.net>0?'+':'')+W(r.net)+'</b><br><span style="font-size:16px">넣은 돈 '+W(r.invested)+' · 남은 칩 '+W(r.bal)+'</span></div>'; });
  if(!s.transfers.length) h+='<p>보낼 돈이 없어요</p>';
  s.transfers.forEach(function(t){ h+='<div class="calc" style="font-size:22px">'+esc(g.players[t.from].name)+' → '+esc(g.players[t.to].name)+' <b>'+W(t.amt)+'</b></div>'; });
  h+='</div>'+chgHtml(true)+'<div class="box"><h2>기록</h2>';
  if(!g.log.length) h+='<p>아직 기록이 없어요</p>';
  g.log.forEach(function(l){ var f=(l.t==='벌금'||l.t==='벌금 취소'); h+='<div class="log">'+(l.t==='판'?'👑 ':'')+(f?L.roundTag(g,(+l.r||0)+1)+' · ':(l.r?l.r+'판 · ':''))+esc(l.txt)+'</div>'; });
  h+='</div><details><summary>보기 전용 안내 (눌러서 보기)</summary><p>이 화면은 진행자가 링크를 만든 순간의 상태예요. 입력은 진행자 폰에서만 하고, 참가자는 보기용 링크로 확인해요. 최신 상태는 진행자가 새로 올린 링크로 확인하세요.</p></details>'+RULES();
  app.innerHTML=h;
}
function roError(){
  var bar=$('robar'); bar.textContent='보기 전용'; bar.classList.remove('hide');
  app.innerHTML='<div class="box"><h2>링크를 열 수 없어요</h2><p>링크가 잘렸거나 잘못됐어요. 진행자에게 보기용 링크를 다시 받아 주세요.</p></div>';
}
function boot(){
  var hs=location.hash||'';
  if (hs.indexOf('#v=')===0){
    RO=true; document.body.classList.add('ro');
    app.innerHTML='<div class="box"><p>불러오는 중...</p></div>';
    L.decodeState(hs.slice(3)).then(function(d){ g=d.g; roT=d.t; render(); }, roError);
  } else { load(); render(); }
}
/* ---------- 전체화면 ---------- */
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function fsAvail(){var d=document.documentElement;return !!((d.requestFullscreen||d.webkitRequestFullscreen)&&(document.fullscreenEnabled!==false||document.webkitFullscreenEnabled));}
function fsLabel(){var on=!!fsEl();[].forEach.call(document.querySelectorAll('.fsx'),function(b){b.textContent=on?'✕ 전체화면 끄기':'⛶ 전체화면';});}
function fsToggle(){
  try{
    if(fsEl()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else { var d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen; var p=f.call(d,{navigationUI:'hide'}); if(p&&p.catch) p.catch(function(){}); }
  }catch(e){}
}
document.addEventListener('fullscreenchange',fsLabel);document.addEventListener('webkitfullscreenchange',fsLabel);
if(!fsAvail()) document.documentElement.classList.add('nofs');
window.addEventListener('hashchange', function(){ location.reload(); });
boot();
</script>

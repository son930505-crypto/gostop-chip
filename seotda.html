<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>섯다 도우미</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#0f1a14;color:#eef3ee;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0;border-radius:10px}
.hide{display:none!important}
/* ---------- 시작 화면 ---------- */
#start{max-width:1100px;margin:0 auto;padding:18px 16px 30px}
#start h1{font-size:28px;margin-bottom:4px}
#start .sub{color:#9fb7a6;font-size:14px;margin-bottom:16px}
.sec{background:#17271e;border:1px solid #284635;border-radius:14px;padding:14px;margin-bottom:14px}
.sec h2{font-size:18px;margin-bottom:10px}
.prow{display:flex;gap:8px;margin-bottom:8px}
.prow input{flex:1;min-width:0;font-size:18px;padding:12px;border-radius:10px;border:1px solid #3a5a48;background:#0f1a14;color:#fff}
.prow .del{width:52px;background:#5a2a2a;color:#fff;font-size:20px}
.add{width:100%;padding:12px;background:#24402f;color:#cfe;font-size:16px}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.type{background:#0f1a14;border:2px solid #2f4d3c;border-radius:12px;padding:12px;text-align:left;color:#eef3ee}
.type b{display:block;font-size:19px;margin-bottom:4px}
.type span{font-size:13px;color:#9fb7a6;line-height:1.4}
.type.on{border-color:#f2c14e;background:#2a2a14}
.opts{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px}
.opts label{display:flex;align-items:center;gap:6px}
.opts input{width:20px;height:20px}
select{font-size:16px;padding:10px;border-radius:10px;background:#0f1a14;color:#fff;border:1px solid #3a5a48}
.go{width:100%;padding:18px;font-size:22px;font-weight:700;background:#f2c14e;color:#222}
.note{font-size:12px;color:#8aa596;margin-top:8px;line-height:1.5}
@media(max-width:700px){.types{grid-template-columns:1fr}}
/* ---------- 대시보드 ---------- */
#dash{height:100vh;display:flex;flex-direction:column;padding:1vh 1vw;gap:1vh;overflow:hidden}
.top{display:flex;align-items:center;gap:.8vw;flex:0 0 auto}
.top .ttl{font-size:3.2vh;font-weight:800;white-space:nowrap}
.top .gt{font-size:2.2vh;color:#f2c14e;background:#2a2a14;padding:.6vh 1vw;border-radius:8px;white-space:nowrap}
.top .rd{font-size:2.8vh;font-weight:700;white-space:nowrap}
.top .rd small{font-size:1.9vh;color:#9fb7a6;font-weight:400}
.top .lastlog{flex:1;min-width:0;font-size:1.9vh;color:#cfe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.tb{font-size:2.1vh;padding:1.1vh 1.1vw;background:#24402f;color:#eef;white-space:nowrap}
.tb.re{background:#4a3a14;color:#ffe}
.tb.un{background:#3a2a2a}
.players{flex:0 0 12vh;display:grid;gap:.8vw;min-height:0}
.pc{position:relative;background:#17271e;border:2px solid #284635;border-radius:12px;padding:.8vh .8vw;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#eef3ee;min-height:0;overflow:hidden}
.pc:active{background:#22402e}
.pc.seon{border-color:#f2c14e;box-shadow:0 0 0 2px #f2c14e55 inset}
.pc.last{background:#1f3a2a}
.pc .nm{font-size:2.8vh;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:3vw}
.pc .sb{position:absolute;top:.8vh;right:.6vw;background:#f2c14e;color:#222;font-weight:800;font-size:2vh;padding:.2vh .6vw;border-radius:8px}
.pc .wn{font-size:3.6vh;font-weight:800;color:#7fe0a0;line-height:1}
.pc .wn small{font-size:1.8vh;color:#9fb7a6;font-weight:400;margin-left:.3vw}
.pc .hist{display:flex;gap:.3vw;flex-wrap:nowrap;overflow:hidden;font-size:1.6vh;min-height:2.3vh}
.pc .hist i{font-style:normal;background:#2c4d39;border-radius:6px;padding:.1vh .4vw;white-space:nowrap}
.pc .tap{font-size:1.5vh;color:#7d9886}
.jb{flex:1 1 auto;background:#17271e;border:1px solid #284635;border-radius:14px;padding:1vh 1vw;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.jb h3{font-size:2.6vh;margin-bottom:.8vh;color:#f2c14e;flex:0 0 auto}
.jb h3 small{font-size:1.7vh;color:#9fb7a6;font-weight:400;margin-left:1vw}
.tiles{flex:1 1 auto;display:grid;gap:.9vh .7vw;min-height:0}
.tile{position:relative;background:#0f1a14;border:1px solid #2a4636;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:.7vh .4vw;min-height:0;overflow:hidden}
.tile.g{border-color:#f2c14e99;background:#1d1d0e}
.tile.s{border-color:#ff9f7a99;background:#24150f}
.tile .no{position:absolute;top:.5vh;left:.5vw;font-size:1.9vh;font-weight:800;color:#0f1a14;background:#9fb7a6;border-radius:6px;padding:0 .45vw}
.tile.g .no{background:#f2c14e}.tile.s .no{background:#ff9f7a}
.tile .cds{flex:1 1 auto;min-height:0;display:flex;gap:.4vw;justify-content:center;align-items:center;width:100%}
.tile .cds img{height:100%;width:auto;max-width:48%;object-fit:contain;border-radius:6px}
.tile .hn{font-size:2.7vh;font-weight:800;line-height:1.15;margin-top:.4vh;white-space:nowrap}
.tile.g .hn{color:#f2c14e}.tile.s .hn{color:#ff9f7a}
.tile .hd{font-size:1.6vh;color:#b9cdbf;line-height:1.25;text-align:center;min-height:2.2vh;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.kuth{flex:0 0 auto;font-size:1.9vh;color:#cfe;margin:.8vh 0 .5vh}
.kuth b{color:#f2c14e}
.kuts{flex:0 0 22vh;display:grid;grid-template-columns:repeat(10,1fr);gap:.5vw;min-height:0}
.kt{position:relative;background:#0f1a14;border:1px solid #2a4636;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:.5vh .3vw;min-height:0;overflow:hidden}
.kt .no{position:absolute;top:.3vh;left:.3vw;font-size:1.5vh;font-weight:800;color:#0f1a14;background:#9fb7a6;border-radius:5px;padding:0 .35vw;z-index:1}
.kt .cds{flex:1 1 auto;min-height:0;display:flex;gap:.25vw;justify-content:center;align-items:center;width:100%}
.kt .cds img{height:100%;width:auto;max-width:48%;object-fit:contain;border-radius:4px}
.kt .hn{font-size:2.5vh;font-weight:800;line-height:1.1;margin-top:.3vh;white-space:nowrap}
.kt .hd{font-size:1.6vh;color:#b9cdbf;white-space:nowrap}
.credit{font-size:1.3vh;color:#5f7a69;text-align:right;margin-top:.4vh;flex:0 0 auto}
/* 폰(세로) */
@media(max-aspect-ratio:1/1){
 #dash{height:auto;min-height:100vh;overflow:visible;padding:10px}
 .top{flex-wrap:wrap}
 .top .ttl{font-size:22px}.top .gt{font-size:13px}.top .rd{font-size:18px}.top .rd small{font-size:12px}
 .top .lastlog{flex-basis:100%;text-align:left;font-size:13px;order:9}
 .tb{font-size:15px;padding:12px 10px;flex:1}
 .players{flex:none;grid-template-columns:repeat(2,1fr)!important;grid-template-rows:none!important;gap:8px}
 .pc{min-height:96px;padding:8px}
 .pc .nm{font-size:22px}.pc .sb{font-size:13px;top:6px;right:6px;padding:2px 8px}
 .pc .wn{font-size:26px}.pc .wn small{font-size:12px}
 .pc .hist{font-size:12px;min-height:18px;gap:3px}.pc .tap{font-size:11px}
 .jb{flex:none;padding:10px}.jb h3{font-size:17px}.jb h3 small{font-size:12px}
 .tiles{grid-template-columns:repeat(2,1fr)!important;grid-template-rows:none!important;gap:8px}
 .tile{padding:8px 4px}.tile .cds{height:120px;flex:none;gap:6px}.tile .no{font-size:13px}
 .kuts{flex:none;grid-template-columns:repeat(5,1fr);gap:6px}.kt .cds{height:70px;flex:none}.kt .hn{font-size:14px}.kt .hd{font-size:11px}.kt .no{font-size:10px}.kuth{font-size:12px}
 .tile .hn{font-size:19px}.tile .hd{font-size:12px}.credit{font-size:10px}
}
/* ---------- 마감 요약 · 지난 기록 ---------- */
.tb.cl{background:#7a2a1e;color:#fff;font-weight:800}
.view{height:100vh;display:flex;flex-direction:column;padding:1.5vh 1.5vw;gap:1.2vh;overflow:hidden}
.sh{flex:0 0 auto}
.st{font-size:4vh;font-weight:800;color:#f2c14e}
.st small{font-size:2vh;color:#9fb7a6;font-weight:400}
.badge{font-size:2vh;background:#7a2a1e;color:#fff;border-radius:8px;padding:.3vh .7vw;vertical-align:middle}
.sm{font-size:2.3vh;color:#cfe;margin-top:.3vh}
.sb2{flex:1 1 auto;display:grid;grid-template-columns:1fr 2fr;gap:1.2vw;min-height:0}
.sl{display:flex;flex-direction:column;gap:1vh;min-height:0;overflow:hidden}
.kpi{display:flex;gap:.8vw}
.kpi div{flex:1;background:#17271e;border:1px solid #284635;border-radius:12px;padding:1vh .8vw;font-size:2.2vh}
.kpi b{font-size:4.6vh;color:#7fe0a0;margin-right:.3vw}
.kpi small{display:block;font-size:1.7vh;color:#9fb7a6}
.kpi .wide b{font-size:4vh;color:#f2c14e}
.pp{font-size:1.9vh;color:#cfe}
.rk{flex:1 1 auto;background:#17271e;border:1px solid #284635;border-radius:12px;padding:1vh 1vw;overflow:hidden;display:flex;flex-direction:column;gap:.6vh}
.rkr{display:flex;align-items:baseline;gap:.8vw;font-size:2.6vh;border-bottom:1px solid #22382b;padding:.3vh 0}
.rkr span{width:3.5vw;color:#9fb7a6}.rkr b{flex:1}.rkr em{font-style:normal;font-weight:800;color:#7fe0a0}.rkr small{font-size:1.8vh;color:#9fb7a6;width:3vw;text-align:right}
.rkr.top b,.rkr.top span{color:#f2c14e}
.sr{background:#17271e;border:1px solid #284635;border-radius:12px;padding:1vh 1vw;display:flex;flex-direction:column;min-height:0}
.srh{font-size:2.3vh;font-weight:700;color:#f2c14e;margin-bottom:.6vh}
.rl{flex:1 1 auto;min-height:0;column-width:18vw;column-gap:1.2vw;column-fill:auto;overflow-x:auto;overflow-y:hidden;font-size:1.85vh;line-height:1.55}
.rr{break-inside:avoid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #1f3328}
.rr .rn{display:inline-block;min-width:3.6vw;color:#9fb7a6}
.rr i{color:#7d9886}
.rr.rp{color:#e9d9a6}.rpw{color:#f2c14e}
.sbt{flex:0 0 auto;margin-top:0}
.hl{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.8vh}
.hr{display:flex;gap:.6vw}
.hopen{flex:1;display:flex;gap:1.4vw;align-items:center;text-align:left;background:#17271e;border:1px solid #284635;color:#eef3ee;padding:1.4vh 1vw;font-size:2.2vh}
.hopen b{color:#f2c14e;min-width:6vw}
.hdel{background:#5a2a2a;color:#fff;padding:0 1.4vw;font-size:2vh}
.hempty{font-size:2.4vh;color:#9fb7a6;padding:3vh 0}
@media(max-aspect-ratio:1/1){
 .view{height:auto;min-height:100vh;overflow:visible;padding:12px}
 .st{font-size:22px}.st small,.badge{font-size:12px}.sm{font-size:13px}
 .sb2{grid-template-columns:1fr}.kpi div{font-size:13px}.kpi b{font-size:24px}.kpi .wide b{font-size:20px}.kpi small{font-size:11px}
 .pp{font-size:12px}.rkr{font-size:16px}.rkr span{width:40px}.rkr small{font-size:11px;width:36px}
 .srh{font-size:15px}.rl{column-width:auto;font-size:13px;overflow:visible}.rr{white-space:normal}.rr .rn{min-width:40px}
 .hopen{flex-wrap:wrap;font-size:13px;gap:6px 12px;padding:10px}.hdel{font-size:13px;padding:0 12px}
}
/* ---------- 모달 ---------- */
.mask{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:10;padding:2vh 2vw}
.mod{background:#17271e;border:2px solid #f2c14e;border-radius:16px;padding:2vh 1.6vw;width:min(1200px,96vw);max-height:96vh;overflow:auto}
.mod h2{font-size:3.2vh;margin-bottom:1.2vh}
.mod .hint{font-size:1.9vh;color:#9fb7a6;margin-bottom:1vh}
.hg{display:flex;flex-wrap:wrap;gap:.8vh .6vw;margin-bottom:1vh}
.hb{font-size:2.4vh;padding:1.4vh 1.1vw;background:#24402f;color:#eef;min-width:7vw}
.hb.s{background:#4a2d24}
.hb.on{background:#f2c14e;color:#222;font-weight:800}
.mrow{display:flex;gap:1vw;margin-top:1.2vh}
.mrow button{flex:1;font-size:2.6vh;padding:2vh 1vw;font-weight:700}
.ok{background:#f2c14e;color:#222}.no{background:#3a2a2a;color:#fff}.mid{background:#24402f;color:#eef}
@media(max-aspect-ratio:1/1){.mod h2{font-size:20px}.mod .hint{font-size:13px}.hb{font-size:15px;padding:12px 10px}.mrow button{font-size:16px;padding:14px 6px}}
/* 판정기 */
.jp{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1vh 1vw}
.jpl{background:#0f1a14;border:1px solid #2f4d3c;border-radius:12px;padding:1vh .8vw}
.jpl.off{opacity:.45}
.jpl .h{display:flex;justify-content:space-between;align-items:center;font-size:2.2vh;font-weight:700;margin-bottom:.6vh}
.jpl .h label{font-size:1.7vh;font-weight:400;display:flex;gap:4px;align-items:center}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cb{font-size:1.6vh;padding:.8vh 0;background:#24402f;color:#dfe}
.cb.on{background:#f2c14e;color:#222;font-weight:800}
.cb.g{border:1px solid #f2c14e88}
.cb.y{border:1px solid #7fc7ff88}
.cb:disabled{opacity:.25}
.jpl .ev{font-size:1.9vh;margin-top:.6vh;color:#7fe0a0;min-height:2.4vh}
.jres{font-size:2.8vh;font-weight:800;margin-top:1.2vh;padding:1.2vh 1vw;background:#2a2a14;border-radius:12px;color:#f2c14e}
.jres small{display:block;font-size:1.8vh;color:#ddd;font-weight:400;margin-top:.4vh}
@media(max-aspect-ratio:1/1){.cb{font-size:12px;padding:8px 0}.jpl .h{font-size:15px}.jpl .ev{font-size:13px}.jres{font-size:17px}.jres small{font-size:12px}}
</style>
</head>
<body>

<!-- ================= 시작 화면 ================= -->
<div id="start">
  <h1>섯다 도우미</h1>
  <div class="sub">참가자와 게임 종류를 고르면 TV용 대시보드로 넘어갑니다. (칩·금액 계산 없음)</div>
  <div class="sec">
    <h2>참가자 <span id="pcnt" style="color:#9fb7a6;font-size:14px"></span></h2>
    <div id="plist"></div>
    <button class="add" onclick="addP()">+ 참가자 추가</button>
  </div>
  <div class="sec">
    <h2>섯다 게임 종류</h2>
    <div class="types" id="types"></div>
    <div class="opts">
      <label><input type="checkbox" id="o_mid"> 중간족보(알리·독사·구삥·장삥·장사·세륙)</label>
      <label><input type="checkbox" id="o_tt"> 광땡·땡 인정</label>
      <label><input type="checkbox" id="o_sp"> 특수족보(암행어사·땡잡이·구사·멍구사)</label>
      <label><input type="checkbox" id="o_mj"> 멍구사 재경기를 장땡까지 인정</label>
    </div>
    <div class="note">게임 종류를 고르면 위 체크가 그 종류의 기본값으로 바뀝니다. 우리 집 룰이 다르면 직접 바꿔도 됩니다.</div>
  </div>
  <div class="sec">
    <h2>선(先)</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:16px">
      첫 판 선 <select id="firstSeon"></select>
      선 넘기기 <select id="seonRule">
        <option value="winner">이긴 사람이 선 (기본)</option>
        <option value="rotate">매 판 다음 사람에게</option>
        <option value="fixed">고정</option>
      </select>
    </div>
    <div class="note">재경기(구사·멍구사·동점) 판은 선이 바뀌지 않습니다.</div>
  </div>
  <div style="display:flex;gap:10px"><button class="go" id="goBtn" style="flex:3" onclick="startGame()">대시보드로 ▶</button>
  <button class="add" style="flex:1;width:auto;font-size:18px" onclick="showHist()">지난 기록 보기</button></div>
  <div class="note" id="resumeNote"></div>
</div>

<!-- ================= 대시보드 ================= -->
<div id="dash" class="hide">
  <div class="top">
    <div class="ttl">섯다</div>
    <div class="gt" id="gtLabel"></div>
    <div class="rd" id="rdLabel"></div>
    <div class="lastlog" id="log"></div>
    <button class="tb re" onclick="openReplay()">재경기</button>
    <button class="tb un" onclick="undo()">↶ 되돌리기</button>
    <button class="tb" onclick="openJudge()">판정기</button>
    <button class="tb" onclick="openSettings()">설정</button>
    <button class="tb cl" onclick="closeSession()">마감</button>
  </div>
  <div class="players" id="players"></div>
  <div class="jb" id="jb"></div>
</div>

<div id="sumv" class="view hide"></div>
<div id="histv" class="view hide"></div>
<div id="modal"></div>

<script>
//LOGIC-START
/* ===== 섯다 족보 판정 로직 (node 테스트에서도 사용) =====
   패: 1~10월 각 2장 (20장). g=광, y=열끗, d=띠(단)
   1:광·띠 2:열끗·띠 3:광·띠 4:열끗·띠 5:열끗·띠 6:열끗·띠 7:열끗·띠 8:광·열끗 9:열끗·띠 10:열끗·띠 */
var DECK=[];
(function(){var t={1:['g','d'],2:['y','d'],3:['g','d'],4:['y','d'],5:['y','d'],6:['y','d'],7:['y','d'],8:['g','y'],9:['y','d'],10:['y','d']};
 for(var m=1;m<=10;m++) t[m].forEach(function(k){DECK.push(m+k);});})();
var TNAME={g:'광',y:'열끗',d:'띠'};
function card(c){return {m:parseInt(c,10),t:c.replace(/^\d+/,'')};}
var GAME_TYPES={
  t2kt:{name:'2장 끗/땡',cards:2,tt:true,mid:false,sp:true,desc:'패 2장. 광땡·땡·끗(갑오~망통) + 특수족보(암행어사·땡잡이·구사·멍구사). 알리 등 중간족보는 끗으로 계산.'},
  t2all:{name:'2장 올족보',cards:2,tt:true,mid:true,sp:true,desc:'패 2장. 광땡·땡·중간족보(알리~세륙)·끗 + 특수족보(암행어사·땡잡이·구사·멍구사) 전부.'},
  t3all:{name:'3장 올족보',cards:3,tt:true,mid:true,sp:true,desc:'패 3장 받아 2장 선택. 광땡·땡·중간족보·끗 + 특수족보(암행어사·땡잡이·구사·멍구사) 전부.'},
  t3kkut:{name:'3장 끗+알리이하',cards:3,tt:false,mid:true,sp:true,desc:'패 3장 받아 2장 선택. 광땡·땡 없음(끗으로 계산). 알리~세륙 + 끗 + 특수족보(구사·멍구사는 상대 알리 이하면 재경기).'}
};
var KUT_NAME=['망통','한끗','두끗','세끗','네끗','다섯끗','여섯끗','일곱끗','여덟끗','갑오'];

/* 랭크: 38광땡 1000 / 13·18광땡 900 / 땡 800+월 / 중간 701~706 / 끗 600+끗수
   특수: 암행어사(광땡 있을 때) 950, 땡잡이(1~9땡 있을 때) 809.5 */
function evalHand(cards,opt){
  opt=opt||{mid:true,sp:true};
  var a=card(cards[0]),b=card(cards[1]); if(a.m>b.m){var x=a;a=b;b=x;}
  var has=function(m,t){return (a.m===m&&a.t===t)||(b.m===m&&b.t===t);};
  var tt=opt.tt!==false;
  if(tt&&has(3,'g')&&has(8,'g')) return {key:'38',name:'38광땡',rank:1000};
  if(tt&&has(1,'g')&&has(8,'g')) return {key:'gt18',name:'18광땡',rank:900};
  if(tt&&has(1,'g')&&has(3,'g')) return {key:'gt13',name:'13광땡',rank:900};
  if(tt&&a.m===b.m) return {key:'t'+a.m,name:TTAENG_NAME[a.m],rank:800+a.m};
  var k=(a.m+b.m)%10;
  if(opt.sp){
    if(has(4,'y')&&has(7,'y')) return {key:'k1',name:'암행어사',rank:601,special:'amhaeng'};
    if(has(3,'g')&&has(7,'y')) return {key:'k0',name:'땡잡이',rank:600,special:'ttj'};
    if(a.m===4&&b.m===9){
      if(has(4,'y')&&has(9,'y')) return {key:'k3',name:'멍텅구리구사',rank:603,special:'mung'};
      return {key:'k3',name:'구사',rank:603,special:'gusa'};
    }
  }
  if(opt.mid){ for(var i=0;i<MIDS.length;i++){var d=MIDS[i]; if(a.m===d[1]&&b.m===d[2]) return {key:d[0],name:d[3],rank:d[4]};} }
  return {key:'k'+k,name:KUT_NAME[k],rank:600+k};
}
/* players: [{id, cards:[c1,c2]}]  (쇼다운에 남은 사람만)

function resolve(players,opt){
  opt=opt||{mid:true,sp:true,mungJang:false};
  var ev=players.map(function(p){var e=evalHand(p.cards,opt); e.id=p.id; e.eff=e.rank; e.label=e.name; return e;});
  var any=function(f){return ev.some(f);};
  var gt1318=any(function(e){return e.key==='gt13'||e.key==='gt18';});
  var t19=any(function(e){return /^t[1-9]$/.test(e.key);});
  ev.forEach(function(e){
    if(e.special==='amhaeng'){ if(gt1318){e.eff=950;e.label='암행어사(광땡 잡음)';} else e.label='암행어사→한끗'; }
    if(e.special==='ttj'){ if(t19){e.eff=809.5;e.label='땡잡이(땡 잡음)';} else e.label='땡잡이→망통'; }
    if(e.special==='gusa') e.label='구사(세끗)';
    if(e.special==='mung') e.label='멍구사(세끗)';
  });
  var out={evals:{}}; ev.forEach(function(e){out.evals[e.id]=e;});
  if(ev.length>=2){
    for(var i=0;i<ev.length;i++){var e=ev[i]; if(e.special!=='gusa'&&e.special!=='mung') continue;
      var maxO=Math.max.apply(null,ev.filter(function(o){return o!==e;}).map(function(o){return o.eff;}));
      if(e.special==='gusa'&&maxO<801){out.type='replay';out.winners=[];out.reason='구사 — 상대 최고패가 '+(opt.mid?'알리 이하':'땡 미만(끗)')+' → 재경기';out.by=e.id;return out;}
      var lim=opt.tt===false?706:(opt.mungJang?810:809);
      if(e.special==='mung'&&maxO<=lim){out.type='replay';out.winners=[];out.reason='멍텅구리구사 — 상대 최고패가 '+(opt.tt===false?'알리':(opt.mungJang?'장땡':'9땡'))+' 이하 → 재경기';out.by=e.id;return out;}
    }
  }
  var top=Math.max.apply(null,ev.map(function(e){return e.eff;}));
  var w=ev.filter(function(e){return e.eff===top;});
  out.winners=w.map(function(e){return e.id;});
  if(w.length>1){out.type='tie';out.reason='같은 족보('+w[0].label+') 동점 → 해당자끼리 재경기';}
  else {out.type='win';out.reason=w[0].label+' 승';}
  return out;
}

    r.push({n:'구삥',c:['1g','9y'],d:'1월+9월'});
    r.push({n:'장삥',c:['1g','10y'],d:'1월+10월'});
    r.push({n:'장사',c:['4y','10y'],d:'4월+10월'});
    r.push({n:'세륙',c:['4y','6y'],d:'4월+6월'});
  }
  if(opt.sp){
    r.push({n:'암행어사',c:['4y','7y'],d:tt?'13·18광땡 잡음 · 없으면 한끗':'광땡 없는 룰 → 항상 한끗',k:'s'});
    r.push({n:'땡잡이',c:['3g','7y'],d:tt?'1~9땡 잡음 · 없으면 망통':'땡 없는 룰 → 항상 망통',k:'s'});
    r.push({n:'구사',c:['4d','9d'],d:'상대가 '+(opt.mid?'알리 이하':'땡 미만')+'면 재경기',k:'s'});
    r.push({n:'멍텅구리구사',c:['4y','9y'],d:'상대가 '+(!tt?'알리':(opt.mungJang?'장땡':'9땡'))+' 이하면 재경기',k:'s'});
  }
  return r;
}
function cimg(c){return '<img src="'+CARDIMG[c]+'" alt="'+card(c).m+'월 '+TNAME[card(c).t]+'">';}

/* ================= 앱 상태 ================= */
var KEY='seotda_v1';
var S=null; // {players:[name], type, opt:{mid,sp,mungJang}, seonRule, seon:name, rounds:[]}
var draft={names:['','','',''],type:'t3all'};
function load(){try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){S=null;}
  if(S&&S.type==='t3kta'){ S.type='t3kkut'; S.opt=S.opt||{}; S.opt.tt=false; S.opt.mid=true; S.opt.sp=true; save(); }
  if(S&&S.opt&&S.opt.tt===undefined) S.opt.tt=GAME_TYPES[S.type]?GAME_TYPES[S.type].tt:true;
  if(S&&!GAME_TYPES[S.type]) S.type='t3all';}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}

/* ---------- 시작 화면 ---------- */
function renderStart(){
  var h='';
  draft.names.forEach(function(n,i){
    h+='<div class="prow"><input id="nm'+i+'" placeholder="참가자 '+(i+1)+'" value="'+esc(n)+'" oninput="draft.names['+i+']=this.value;fillSeon()">'+

  });

  var t='';

    t+='<button class="type'+(draft.type===k?' on':'')+'" id="ty_'+k+'" onclick="pickType(\''+k+'\')"><b>'+g.name+'</b><span>'+g.desc+'</span></button>';});
  $('types').innerHTML=t;
  fillSeon();

function fillSeon(){
  var sel=$('firstSeon'),cur=sel.value; var names=draft.names.map(function(n,i){return n.trim()||('참가자 '+(i+1));});
  sel.innerHTML=names.map(function(n){return '<option>'+esc(n)+'</option>';}).join('');
  if(names.indexOf(cur)>=0) sel.value=cur;
}
function addP(){ if(draft.names.length>=10) return alert('최대 10명'); draft.names.push(''); renderStart(); }
function delP(i){ draft.names.splice(i,1); renderStart(); }
function pickType(k){ draft.type=k; var g=GAME_TYPES[k]; $('o_tt').checked=g.tt; $('o_mid').checked=g.mid; $('o_sp').checked=g.sp; renderStart(); }
function startGame(){
  var names=draft.names.map(function(n,i){return n.trim()||('참가자 '+(i+1));});
  if(names.length<2) return alert('2명 이상 필요');
  if(new Set(names).size!==names.length) return alert('이름이 겹칩니다');
  var keep=S&&S.rounds&&S.rounds.length&&draft.editing;
  var rounds=keep?S.rounds:[];
  S={players:names,type:draft.type,opt:{tt:$('o_tt').checked,mid:$('o_mid').checked,sp:$('o_sp').checked,mungJang:$('o_mj').checked},
     seonRule:$('seonRule').value,seon:$('firstSeon').value,rounds:rounds,started:(keep&&S.started)?S.started:Date.now()};
  if(names.indexOf(S.seon)<0) S.seon=names[0];
  draft.editing=false; save(); showDash();
}
function showStart(edit){
  draft.editing=!!edit;
  if(edit&&S){ draft.names=S.players.slice(); draft.type=S.type; }
  showView('start');
  renderStart();
  if(edit&&S){ $('o_tt').checked=S.opt.tt!==false; $('o_mid').checked=S.opt.mid; $('o_sp').checked=S.opt.sp; $('o_mj').checked=!!S.opt.mungJang; $('seonRule').value=S.seonRule; fillSeon(); $('firstSeon').value=S.seon;
    $('goBtn').textContent='변경 저장하고 대시보드로 ▶ (기록 유지)'; }
  else { var g=GAME_TYPES[draft.type]; $('o_tt').checked=g.tt; $('o_mid').checked=g.mid; $('o_sp').checked=g.sp; $('goBtn').textContent='대시보드로 ▶'; }
}

/* ---------- 대시보드 ---------- */
function wins(n){return S.rounds.filter(function(r){return r.winner===n;}).length;}
function realRounds(){return S.rounds.filter(function(r){return r.winner;}).length;}
function showDash(){ showView('dash'); renderDash(); }
function renderDash(){
  var g=GAME_TYPES[S.type];
  $('gtLabel').textContent=g.name+(S.opt.mid!==g.mid||S.opt.sp!==g.sp||(S.opt.tt!==false)!==g.tt?' (변형)':'');
  var n=S.rounds.length;
  $('rdLabel').innerHTML=(n+1)+'판째 <small>(승부 '+realRounds()+' · 재경기 '+(n-realRounds())+')</small>';
  var P=S.players, cnt=P.length;
  var pl=$('players'); pl.style.gridTemplateColumns='repeat('+cnt+',1fr)'; pl.style.gridTemplateRows='1fr';
  var last=S.rounds[n-1];
  pl.innerHTML=P.map(function(name,i){
    var my=S.rounds.map(function(r){return r.winner===name?'<i>'+esc(r.handName||'승')+'</i>':null;}).filter(Boolean).slice(-4).reverse().join('');
    var w=wins(name), rr=realRounds();
    return '<button class="pc'+(S.seon===name?' seon':'')+(last&&last.winner===name?' last':'')+'" onclick="openWin('+i+')">'+
      (S.seon===name?'<span class="sb">선</span>':'')+
      '<div class="nm">'+esc(name)+'</div>'+
      '<div class="wn">'+w+'승<small>/ '+rr+'판</small></div>'+
      '<div class="hist">'+(my||'<span class="tap">이기면 탭</span>')+'</div></button>';
  }).join('');
  // 족보 (실사 패)
  var all=handTiles(S.opt), t=all.filter(function(x){return x.k!=='s';}), sp=all.filter(function(x){return x.k==='s';});
  var main=t.concat(sp), nt=main.length;
  var cols=nt<=8?4:nt<=10?5:nt<=12?6:7, rows=Math.ceil(nt/cols);
  var h='<h3>족보 — 높은 순 ('+esc(g.name)+')<small>'+(g.cards===3?'3장 중 2장으로 승부 · ':'')+'같은 족보 동점이면 해당자끼리 재경기</small></h3>'+
    '<div class="tiles" style="grid-template-columns:repeat('+cols+',1fr);grid-template-rows:repeat('+rows+',1fr)">';
  var no=0;
  main.forEach(function(x){ if(x.k!=='s') no++;
    h+='<div class="tile'+(x.k?' '+x.k:'')+'"><span class="no">'+(x.k==='s'?'특수':no)+'</span><div class="cds">'+x.c.map(cimg).join('')+'</div>'+
       '<div class="hn">'+x.n+'</div><div class="hd">'+x.d+'</div></div>';});
  h+='</div><div class="kuth">끗 — 두 장 숫자를 더한 값의 <b>끝자리</b> (클수록 셈) · 위 족보가 아닐 때'+(S.opt.tt===false?' · <b>광땡·같은 월 2장도 끗으로 계산</b>':'')+(S.opt.sp&&S.opt.tt!==false?' · 구사/멍구사가 재경기 조건이 안 되면 세끗':'')+'</div><div class="kuts">';
  for(var k=9;k>=0;k--){ no++; var ex=KUT_EX[k], a=card(ex[0]).m, b=card(ex[1]).m;
    h+='<div class="kt"><span class="no">'+no+'</span><div class="cds">'+cimg(ex[0])+cimg(ex[1])+'</div><div class="hn">'+(k===9?'갑오(9끗)':k===0?'망통(0끗)':k===1?'한끗':k+'끗')+'</div><div class="hd">'+a+'+'+b+'='+(a+b)+'</div></div>'; }
  h+='</div><div class="credit">패 그림: Wikimedia Commons Hwatu (CC BY-SA 4.0)</div>';
  $('jb').innerHTML=h;
  var lr=S.rounds[n-1];
  $('log').innerHTML=lr?('직전 '+lr.no+'판: '+(lr.winner?'<b>'+esc(lr.winner)+'</b> 승'+(lr.handName?' ('+esc(lr.handName)+')':''):'재경기 '+esc(lr.replay||''))):'이긴 사람 이름을 탭해서 기록';
}
function nextSeon(winner){
  if(S.seonRule==='winner') return winner;
  if(S.seonRule==='rotate'){var i=S.players.indexOf(S.seon);return S.players[(i+1)%S.players.length];}
  return S.seon;
}
function record(winner,handKey,handName,replay){
  var r={no:S.rounds.length+1,winner:winner||null,hand:handKey||null,handName:handName||null,replay:replay||null,seonBefore:S.seon,t:Date.now()};
  S.rounds.push(r);
  if(winner) S.seon=nextSeon(winner);
  save(); closeM(); renderDash();
}
function undo(){
  var r=S.rounds[S.rounds.length-1]; if(!r) return;
  if(!confirm(r.no+'판 기록('+(r.winner?r.winner+' 승':'재경기')+')을 지울까요?')) return;
  S.rounds.pop(); S.seon=r.seonBefore; save(); renderDash();
}
/* ---------- 모달 ---------- */
function M(html){$('modal').innerHTML='<div class="mask" onclick="if(event.target===this)closeM()"><div class="mod">'+html+'</div></div>';}
function closeM(){$('modal').innerHTML='';}
var pick=null;
function openWin(i){
  var name=S.players[i]; pick=null;
  var hs=handChoices(S.opt);
  M('<h2>'+esc(name)+' 승리</h2><div class="hint">이긴 족보를 고르면 같이 기록돼요 (안 골라도 됨)</div><div class="hg">'+
    hs.map(function(h,k){return '<button class="hb'+(h.s?' s':'')+'" id="hb'+k+'" onclick="pickH('+k+')">'+h.name+'</button>';}).join('')+

}

function confirmWin(i){var hs=handChoices(S.opt),h=pick!==null?hs[pick]:null; record(S.players[i],h&&h.key,h&&h.name);}

    '<button class="hb s" onclick="if(confirm(\'새 게임: 참가자부터 다시 입력?\')){localStorage.removeItem(KEY);S=null;closeM();draft={names:[\'\',\'\',\'\',\'\'],type:\'t3all\'};showStart(false);}">새 게임</button>'+

/* ---------- 마감 · 지난 기록 ---------- */
var HKEY='seotda_hist_v1', HNO='seotda_hist_no';
function histGet(){try{return JSON.parse(localStorage.getItem(HKEY))||[];}catch(e){return [];}}
function histPut(h){localStorage.setItem(HKEY,JSON.stringify(h.slice(0,50)));}
function pad(n){return (n<10?'0':'')+n;}
function fDate(t){var d=new Date(t);return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' ('+'일월화수목금토'[d.getDay()]+') '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fTime(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());}
function fDur(ms){var m=Math.max(0,Math.round(ms/60000)),h=Math.floor(m/60);return (h?h+'시간 ':'')+(m%60)+'분';}
function buildSession(){
  var no=(parseInt(localStorage.getItem(HNO)||'0',10)||0)+1;
  var first=S.rounds.length?S.rounds[0].t:Date.now();
  var start=S.started?Math.min(S.started,first):first;
  return {id:Date.now(),no:no,start:start,end:Date.now(),type:S.type,typeName:GAME_TYPES[S.type].name,players:S.players.slice(),
    rounds:S.rounds.map(function(r){return {no:r.no,winner:r.winner,handName:r.handName,replay:r.replay,seon:r.seonBefore,t:r.t};})};
}
function closeSession(){
  if(!S.rounds.length) return alert('아직 기록된 판이 없어요');
  if(!confirm('이번 회를 마감할까요? ('+S.rounds.length+'판 기록)\n마감하면 지난 기록에 저장되고 판 기록이 비워집니다.')) return;
  var ss=buildSession(); localStorage.setItem(HNO,String(ss.no));
  var h=histGet(); h.unshift(ss); histPut(h);
  S.closedLast=ss.id; S.rounds=[]; S.started=Date.now(); save();
  showSummary(ss,'closed');
}
function showView(id){['start','dash','sumv','histv'].forEach(function(v){$(v).classList.toggle('hide',v!==id);});}
function rlStyle(n){var c=n<=24?1:n<=52?2:n<=84?3:4, f=[2.1,1.85,1.55,1.3][c-1]; return 'column-count:'+c+';column-width:auto;font-size:'+f+'vh';}
function showSummary(ss,mode){
  var real=ss.rounds.filter(function(r){return r.winner;}).length, rep=ss.rounds.length-real;
  var rank=ss.players.map(function(n){return {n:n,w:ss.rounds.filter(function(r){return r.winner===n;}).length};}).sort(function(a,b){return b.w-a.w;});
  var pr=null,place=0;
  var rk=rank.map(function(x,i){ if(x.w!==pr){place=i+1;pr=x.w;} return '<div class="rkr'+(place===1&&x.w>0?' top':'')+'"><span>'+place+'위</span><b>'+esc(x.n)+'</b><em>'+x.w+'승</em><small>'+(real?Math.round(x.w*100/real):0)+'%</small></div>';}).join('');
  var list=ss.rounds.map(function(r){
    return '<div class="rr'+(r.winner?'':' rp')+'"><span class="rn">'+r.no+'판</span> '+(r.winner?'<b>'+esc(r.winner)+'</b> 승 · '+(r.handName?esc(r.handName):'<i>족보 미선택</i>'):'<b class="rpw">재경기</b> · '+esc(r.replay||'사유 없음'))+' · 선 '+esc(r.seon||'-')+' · '+fTime(r.t)+'</div>';}).join('');
  var btns=mode==='closed'
    ?'<button class="ok" onclick="newRoundSame()">같은 멤버로 새 회 시작</button><button class="mid" onclick="showHist()">지난 기록 보기</button><button class="no" onclick="toFirst()">처음 화면</button>'
    :'<button class="no" onclick="histDel('+ss.id+')">이 기록 삭제</button><button class="mid" onclick="showHist()">목록으로</button><button class="ok" onclick="backFromHist()">닫기</button>';
  $('sumv').innerHTML='<div class="sh"><div class="st">'+ss.no+'회차 정산 기록'+(mode==='closed'?' <span class="badge">마감 완료</span>':'')+'</div>'+
    '<div class="sm">'+fDate(ss.start)+' ~ '+fTime(ss.end)+' · '+esc(ss.typeName)+'</div></div>'+
    '<div class="sb2"><div class="sl">'+
      '<div class="kpi"><div><b>'+ss.rounds.length+'</b>판<small>총 판수</small></div><div><b>'+real+'</b>판<small>승부</small></div><div><b>'+rep+'</b>판<small>재경기</small></div></div>'+
      '<div class="kpi"><div class="wide"><b>'+fDur(ss.end-ss.start)+'</b><small>경과 시간 ('+fTime(ss.start)+' 시작 → '+fTime(ss.end)+' 마감)</small></div></div>'+
      '<div class="pp">참가자 '+ss.players.length+'명: '+ss.players.map(esc).join(', ')+'</div>'+
      '<div class="rk">'+rk+'</div></div>'+
    '<div class="sr"><div class="srh">판별 기록 ('+ss.rounds.length+'판)</div><div class="rl" style="'+rlStyle(ss.rounds.length)+'">'+(list||'<div class="rr">기록 없음</div>')+'</div></div></div>'+
    '<div class="mrow sbt">'+btns+'</div>';
  showView('sumv');
}
function newRoundSame(){ closeM(); S.started=Date.now(); save(); showView('dash'); renderDash(); }
function toFirst(){ var names=S?S.players.slice():['','','','']; var ty=S?S.type:'t3all'; localStorage.removeItem(KEY); S=null; draft={names:names,type:ty}; showStart(false); }
var histFrom='start';
function showHist(){
  var fromGame=!$('dash').classList.contains('hide')||!$('sumv').classList.contains('hide');
  if($('histv').classList.contains('hide')) histFrom=(fromGame&&S&&S.players)?'dash':'start';
  closeM();
  var h=histGet();
  var rows=h.map(function(ss){
    var real=ss.rounds.filter(function(r){return r.winner;}).length;
    var best=ss.players.map(function(n){return {n:n,w:ss.rounds.filter(function(r){return r.winner===n;}).length};}).sort(function(a,b){return b.w-a.w;})[0];
    return '<div class="hr"><button class="hopen" onclick="openHist('+ss.id+')"><b>'+ss.no+'회차</b><span>'+fDate(ss.start)+'</span><span>'+esc(ss.typeName)+'</span><span>'+ss.rounds.length+'판 (재경기 '+(ss.rounds.length-real)+')</span><span>'+fDur(ss.end-ss.start)+'</span><span>최다승 '+(best&&best.w?esc(best.n)+' '+best.w+'승':'-')+'</span></button><button class="hdel" onclick="histDel('+ss.id+')">삭제</button></div>';}).join('');
  $('histv').innerHTML='<div class="sh"><div class="st">지난 기록 <small>(최근 50회)</small></div></div><div class="hl">'+(rows||'<div class="hempty">아직 마감한 기록이 없어요. 대시보드의 [마감] 버튼으로 저장됩니다.</div>')+'</div>'+
    '<div class="mrow sbt"><button class="ok" onclick="backFromHist()">닫기</button></div>';
  showView('histv');
}
function openHist(id){var ss=histGet().filter(function(x){return x.id===id;})[0]; if(ss) showSummary(ss,'hist');}
function histDel(id){ if(!confirm('이 기록을 지울까요?')) return; histPut(histGet().filter(function(x){return x.id!==id;})); showHist(); }
function backFromHist(){ if(S&&S.players&&histFrom==='dash'){ showView('dash'); renderDash(); } else { showView('start'); if(S&&S.players){showDash();} else renderStart(); } }
/* ---------- 판정기 ---------- */
var J=null;
function openJudge(){ J={hands:{},on:{}}; S.players.forEach(function(n){J.hands[n]=[];J.on[n]=true;}); renderJudge(); }
function renderJudge(){
  var g=GAME_TYPES[S.type], need=g.cards; // 3장 모드는 2장(최종패) 또는 3장 입력 가능
  var used={}; S.players.forEach(function(n){J.hands[n].forEach(function(c){used[c]=n;});});
  var h='<h2>판정기 · '+esc(g.name)+'</h2><div class="hint">끝까지 남은 사람만 체크하고 패를 고르세요.'+(need===3?' 3장 모드: 3장을 고르면 가장 좋은 2장을 자동으로 골라요 (최종 2장만 넣어도 됨).':'')+'</div><div class="jp">';
  S.players.forEach(function(n,pi){
    var mine=J.hands[n];
    h+='<div class="jpl'+(J.on[n]?'':' off')+'"><div class="h">'+esc(n)+'<label><input type="checkbox" '+(J.on[n]?'checked':'')+' onchange="J.on[S.players['+pi+']]=this.checked;renderJudge()"> 참가</label></div><div class="cg">';
    DECK.forEach(function(c){var cc=card(c),on=mine.indexOf(c)>=0,dis=(used[c]&&used[c]!==n)||(!on&&mine.length>=need);
      h+='<button class="cb '+cc.t+(on?' on':'')+'" '+(dis?'disabled':'')+' onclick="jTog('+pi+',\''+c+'\')">'+cc.m+TNAME[cc.t]+'</button>';});
    h+='</div><div class="ev" id="jev'+pi+'"></div></div>';
  });
  h+='</div><div class="jres" id="jres">패를 2장씩 고르세요</div><div class="mrow"><button class="mid" onclick="openJudge()">초기화</button><button class="no" onclick="closeM()">닫기</button><button class="ok hide" id="jrec">이 결과 기록</button></div>';
  M(h); judgeCalc();
}
function jTog(pi,c){var n=S.players[pi],a=J.hands[n],i=a.indexOf(c); if(i>=0)a.splice(i,1); else a.push(c); renderJudge();}
function bestPick(players){
  // 3장 입력자: 가능한 조합 중 '나에게 가장 유리한' 2장 (다른 사람은 현재 최선 가정, 2회 반복)
  var choice={}; players.forEach(function(p){choice[p.id]=p.cards.length===3?combos3(p.cards)[0]:p.cards;});
  for(var it=0;it<2;it++) players.forEach(function(p){ if(p.cards.length!==3) return;
    var best=null,bs=-1;
    combos3(p.cards).forEach(function(cb){
      var arr=players.map(function(q){return {id:q.id,cards:q.id===p.id?cb:choice[q.id]};});
      var r=resolve(arr,S.opt), sc=r.type==='win'&&r.winners[0]===p.id?3:(r.type==='tie'&&r.winners.indexOf(p.id)>=0)||r.type==='replay'&&r.by===p.id?2:1;
      var tb=r.evals[p.id].eff; sc=sc*10000+tb;
      if(sc>bs){bs=sc;best=cb;}
    }); choice[p.id]=best; });
  return players.map(function(p){return {id:p.id,cards:choice[p.id],all:p.cards};});
}
function judgeCalc(){
  var g=GAME_TYPES[S.type];
  var ps=S.players.filter(function(n){return J.on[n];}).map(function(n){return {id:n,cards:J.hands[n].slice()};});
  var ready=ps.length>=2&&ps.every(function(p){return p.cards.length===2||(g.cards===3&&p.cards.length===3);});
  if(!ready){ $('jres').textContent=ps.length<2?'참가자 2명 이상 체크':'패를 다 고르면 결과가 나와요'; return; }
  var fin=bestPick(ps), r=resolve(fin,S.opt);
  fin.forEach(function(p){var e=r.evals[p.id],pi=S.players.indexOf(p.id);
    $('jev'+pi).textContent=e.label+(p.all.length===3?' ← '+p.cards.map(function(c){var x=card(c);return x.m+TNAME[x.t];}).join('+'):'');});
  var rb=$('jrec');
  if(r.type==='win'){ var e=r.evals[r.winners[0]];
    $('jres').innerHTML=esc(r.winners[0])+' 승! <small>'+esc(r.reason)+'</small>';
    rb.classList.remove('hide'); rb.onclick=function(){record(r.winners[0],e.key,e.label.replace(/\(.*\)/,''));};
  } else {
    $('jres').innerHTML='재경기 <small>'+esc(r.reason)+(r.type==='tie'?' ('+r.winners.map(esc).join(', ')+')':'')+'</small>';
    rb.classList.remove('hide'); rb.onclick=function(){record(null,null,null,r.type==='tie'?'동점(같은 족보)':(r.evals[r.by].special==='mung'?'멍텅구리구사':'구사'));};
  }
}

/* ---------- 시작 ---------- */
load();
if(S&&S.players){ showDash(); } else { showStart(false); }
</script>

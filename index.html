<body>
<header><h1>고스톱 칩 관리</h1><span id="mult" class="tag hide"></span></header>
<div id="robar" class="robar hide"></div>
<main id="app"></main>

<script id="logic">
// ===== 순수 로직 (node 테스트 대상) =====
var L = (function(){
  function won(n){ n = Math.round(n); return (n<0?'-':'') + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '원'; }
  // 충전 버튼 금액 (고정): +1만원, +5만원, +10만원
  var CHARGE_AMTS = [10000, 50000, 100000];
  // limit = 기본 충전 금액(예전 데이터 호환용). 새 게임은 항상 모두 잔액 0원, 넣은 돈 0원에서 시작 (자동 충전 없음)
  function newGame(names, limit, ppp){
    var st0 = 0;
    return { limit: limit, ppp: ppp, start: st0, nextMult: 1, round: 0, gwangpal: true, ctScore: 10, giveupMult: 2, gwangPrice: 5000, gwangPayer: 'noSeon',
      players: names.map(function(n){ return {name:n, bal:st0, charges:st0>0?1:0, invested:st0}; }),
      log: [], chg: [], chgSeq: 0 };
  }
  function active(g, i){ return g.players[i].bal > 0; }
  // 이번 판에 실제로 치는 사람: 잔액>0, 광팔이(rest)·죽은 사람(dead) 제외. 광팔이 규칙이 켜져 있으면 치는 사람은 2~3명
  function roundPlayers(g, rest, dead){
    rest = rest || {}; dead = dead || {};
    var act = g.players.map(function(p,i){return i;}).filter(function(i){ return g.players[i].bal>0; });
    if (g.gwangpal === false){ var pl = act.filter(function(i){ return !dead[i]; }); return {ok: pl.length>=2, play: pl, need: 0}; }
    var nDead = act.filter(function(i){ return dead[i] && !rest[i]; }).length;
    var need = Math.max(0, act.length-3-nDead);
    var play = act.filter(function(i){ return !rest[i] && !dead[i]; });
    return {ok: play.length>=2 && play.length<=3, play: play, need: need};
  }
  // 4명 순서 자동 판정: order=[선, 두 번째, 세 번째, 마지막], d2·d3 = 'go'(진행) 또는 'die'(포기)
  // 두 번째·세 번째가 모두 진행하면 마지막 주자가 광팔이, 한 명이라도 포기하면 마지막 주자는 참여
  function autoSeat(order, d2, d3){
    var rest = {}, dead = {};
    if (d2==='die') dead[order[1]] = true;
    if (d3==='die') dead[order[2]] = true;
    if (d2!=='die' && d3!=='die') rest[order[3]] = true;
    return {rest: rest, dead: dead, lastRests: d2!=='die' && d3!=='die'};
  }
  // 단순 순서: 선만 고르면 사람 목록(자리) 순서대로 선 다음부터 두 번째·세 번째·마지막 (잔액 있는 사람만)
  function seatOrder(g, seon){
    var act = g.players.map(function(p,i){return i;}).filter(function(i){ return g.players[i].bal>0; });
    var k = act.indexOf(seon); if (k<0) k = 0;
    return act.slice(k).concat(act.slice(0,k));
  }
  // 선·광팔이만 고르는 방식: 광팔이가 있으면 나머지는 모두 진행(죽은 사람 없음). 광팔이 없음이면 고른 죽은 사람만 빠짐
  // 4명 이상이고 광팔이 규칙이 켜져 있으면 기본 광팔이 = 마지막 주자 (두 번째·세 번째가 모두 진행한 경우)
  // gpOn: 광팔이 체크 → 마지막 주자가 광팔이로 쉬고 나머지(2·3번째 포함)는 모두 진행. 체크 안 하면 dead(2·3번째 중 죽은 사람)만 빠짐
  // gpPick: 카드에서 체크한 광팔이 번호(있으면 마지막 주자 자동 판정 대신 그 사람이 쉼, 나머지 모두 진행).
  // 선이면 쉴 수 없어 적용 안 함(conflict 'seon'), 마지막 주자가 아니면 그대로 적용하고 안내(conflict 'notLast')
  function simpleSeat(g, seon, gpOn, dead, gpPick){
    var order = seatOrder(g, seon), rest = {}, dd = {}, conflict = null, picked = false;
    var canGp = g.gwangpal!==false && order.length>=4;
    if (gpPick!==undefined && gpPick!==null && canGp && order.indexOf(gpPick)>=0){
      if (gpPick===order[0]) conflict = 'seon';
      else { rest[gpPick] = true; picked = true; if (gpPick!==order[order.length-1]) conflict = 'notLast'; }
    }
    // 죽음(쉼) 체크가 하나라도 있으면 '광팔이 있음(마지막 주자 자동 쉼)'은 자동으로 풀리고 죽음 체크대로만 진행 (JB: 광팔이 = 쉬는 사람)
    var anyDead = Object.keys(dead||{}).some(function(i){ return dead[i] && +i!==order[0] && order.indexOf(+i)>=0 && !rest[i]; });
    if (!picked && conflict!=='seon' && gpOn && canGp && !anyDead) rest[order[order.length-1]] = true;
    // 죽은 사람: 선과 광팔이를 뺀 사람 (카드의 죽음 체크와 같은 상태). 광팔이가 있으면 나머지는 모두 진행 → 죽음 무시
    // (단 5명 이상이라 광팔이를 빼고도 4명 이상 남으면 죽은 사람이 따로 빠질 수 있음)
    Object.keys(dead||{}).forEach(function(i){ i=+i; var k = order.indexOf(i); if (dead[i] && k>0 && !rest[i]) dd[i] = true; });
    return {order: order, seon: order[0], rest: rest, dead: dd, conflict: conflict, picked: picked};
  }
  function gwangPriceOf(g){ return g.gwangPrice>0 ? g.gwangPrice : 5000; }
  // 광값 낼 사람: 'noSeon'(기본) = 선 제외, 두 번째·세 번째 주자만 / 'all' = 선 포함 치는 사람 모두. 죽은 사람은 항상 제외
  function gwangMode(g){ return g.gwangPayer==='all' ? 'all' : 'noSeon'; }
  function gwangPayerText(g){ return gwangMode(g)==='all' ? '선 포함 치는 사람 모두 (죽은 사람 제외)' : '선 제외, 두 번째·세 번째 주자만 (죽은 사람 제외)'; }
  // 광값: 광팔이가 든 광·쌍피 개수 x 개당 금액을 낼 사람 각각이 광팔이에게. 죽은 사람은 치는 사람이 아니라 항상 제외
  // 점수 정산 뒤 남는 잔액 안에서만 낸다 (잔액 한도)
  // seon: 선의 번호 (모르면 치는 사람 모두가 냄)
  function gwangCalc(g, res, gwangs, seon){
    var price = gwangPriceOf(g), noSeon = gwangMode(g)==='noSeon';
    var play = [res.winner].concat(res.lines.map(function(x){ return x.idx; }));
    var bal = {}; play.forEach(function(i){ bal[i] = g.players[i].bal; });
    res.lines.forEach(function(x){ bal[x.idx] -= x.pay; }); bal[res.winner] += res.total;
    var out = [];
    (gwangs||[]).forEach(function(r){
      var cnt = Math.max(0, Math.floor(+r.count||0)); if (!cnt) return;
      var each = cnt * price;
      play.filter(function(i){ return i!==r.idx && !(noSeon && i===seon); }).forEach(function(i){
        var pay = Math.min(each, Math.max(0, bal[i])); bal[i] -= pay;
        out.push({from:i, to:r.idx, count:cnt, price:price, each:each, pay:pay, capped: pay<each});
      });
    });
    return out;
  }
  function gwangFormula(g, x){ return '광값: '+x.count+'개 x '+won(x.price)+' = '+won(x.each)+'씩, '+g.players[x.from].name+' → '+g.players[x.to].name; }
  function roundNote(g, res, opt){
    var detail = res.lines.filter(function(x){return x.pay>0;}).map(function(x){return g.players[x.idx].name+' → '+g.players[res.winner].name+' '+won(x.pay);}).join(', ');
    var extra = (opt.deadNames&&opt.deadNames.length?' / 죽음 '+opt.deadNames.join(','):'');
    var gw = (res.gwang||[]).filter(function(x){return x.pay>0;});
    if (gw.length) extra += ' / 광값 '+gw[0].count+'개 x '+won(gw[0].price)+': '+gw.map(function(x){return g.players[x.from].name+' → '+g.players[x.to].name+' '+won(x.pay);}).join(', ');
    var rn = (opt.restNames&&opt.restNames.length?' / 광팔이 '+opt.restNames.join(','):'');
    if (res.chongtong && (res.ppeok||[]).length) extra += ppeokNote(g, res);
    if (res.chongtong) return g.players[res.winner].name+' 총통 승 ('+res.lines[0].score+'점)'+rn+' / '+detail+extra;
    extra += ppeokNote(g, res);
    return g.players[res.winner].name+' '+opt.score+'점 승'+(opt.giveup?' (총통 포기)':'')+(opt.go?' ('+opt.go+'고)':'')+rn+' / '+detail+extra;
  }
  // 고 점수: 1고 +1점, 2고 +2점 (점수에 먼저 더함), 3고부터 점수 그대로 x2, 4고 x4, 5고 x8 ...
  function goScore(base, go){
    if (go<=0) return {score:base, mul:1};
    if (go===1) return {score:base+1, mul:1};
    if (go===2) return {score:base+2, mul:1};
    return {score:base, mul:Math.pow(2, go-2)};
  }
  // opt: {score, go, shake(흔들기 횟수), bomb(폭탄 횟수), losers:[{idx, pi, gwang, meong, gobak}]}
  // 총통 승: 정해진 점수(기본 10점) x 점당 금액, 다른 배수 없음
  function chongtongRound(g, winner, opt){
    var sc = g.ctScore||10;
    var lines = opt.losers.map(function(l){
      var raw = sc * g.ppp;
      return { idx:l.idx, score:sc, mult:1, parts:[], formula: sc+'점 x '+won(g.ppp)+' = '+won(raw), raw: raw };
    });
    lines.forEach(function(x){ var bal = g.players[x.idx].bal; x.pay = Math.min(x.raw, Math.max(0, bal)); x.capped = x.pay < x.raw; });
    var res = { winner:winner, chongtong:true, lines:lines, total: lines.reduce(function(s,x){return s+x.pay;},0) };
    res.gwang = gwangCalc(g, res, opt.gwangs, opt.seon); res.ppeok = ppeokCalc(g, res, opt.ppeoks, opt.seated); return res;
  }
  // 총통 포기 진행 배수: 2배(폭탄) 또는 4배(흔들기+폭탄)
  // 뻑: 첫뻑 = 승자 점수에 +N점(기본 3점, 고 가산과 같은 단계에서 먼저 더함). 2연뻑·3연뻑 = 진 사람 전원 xM(기본 2배). 2연뻑·3연뻑은 둘 중 하나만
  function ppeokScoreOf(g){ return num(g.ppeokScore)>0 ? num(g.ppeokScore) : 3; }
  function ppeokMultOf(g){ return num(g.ppeokMult)>0 ? num(g.ppeokMult) : 2; }
  // 뻑(참가자별, 별도 정산): 뻑 먹은 사람은 승패와 상관없이 나머지 사람 각자에게 (뻑 점수 x 점당 금액)을 받는다
  // 단계 1=첫뻑(기본 3점), 2=2연뻑(x2 = 6점), 3=3연뻑(x2 x2 = 12점). 예전 저장분의 ppeokScore·ppeokMult 값도 그대로 기본 점수·배수로 쓴다
  var PPEOK_NAMES = ['', '첫뻑', '2연뻑', '3연뻑'];
  function ppeokPoints(g, level){ level = Math.floor(+level||0); if (level<1||level>3) return 0; return ppeokScoreOf(g) * Math.pow(ppeokMultOf(g), level-1); }
  // 낼 사람: 죽은 사람은 항상 빠짐. 'play'(기본, 값 없을 때) = 실제로 친 사람만(광팔이도 빠짐) / 'seated' = 광팔이(쉬는 사람)도 냄 (예전에 설정에서 저장한 값은 그대로)
  // JB: 광팔이 = 쉬는(죽은) 사람 → 뻑은 언제나 이번 판에 친 사람만 냄 (예전 설정값 'seated'는 읽기만 하고 쓰지 않음)
  function ppeokPayerMode(g){ return 'play'; }
  function ppeokPayerText(g){ return ppeokPayerMode(g)==='play' ? '이번 판에 친 사람만 (광팔이·죽은 사람 제외)' : '광팔이 포함 (죽은 사람 제외)'; }
  // 점수 정산·광값 뒤 남은 잔액 안에서만 낸다 (잔액 한도). seated: 판 시작 때 잔액 있던 사람 번호들
  function ppeokCalc(g, res, ppeoks, seated){
    var play = [res.winner].concat(res.lines.map(function(x){ return x.idx; }));
    if (!seated) seated = g.players.map(function(p,i){return i;}).filter(function(i){ return g.players[i].bal>0; });
    var dpk = g.deadPick||{}, payers = ppeokPayerMode(g)==='play' ? play : seated.filter(function(j){ return !dpk[j]; });
    var bal = g.players.map(function(p){ return p.bal; });
    res.lines.forEach(function(x){ bal[x.idx] -= x.pay; }); bal[res.winner] += res.total;
    (res.gwang||[]).forEach(function(x){ bal[x.from] -= x.pay; bal[x.to] += x.pay; });
    var out = [];
    (ppeoks||[]).forEach(function(e){
      var pts = ppeokPoints(g, e.level); if (!pts || play.indexOf(e.idx)<0) return;
      var each = pts * g.ppp;
      payers.filter(function(i){ return i!==e.idx; }).forEach(function(i){
        var pay = Math.min(each, Math.max(0, bal[i])); bal[i] -= pay; bal[e.idx] += pay;
        out.push({from:i, to:e.idx, level:Math.floor(+e.level), points:pts, each:each, pay:pay, capped: pay<each});
      });
    });
    return out;
  }
  function ppeokNote(g, res){
    var by = {}, ord = [];
    (res.ppeok||[]).forEach(function(x){ if (!by[x.to]){ by[x.to]=[]; ord.push(x.to); } by[x.to].push(x); });
    return ord.map(function(to){
      var xs = by[to], x0 = xs[0], cap = xs.filter(function(x){ return x.capped; });
      return ' / '+g.players[to].name+' '+PPEOK_NAMES[x0.level]+' +각 '+won(x0.each)+'씩'+(cap.length?' ('+cap.map(function(x){ return g.players[x.from].name+' 잔액 부족 '+won(x.pay); }).join(', ')+')':'');
    }).join('');
  }
  function giveupInfo(g){ var m = g.giveupMult===4 ? 4 : 2; return [m, m===4 ? '총통 포기: 흔들기+폭탄' : '총통 포기: 폭탄']; }
  function calcRound(g, winner, opt){
    if (opt.chongtong) return chongtongRound(g, winner, opt);
    var gu = opt.giveup ? giveupInfo(g) : null;
    var gs = goScore(opt.score, opt.go||0);

  function applyRound(g, res, note){

  // 충전: 충전 내역(chg)에 시각·사람·금액·충전 후 잔액을 남긴다

  }
  // 충전 취소: 그 충전분이 아직 잔액에 남아 있을 때만 (판에서 쓴 칩은 취소 불가)

  }
  // ===== 벌금: 욕·영어 1회당, 누른 사람이 나머지(잔액 있는 사람 전원) 각자에게 벌금 금액씩. 판 정산과 별개로 즉시 처리 =====
  // 예전 저장분의 욕(swear)·영어(eng) 기록도 그대로 읽고, 모두 '벌금'으로 표시·합산
  var FINE_KINDS = {fine:'벌금', swear:'벌금', eng:'벌금'};
  function fineKind(k){ return (k==='swear'||k==='eng') ? k : 'fine'; }
  function fineAmtOf(g){ return num(g.fineAmt)>0 ? num(g.fineAmt) : 1000; }

  function finePreview(g, i, kind){
    var each = fineAmtOf(g), bal = g.players[i].bal, to = [];
    g.players.forEach(function(p,j){ if (j===i || p.bal<=0) return; var pay = Math.min(each, Math.max(0, bal)); bal -= pay; to.push({i:j, pay:pay, capped: pay<each}); });

  }
  function fineText(g, f){

    var cap = f.to.filter(function(x){ return x.pay < f.each; });
    return (p?p.name:'?')+' 벌금 -'+won(f.total)+' ('+f.to.map(function(x){ return nm(x.i); }).join('·')+' +각 '+won(f.each)+(cap.length?', 잔액 부족: '+cap.map(function(x){ return nm(x.i)+' '+won(x.pay)+'만'; }).join(', '):'')+')';

  // 취소: 받은 사람들이 받은 만큼 아직 잔액에 가지고 있을 때만 (정확히 되돌림)

  // 그 사람의 이번 판 가장 최근 벌금 (- 버튼으로 취소할 대상). 지난 판 벌금은 - 로 취소 안 됨(벌금 내역에서 확인)

  }
  // ===== 멍청이: 카드 + 한 번마다 누른 사람(멍청이)이 잔액 있는 다른 사람 전원(죽음·광팔이·선 상관없이) 각자에게 멍청이 금액(기본 5,000원)을 즉시 줌 =====
  // 멍청이 잔액이 모자라면 벌금과 같은 방식: 사람 순서대로 남은 잔액만큼만. - 는 그 사람의 가장 최근 1건을 정확히 되돌림(받은 사람이 이미 썼으면 막힘). 판 반영 때 다시 계산 안 함

    return nm(r.i)+' 멍청이 -'+won(r.total)+' ('+(r.to.length?r.to.map(function(x){ return nm(x.i); }).join('·')+' 각 +'+won(r.each):'받을 사람 없음')+(cap.length?', 잔액 부족: '+cap.map(function(x){ return nm(x.i)+' '+won(x.pay)+'만'; }).join(', '):'')+')';

  // ===== 카드 뻑 즉시 정산: + 누르는 즉시 뻑 먹은 사람이 나머지 각자에게서 (뻑 점수 x 그 시점 점당 금액)을 받음 =====
  // g.pks: 정산된 뻑 기록, g.pkPick[i]: 카드 단계, g.pkRec[i]: 지금 단계의 정산 기록 id (판 반영 후 둘 다 풀리고 돈은 그대로)

      dead: Object.keys(dp).map(Number).filter(function(j){ return dp[j] && j!==i; }), gp: (g.gpPick!==undefined && g.gpPick!==null) ? g.gpPick : -1};

  function pkCanUndo(g, rec){ return !!rec && g.players[rec.i] && g.players[rec.i].bal >= rec.total; }
  function pkText(g, r){
    var nm = function(j){ return g.players[j] ? g.players[j].name : '?'; }, cap = r.to.filter(function(x){ return x.pay < r.each; });
    return nm(r.i)+' '+PPEOK_NAMES[r.level]+' +각 '+won(r.each)+'씩 ('+(r.to.length?r.to.map(function(x){ return nm(x.i); }).join('·'):'받을 사람 없음')+(r.dead&&r.dead.length?', 죽음 '+r.dead.map(nm).join('·')+' 제외':'')+', '+r.points+'점 x '+won(r.ppp)+(cap.length?', 잔액 부족: '+cap.map(function(x){ return nm(x.i)+' '+won(x.pay)+'만'; }).join(', '):'')+')';
  }
  // 뻑 미리 체크(돈 이동 없음): 카드·판 끝 화면 어디서든 그 판 뻑 단계를 g.pkPick에 기록 → 판 반영 때 한 번만 정산

 '<p><b>무효(나가리·쇼당)</b>: 돈이 오가지 않고, 다음 판 점수가 2배가 돼요 (끌 수 있음).</p>'+
 '<p><b>선과 광팔이</b>: 판마다 선만 고르면 순서(두 번째, 세 번째, 마지막)는 사람 목록 순서대로 정해져요. 4명이면 "광팔이 있음"이 기본으로 체크돼 있고, 마지막 주자가 광팔이로 쉬어요(두 번째·세 번째는 진행). 체크를 끄면 두 번째·세 번째 중 죽은 사람을 체크해 주세요. 설정에서 광팔이 규칙을 끌 수 있어요.</p>'+
 '<p><b>죽음(포기)</b>: 죽은 사람은 그 판 점수 정산에서 빠지고(내지도 받지도 않음) 광값·뻑 값도 내지 않아요. 광팔이와 죽은 사람은 함께 있을 수 있어요(4명이면 광팔이 1명 + 죽음 1명 → 2명이 침). 카드나 판 끝 화면에서 "죽음"을 체크해요. 이미 정산된 광값이 있을 때 죽음 체크가 바뀌면 자동으로 다시 계산해요(죽은 사람 몫은 돌려주고 남은 사람끼리 다시, 기록에 "재정산"). 판 반영 때 정산된 뻑은 "뻑 내역"에서 죽은 사람을 고르면 그 사람 몫을 돌려줘요.</p>'+
 '<p><b>광값</b>: 카드의 광팔이 +를 누를 때마다(광이나 쌍피 1개) 그 사람이 광팔이로 체크되고, 광팔이 본인과 선을 뺀 나머지(2·3번째 주자) 각자에게서 '+W(gp)+'씩 바로 받아요. 예: 4명이면 2명에게서 각 '+W(gp)+', 광팔이는 +'+W(gp*2)+'. 죽은 사람은 내지 않아요. 선은 판 끝 화면에서 고른 선, 없으면 직전 판 승리자예요(카드에 "선" 표시). 선을 바꾸면 이미 받은 광값을 자동으로 다시 계산해요(기록에 "재정산"). -는 가장 최근 1개를 정확히 환불해요(받은 돈을 이미 썼으면 막혀요). 판 끝 화면의 광값 +/-도 같은 정산이고, 판 반영 때 다시 계산하지 않아요.</p>'+
 '<p><b>충전</b>: 기본은 모두 0원으로 시작해요. 각자 카드의 +1만원, +5만원, +10만원 버튼 중 하나를 누르면 그 금액이 바로 들어가고 충전 내역에 금액별로 남아요. 잘못 눌렀으면 "방금 충전 취소"나 충전 내역의 취소 버튼으로 되돌려요(판에서 이미 쓴 칩은 취소 불가). 충전한 돈은 모두 딜러 계좌(장부)에 모여요.</p>'+
 '<p><b>멍청이</b>: 카드의 멍청이 +를 누를 때마다 그 사람(멍청이)이 잔액 있는 다른 사람 전원(죽음·광팔이·선 상관없이) 각자에게 '+W(L.foolAmtOf(g||{}))+'씩 바로 줘요(설정에서 금액 변경). 예: 4명이면 멍청이 -'+W(L.foolAmtOf(g||{})*3)+', 나머지 3명 각 +'+W(L.foolAmtOf(g||{}))+'. 멍청이 잔액이 모자라면 벌금처럼 있는 만큼만 내요. -는 그 사람의 가장 최근 1건을 정확히 되돌려요(받은 사람이 이미 썼으면 막혀요). 판 반영 때 다시 계산하지 않고, 기록 보기와 보기용 링크에 "몇 판"으로 남아요. 다음 판이 되면(판 반영·무효) 카드 횟수는 0으로 돌아가고, 지난 판 멍청이는 -로 취소할 수 없어요.</p>'+
 '<p><b>판마다 초기화</b>: 카드의 벌금·뻑·광팔이·멍청이 횟수와 죽음(쉼) 체크는 판을 반영하거나 무효로 해서 다음 판이 되면 0(해제)으로 돌아가요. 이미 오간 돈은 그대로고, 지난 판 것은 -로 취소할 수 없어요. 기록 보기·벌금 내역·뻑 내역에서 "몇 판"으로 확인하고, 내역 화면의 수정(벌금 건별 취소, 뻑 낸 사람 수정)은 그대로 할 수 있어요.</p>'+
 '<p><b>벌금</b>: 카드의 벌금 +를 누르면 바로 반영되고, -를 누르면 그 사람의 이번 판 가장 최근 벌금 1건이 취소돼요. 누른 사람이 잔액 있는 나머지 사람 각자에게 '+W(L.fineAmtOf(g||{}))+'씩 줘요 (4명 모두 잔액 있으면 -'+W(L.fineAmtOf(g||{})*3)+', 나머지는 각 +'+W(L.fineAmtOf(g||{}))+'). 판 정산과 따로예요. 잔액이 모자라면 경고를 띄우고 가진 만큼만 내요(뻑과 같은 방식). 벌금 내역에서 건별 취소, 방금 낸 건 "방금 벌금 취소". 금액은 설정에서 바꿔요. 예전에 욕·영어로 기록된 건도 벌금 횟수에 합쳐 보여요.</p>'+
 '<p><b>승리자 표시</b>: 판을 반영하면 이긴 사람 카드에 "👑 승"이 붙고, 다음 판 시작 화면에서 그 사람이 선으로 미리 골라져 있어요(바꿀 수 있어요). 무효(나가리)면 표시와 선이 그대로예요.</p>'+
 '<p><b>뻑 입력</b>: 뻑은 카드에서 정산하지 않아요. 판 끝 → 점수 화면의 "뻑" 칸에서 뻑 먹은 사람의 +를 눌러 첫뻑/2연뻑/3연뻑을 고르면, 판 반영 때 한 번만 정산해요. 낼 사람은 판 끝에 확정된 대로(죽은 사람 제외, 광팔이는 설정 따름). 예전 버전에서 카드로 이미 정산한 뻑은 그대로 두고 다시 계산하지 않아요(점수 화면에서 "되돌리고 여기서 입력" 가능).</p>'+
 '<p><b>광팔이 = 쉬는 사람</b>: 광팔이는 그 판에 치지 않는 사람이라 죽음(쉼)과 같이 취급해요. 카드에서 광팔이 +를 누르면 그 사람이 자동으로 "죽음(쉼)" 체크되고(광값을 모두 -로 되돌리면 자동으로 풀림), 판 끝 화면에도 그대로 채워져요. 카드에서 누군가 죽음(쉼)을 체크하면 "광팔이 있음(마지막 주자 자동 쉼)"은 자동으로 꺼지고 체크한 사람만 쉬어요. 쉬는 사람은 뻑 값·광값을 내지 않아요.</p>'+
 '<p><b>잔액 한도</b>: 자기 잔액보다 많이 낼 수 없어요. 광값은 점수 정산을 하고 남은 잔액 안에서 내요. 잔액이 0원인 사람은 쉬는 중이라 판에 참여할 수 없고, 본인이 충전을 누르면 바로 다시 참여해요.</p>'+
 '<p><b>점수</b>: 고 보너스 빼고 난 점수를 넣어 주세요 (3명이 칠 때 3점부터 남).</p>'+
 SHAREHELP+'</details>';
}

function render(){
  if (RO) return renderRO();
  var m=$('mult');
  if (g && g.nextMult>1){ m.textContent='다음 판 x'+g.nextMult; m.classList.remove('hide'); } else m.classList.add('hide');
  if (!g) return renderSetup();
  ({share:renderShare, main:renderMain, s1:renderS1, s2:renderS2, s3:renderS3, log:renderLog, chg:renderChg, fine:renderFine, pk:renderPk, end:renderEnd, set:renderSet, void:renderVoid})[view]();
  save();
}

function renderSetup(){
  var n = st.n||4, h='<div class="box"><h2>새 게임</h2><p>몇 명이 하나요?</p><div class="row">';
  for (var k=2;k<=6;k++) h+='<button class="pick small '+(k===n?'on':'')+'" onclick="st.n='+k+';render()">'+k+'명</button>';
  h+='</div>';
  for (var i=0;i<n;i++) h+='<input type="text" id="nm'+i+'" placeholder="'+(i+1)+'번 이름 (예: '+['철수','영희','민수','지영','현우','수진'][i]+')" value="'+esc((st.names||[])[i]||'')+'" style="margin-top:8px" oninput="(st.names=st.names||[])['+i+']=this.value">';
  h+='<p class="note">모두 0원으로 시작해요. 시작 후 각자 카드의 +1만원·+5만원·+10만원 버튼으로 충전해요.</p>';
  h+='<p>1점당 금액 (원)</p><input type="number" id="ppp" value="'+(st.ppp||100)+'" oninput="st.ppp=+this.value">';
  h+='<button class="b1" onclick="start()">게임 시작</button></div>'+RULES();
  app.innerHTML=h;
}
function start(){
  var n=st.n||4, names=[];
  for (var i=0;i<n;i++){ var v=$('nm'+i).value.trim()||((i+1)+'번'); names.push(v); }
  var ppp=+$('ppp').value;
  if (!(ppp>0)) return alert('금액을 확인해 주세요');
  g=L.newGame(names, 100000, ppp); prev=null; view='main'; st={}; render();
}

function orderNote(){
  var act=actList().length, n=g.players.length;
  if (act<2) return '<p class="note">잔액 있는 사람이 2명 이상이어야 판을 시작할 수 있어요. 각자 카드의 +1만원·+5만원·+10만원 버튼으로 충전해 주세요.</p>';
  if (g.gwangpal!==false && n>=4 && act<4) return '<p class="note">지금 잔액 있는 사람은 '+act+'명이에요. 0원인 사람은 이번 판에 못 껴요. 4명 모두 충전하면 광팔이 체크가 나와요.</p>';
  return '';
}
function renderMain(){
  var lc=L.lastCharge(g), flash='', lf=L.lastFine(g), fc=L.fineCounts(g,true);
  if (st.pkMsg){ flash+='<div class="flash pkflash" style="background:#1d3f8a">'+esc(st.pkMsg)+(st.pkWarn?'<br><span style="color:#ffd166">'+esc(st.pkWarn)+'</span>':'')+'</div>'; }
  if (lf && st.fineFlash===lf.id){
    flash='<div class="flash" style="background:#7a2e2e">'+esc(L.fineText(g,lf))+(st.fineWarn?'<br><span style="color:#ffd166">'+esc(st.fineWarn)+'</span>':'')+
      (L.canUndoFine(g,lf.id)?'<button class="b3 small" onclick="cancelFine('+lf.id+')">방금 벌금 취소</button>':'')+'</div>';
  }
  if (lc && st.flash===lc.id){
    flash='<div class="flash">'+esc(g.players[lc.i].name)+' +'+W(lc.amt)+' 충전 완료 (잔액 '+W(g.players[lc.i].bal)+')'+
      (L.canUndoCharge(g,lc.id)?'<button class="b3 small" onclick="cancelCharge('+lc.id+')">방금 충전 취소</button>':'')+'</div>';
  }
  var h=flash+'<div class="pool"><div class="lab">모인 돈 (딜러 계좌 총액)</div><div class="val">'+W(L.pool(g))+'</div><div class="lab">점당 '+W(g.ppp)+'</div></div><div class="grid">';
  g.players.forEach(function(p,i){
    var out=p.bal<=0;
    h+='<div class="card '+(out?'out':'')+(g.gpPick===i&&!out?' gpon':'')+((g.deadPick||{})[i]&&!out?' deadon':'')+'"><div class="nm">'+(L.lastWinner(g)===i?'<span class="winb">👑 승</span> ':'')+(!out&&L.curSeon(g)===i?'<span class="seonb">선</span> ':'')+esc(p.name)+'</div><div class="bal">'+W(p.bal)+'</div>'+
      '<div class="sub">넣은 돈 '+W(p.invested)+' ('+p.charges+'회)</div>'+
      (out?'<div class="tag">쉬는 중 (충전하면 참여)</div>':'')+
      '<div class="chgrow3">'+L.CHARGE_AMTS.map(function(a){ return '<button class="b2 chg" data-amt="'+a+'" onclick="doCharge('+i+','+a+')">+'+(a/10000)+'만원</button>'; }).join('')+'</div>'+
      '<div class="finerow"><span class="flab">벌금</span><button class="fine fminus" onclick="fineMinus('+i+')">-</button><span class="fn">'+fc[i].n+'</span><button class="fine fplus" onclick="doFine('+i+')">+</button></div>'+
      // 뻑은 카드에서 정산하지 않음(판 끝 점수 화면에서만 입력, 판 반영 때 한 번 정산). 예전 버전에서 카드로 넣어 둔 뻑만 표시
      (out?'':'<div class="finerow pkcard"><span class="flab" style="color:#1d3f8a">뻑</span><button class="pkb pkminus" onclick="pkMarkUI('+i+',-1)">-</button><span class="pkl">'+pkLabel(i)+'</span><button class="pkb pkplus" onclick="pkMarkUI('+i+',1)">+</button></div>')+
      '<div class="finerow foolcard"><span class="flab" style="color:#6a1b9a">멍청이</span><button class="foolb foolminus" onclick="foolStepUI('+i+',-1)">-</button><span class="fn foolon">'+L.foolCount(g,i)+'</span><button class="foolb foolplus" onclick="foolStepUI('+i+',1)">+</button></div>'+
      '<div class="finerow gwcard"><span class="flab" style="color:#8a5a00">광팔이</span><button class="gwb gwminus" onclick="gwStepUI('+i+',-1)">-</button><span class="fn gwn">'+L.gwCount(g,i)+'</span><button class="gwb gwplus" onclick="gwStepUI('+i+',1)">+</button></div>'+
      (out?'':'<div class="gpcard"><label><input type="checkbox" class="deadcardck" '+((g.deadPick||{})[i]?'checked':'')+(L.deadOk(g)?'':' disabled title="광팔이가 있으면 나머지는 모두 진행"')+' onchange="toggleDeadCard('+i+')">죽음(쉼)'+(g.gpPick===i?' · 광팔이':'')+'</label></div>')+fineCnt(fc[i])+'</div>';
  });
  h+='</div>'+orderNote()+'<button class="b1 big" onclick="toS1()">판 끝! 점수 넣기</button>'+
   '<div class="row"><button class="b3 small" onclick="doVoid()">무효 (나가리·쇼당)</button><button class="b3 small" onclick="undo()">방금 것 되돌리기</button></div>'+
   '<div class="row"><button class="b3 small" onclick="view=\'fine\';render()">벌금 내역</button><button class="b3 small" onclick="view=\'pk\';st={};render()">뻑 내역</button></div>'+
   '<div class="row"><button class="b3 small" onclick="view=\'chg\';render()">충전 내역</button><button class="b3 small" onclick="view=\'log\';render()">기록 보기</button><button class="b3 small" onclick="view=\'set\';render()">설정</button></div>'+
   '<button class="b2" onclick="view=\'share\';render()">보기용 링크 만들기 (참가자 공유)</button>'+
   '<button class="b4" onclick="view=\'end\';render()">끝내고 정산하기</button>'+RULES();
  app.innerHTML=h;
}
function fineCnt(c){ return '<div class="fcnt">벌금 '+c.n+'회'+(c.paid||c.got?'<br>낸 벌금 '+(c.paid?'-':'')+W(c.paid)+' / 받은 벌금 '+(c.got?'+':'')+W(c.got):'')+'</div>'; }
// 벌금: 누르면 바로 반영. 누른 사람이 잔액 있는 나머지 전원에게 벌금 금액씩. 잔액 한도는 뻑 정산과 같은 방식
// 카드의 광팔이 체크: 한 번에 한 명, 다시 누르면 해제. 판 끝 화면의 선·광팔이 설정과 같은 상태(g.gpPick)
// 카드 광팔이 +/-: + 한 번 = 광·쌍피 1개, 그 자리에서 죽은 사람 뺀 나머지 각자에게서 광값 받음. - 는 가장 최근 1개 정확히 환불
function gwStepUI(i,d){
  var tmp=JSON.stringify(g), r=L.gwStep(g,i,d);
  if (!r.ok){ if (r.msg) alert(r.msg); return; }
  prev=tmp;
  var warn = r.capped ? '잔액 부족: '+r.rec.to.filter(function(x){ return x.pay<r.rec.each; }).map(function(x){ return g.players[x.i].name+' 님은 '+W(x.pay)+'만 냈어요'; }).join(', ') : '';
  var dn=r.cleared&&r.cleared.length ? deadNote(r) : '';
  st={pkMsg:g.log.slice(0, d<0 ? 1+((r.resettled||[]).length) : 1).reverse().map(function(e){ return e.txt; }).join(' / '), pkWarn:[dn,warn].filter(Boolean).join(' / ')}; render();
  if (dn||warn) alert([dn,warn].filter(Boolean).join('\n'));
}
function foolStepUI(i,d){
  var tmp=JSON.stringify(g), r=L.foolStep(g,i,d);
  if (!r.ok){ if (r.msg) alert(r.msg); return; }
  prev=tmp;
  var warn = r.capped ? '잔액 부족: '+r.rec.to.filter(function(x){ return x.pay<r.rec.each; }).map(function(x){ return g.players[x.i].name+' 님은 '+W(x.pay)+'만 냈어요'; }).join(', ') : '';
  st={pkMsg:g.log[0]?g.log[0].txt:'', pkWarn:warn}; render(); if (warn) alert(warn);
}
function gwBusy(){ return L.gwCurRecs(g).length>0; }
// 카드 죽음 체크: 판 끝 화면의 죽은 사람 체크와 같은 상태(g.deadPick). 광값·뻑 낼 사람에서 빠짐
// 이미 즉시 정산된 뻑·광값이 있으면 죽음 체크를 바꾸는 순간 자동 재정산(죽은 사람 몫 환불·재분배)
function toggleDeadCard(i){
  var on=!(g.deadPick||{})[i], tmp=JSON.stringify(g), r=L.setDead(g,i,on);
  if (!r.ok){ if (r.msg) alert(r.msg); if (view==='s1') seatApply(); return render(); }
  prev=tmp;
  var note=r.resettled.length ? '자동 재정산: '+r.resettled.join(' / ') : '';
  if (view==='s1'){ seatApply(); render(); if (note) alert(note); return; }
  st={pkMsg:note}; render(); if (note) alert(note);
}

function checkS1(){
  var rp=L.roundPlayers(g, st.rest, st.dead);
  if (st.conflict==='seon'){ alert('선은 광팔이가 될 수 없어요. 선을 바꾸거나 광팔이 체크를 풀어 주세요'); return null; }
  if (!rp.ok){ alert(rp.play.length>3 ? '치는 사람은 3명까지예요. 광팔이나 안 치는 사람을 골라 주세요' : '치는 사람이 2명 이상이어야 해요'); return null; }
  if (st.w===undefined || rp.play.indexOf(st.w)<0){ alert('이긴 사람을 골라 주세요'); return null; }
  var losers=rp.play.filter(function(i){return i!==st.w;});
  if (!losers.length){ alert('진 사람이 없어요'); return null; }
  return losers;
}
function toCT(){
  var losers=checkS1(); if(!losers) return;
  st.ct=true; st.lo={}; losers.forEach(function(i){ st.lo[i]={}; });
  view='s3'; render();
}
function toS2(){
  var losers=checkS1(); if(!losers) return;
  st.ct=false;
  st.score=st.score||3; st.go=st.go||0; st.shake=st.shake||0; st.bomb=st.bomb||0; st.giveup=!!st.giveup; st.lo={};
  losers.forEach(function(i){ st.lo[i]={pi:false,gwang:false,meong:false,gobak:false}; });
  view='s2'; render();
}
function stepper(key,label,min){
  return '<p><b>'+label+'</b></p><div class="stepper"><button class="b3" onclick="st.'+key+'=Math.max('+min+',st.'+key+'-1);render()">-</button><span>'+st[key]+'</span><button class="b3" onclick="st.'+key+'++;render()">+</button></div>';
}
// 뻑: 친 사람마다 없음/첫뻑/2연뻑/3연뻑 중 하나. 승패와 상관없이 따로 정산
function pkWho(){ return [st.w].concat(Object.keys(st.lo||{}).map(Number)); }
// 예전 버전에서 체크만 해 두고 아직 정산 안 된 뻑(정산 기록 없음)만 판 끝에 정산
function legacyPk(){ var pk=g.pkPick||{}, rc=g.pkRec||{}; return pkWho().filter(function(i){ return pk[i] && !L.pkFind(g, rc[i]); }); }
// 뻑 미리 체크: 카드와 판 끝 점수 화면이 같은 상태(g.pkPick)를 씀. 체크만 하고 돈은 판 반영 때 한 번만 정산
// 낼 사람은 판 끝 확정값 기준(죽은 사람 제외, 광팔이는 설정 따름). 예전 방식으로 이미 정산된 뻑(g.pkRec)은 다시 계산 안 함
function pkMarkUI(i,d){
  var keep=st, r=L.pkMark(g,i,d);

  if (view==='main') st={pkMsg:g.players[i].name+' 뻑: '+(r.level?L.PPEOK_NAMES[r.level]:'없음')+' (체크만, 판 반영 때 정산)'}; else st=keep;
  render();
}
function ppeokBox(){

  who.forEach(function(i){ var old=done.indexOf(i)>=0, lv=pk[i]||0;
    h+='<div class="finerow pk2row" data-i="'+i+'"><span class="flab" style="min-width:4em">'+esc(g.players[i].name)+'</span>'+(old?'<span class="pkl pk2l">'+L.PPEOK_NAMES[lv]+' (이미 정산)</span>':'<button class="pkb pk2minus" onclick="pkMarkUI('+i+',-1)">-</button><span class="pkl pk2l">'+(lv?L.PPEOK_NAMES[lv]:'없음')+'</span><button class="pkb pk2plus" onclick="pkMarkUI('+i+',1)">+</button>')+'</div>'; });
  Object.keys(pk).map(Number).filter(function(i){ return pk[i] && who.indexOf(i)<0 && done.indexOf(i)<0; }).forEach(function(i){ h+='<p class="warn">'+esc(g.players[i].name)+' 님은 이번 판에 치지 않아서(광팔이·죽음) 뻑 체크가 정산되지 않아요</p>'; });
  done.forEach(function(i){ var r=L.pkFind(g, rc[i]); h+='<div class="calc pkdone">예전 방식(카드)으로 이미 정산: '+esc(L.pkText(g, r))+' · 죽은 사람은 "뻑 내역"에서 고쳐요</div>'; });

function toS3(){

function applyIt(){

  app.innerHTML=h;
}
function saveSet(){ var p=+$('sp').value, c=+$('sct').value; if(!(p>0)) return alert('금액을 확인해 주세요'); if(!(c>0)) return alert('총통 점수를 확인해 주세요'); var gp=+$('sgp').value; if(!(gp>0)) return alert('광값 금액을 확인해 주세요'); var pks=+$('spk').value, pkm=+$('spm').value; if(!(pks>0)||!(pkm>0)) return alert('뻑 점수·배수를 확인해 주세요'); var fa=+$('sfa').value; if(!(fa>0)) return alert('벌금 금액을 확인해 주세요'); var fo=+$('sfo').value; if(!(fo>0)) return alert('멍청이 금액을 확인해 주세요'); snap(); g.fineAmt=fa; g.foolAmt=fo; g.ppeokScore=pks; g.ppeokMult=pkm; g.gwangPrice=gp; g.ppp=p; g.ctScore=c; g.giveupMult=+$('sgu').value===4?4:2; g.gwangpal=$('sg').checked; view='main'; render(); }
function resetAll(){ if(!confirm('모든 기록을 지우고 새로 시작할까요?')) return; if(!confirm('정말 지울까요? 되돌릴 수 없어요')) return; g=null; prev=null; localStorage.removeItem(KEY); view='main'; render(); }

function renderEnd(){
  var s=L.settle(g), h='<div class="box"><h2>정산</h2>';
  s.rows.forEach(function(r){
    h+='<div class="calc"><b>'+esc(r.name)+'</b><br>넣은 돈 '+W(r.invested)+' · 남은 칩 '+W(r.bal)+'<br>손익 <b style="color:'+(r.net>=0?'#2a9d8f':'#c00')+'">'+(r.net>0?'+':'')+W(r.net)+'</b></div>';
  });
  h+='<p style="font-size:16px">손익 합계: '+W(s.sumNet)+(s.sumNet===0?' (맞음)':' (확인 필요)')+'</p></div>';
  h+='<div class="box"><h2>누가 누구에게 보내나요</h2>';
  if(!s.transfers.length) h+='<p>보낼 돈이 없어요</p>';
  s.transfers.forEach(function(t){ h+='<div class="calc big" style="font-size:22px">'+esc(g.players[t.from].name)+' → '+esc(g.players[t.to].name)+' <b>'+W(t.amt)+'</b></div>'; });
  h+='<p style="font-size:16px;color:#555">딜러 계좌에 돈을 모아 뒀다면, 위 대신 딜러가 각자에게 남은 칩만큼 돌려주면 돼요.</p></div>';
  h+='<button class="b3" onclick="view=\'main\';render()">게임으로 돌아가기</button>';
  app.innerHTML=h;
}

// ===== 보기용 링크 (편집 모드에서 생성) =====
var shareUrl='';
function renderShare(){
  app.innerHTML='<div class="box"><h2>보기용 링크</h2><p>만드는 중...</p></div>';
  L.encodeState(g).then(function(code){
    shareUrl=location.href.split('#')[0]+'#v='+code;
    if (view!=='share') return;
    var h='<div class="box"><h2>보기용 링크</h2><p>지금 상태(잔액, 충전·판 기록, 딜러 계좌 총액, 설정)가 담긴 읽기 전용 링크예요. 참가자는 보기만 할 수 있어요.</p>'+
      '<div class="linkbox" id="lnk">'+esc(shareUrl)+'</div>'+
      '<button class="b2" onclick="copyLink()">링크 복사</button>'+
      (navigator.share?'<button class="b4" onclick="shareLink()">공유하기 (카톡 등)</button>':'')+
      '<p id="cpmsg" style="font-size:17px;color:#2a9d8f"></p>'+
      '<p style="font-size:16px;color:#555">판이 끝날 때마다 새로 만들어서 다시 올려 주세요. 예전 링크는 그때 상태 그대로예요.</p>'+
      '<button class="b3" onclick="view=\'main\';render()">돌아가기</button></div>';
    app.innerHTML=h;
  }, function(){ app.innerHTML='<div class="box"><h2>보기용 링크</h2><p class="warn">링크를 만들지 못했어요</p><button class="b3" onclick="view=\'main\';render()">돌아가기</button></div>'; });
}
function copyLink(){
  function done(){ var m=$('cpmsg'); if(m) m.textContent='복사했어요. 단톡방에 붙여 넣으세요.'; }
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(shareUrl).then(done, fallback);
  fallback();
  function fallback(){ var t=document.createElement('textarea'); t.value=shareUrl; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); done(); }catch(e){ alert('복사가 안 되면 링크를 길게 눌러 복사해 주세요'); } document.body.removeChild(t); }
}
function shareLink(){ navigator.share({title:'고스톱 칩 현황 (보기 전용)', text:'고스톱 칩 현황 보기', url:shareUrl}).catch(function(){}); }

// ===== 보기 전용 모드 (해시 #v= 로 열었을 때). localStorage 읽기·쓰기 없음 =====
function fmtTime(t){ var d=new Date(t); if(!t||isNaN(d)) return '시각 모름'; function z(n){return (n<10?'0':'')+n;} return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+z(d.getHours())+':'+z(d.getMinutes()); }
function renderRO(){
  var bar=$('robar'); bar.textContent='보기 전용 (마지막 갱신 '+fmtTime(roT)+')'; bar.classList.remove('hide');
  var m=$('mult');
  if (g.nextMult>1){ m.textContent='다음 판 x'+g.nextMult; m.classList.remove('hide'); } else m.classList.add('hide');
  var h='<div class="pool"><div class="lab">모인 돈 (딜러 계좌 총액)</div><div class="val">'+W(L.pool(g))+'</div><div class="lab">점당 '+W(g.ppp)+' · '+g.round+'판 진행</div></div><div class="grid">';
  var fc=L.fineCounts(g,true);
  g.players.forEach(function(p,i){
    var out=p.bal<=0;
    h+='<div class="card '+(out?'out':'')+'"><div class="nm">'+(L.lastWinner(g)===i?'<span class="winb">👑 승</span> ':'')+esc(p.name)+'</div><div class="bal">'+W(p.bal)+'</div>'+
      '<div class="sub">넣은 돈 '+W(p.invested)+' ('+p.charges+'회)</div>'+(out?'<div class="tag">쉬는 중</div>':'')+fineCnt(fc[i])+'</div>';
  });
  h+='</div>';
  var s=L.settle(g);
  h+='<div class="box"><h2>지금 끝내면 정산</h2>';
  s.rows.forEach(function(r){ h+='<div class="calc"><b>'+esc(r.name)+'</b> 손익 <b style="color:'+(r.net>=0?'#2a9d8f':'#c00')+'">'+(r.net>0?'+':'')+W(r.net)+'</b><br><span style="font-size:16px">넣은 돈 '+W(r.invested)+' · 남은 칩 '+W(r.bal)+'</span></div>'; });
  if(!s.transfers.length) h+='<p>보낼 돈이 없어요</p>';
  s.transfers.forEach(function(t){ h+='<div class="calc" style="font-size:22px">'+esc(g.players[t.from].name)+' → '+esc(g.players[t.to].name)+' <b>'+W(t.amt)+'</b></div>'; });
  h+='</div>'+chgHtml(true)+fineHtml(true)+pkHtml(true)+'<div class="box"><h2>기록</h2>';
  if(!g.log.length) h+='<p>아직 기록이 없어요</p>';
  g.log.forEach(function(l){ h+='<div class="log">'+(l.t==='판'?'👑 ':'')+(l.r?l.r+'판 · ':'')+esc(l.txt)+'</div>'; });
  h+='</div><details><summary>보기 전용 안내 (눌러서 보기)</summary><p>이 화면은 진행자가 링크를 만든 순간의 상태예요. 입력은 진행자 폰에서만 하고, 참가자는 보기용 링크로 확인해요. 최신 상태는 진행자가 새로 올린 링크로 확인하세요.</p></details>'+RULES();
  app.innerHTML=h;
}
function roError(){
  var bar=$('robar'); bar.textContent='보기 전용'; bar.classList.remove('hide');
  app.innerHTML='<div class="box"><h2>링크를 열 수 없어요</h2><p>링크가 잘렸거나 잘못됐어요. 진행자에게 보기용 링크를 다시 받아 주세요.</p></div>';
}
function boot(){
  var hs=location.hash||'';
  if (hs.indexOf('#v=')===0){
    RO=true; document.body.classList.add('ro');
    app.innerHTML='<div class="box"><p>불러오는 중...</p></div>';
    L.decodeState(hs.slice(3)).then(function(d){ g=d.g; roT=d.t; render(); }, roError);
  } else { load(); render(); }
}
window.addEventListener('hashchange', function(){ location.reload(); });
boot();
</script>

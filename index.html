<html lang="ko">
<head>
<meta charset="utf-8">

<title>고스톱 칩 관리</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#13321f;color:#fff;font-size:20px}
header{padding:14px 16px;background:#0b2014;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:24px}
main{padding:12px;max-width:720px;margin:0 auto}
.pool{background:#f5c542;color:#222;border-radius:16px;padding:14px;text-align:center;margin-bottom:12px}
.pool .lab{font-size:18px}.pool .val{font-size:34px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;color:#111;border-radius:16px;padding:14px;text-align:center}
.card .nm{font-size:24px;font-weight:800}
.card .bal{font-size:32px;font-weight:900;margin:6px 0}
.card .sub{font-size:15px;color:#555}
.card.out{background:#ddd;color:#888}
.card.out .bal{color:#c00}
.tag{display:inline-block;background:#c00;color:#fff;border-radius:8px;padding:2px 8px;font-size:16px}
button{font-size:22px;font-weight:700;border:0;border-radius:14px;padding:16px;width:100%;margin-top:10px;cursor:pointer}
.b1{background:#e63946;color:#fff}.b2{background:#2a9d8f;color:#fff}.b3{background:#eee;color:#222}.b4{background:#457b9d;color:#fff}
.small{font-size:17px;padding:10px;margin-top:6px}
.row{display:flex;gap:8px}.row>*{flex:1}
.box{background:#fff;color:#111;border-radius:16px;padding:16px;margin-bottom:12px}
.box h2{margin:0 0 10px;font-size:24px}
input[type=text],input[type=number]{font-size:24px;padding:12px;width:100%;border:2px solid #aaa;border-radius:10px}
label.ck{display:flex;align-items:center;gap:10px;font-size:21px;padding:8px 0}
label.ck input{width:28px;height:28px}
.pick{background:#eee;color:#111}.pick.on{background:#e63946;color:#fff}
.calc{font-size:20px;padding:10px;border-bottom:1px solid #ddd;line-height:1.5}
.calc b{font-size:24px}
.warn{color:#c00;font-size:18px}
.log{font-size:17px;border-bottom:1px solid #ddd;padding:8px 0}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:64px;margin:0;padding:10px}.stepper span{font-size:26px;font-weight:800;min-width:40px;text-align:center}
details{background:#fff;color:#111;border-radius:16px;padding:14px;margin-bottom:12px;font-size:17px;line-height:1.6}
summary{font-size:21px;font-weight:700}
.hide{display:none}
.big{font-size:28px;font-weight:900}
.robar{background:#f5c542;color:#222;text-align:center;font-size:19px;font-weight:800;padding:10px}
.flash{background:#2a9d8f;color:#fff;border-radius:14px;padding:12px;margin-bottom:12px;font-size:19px;font-weight:700;text-align:center}
.note{background:#fff3cd;color:#5a4500;border-radius:12px;padding:10px 12px;font-size:17px;margin:10px 0}
.linkbox{font-size:15px;word-break:break-all;background:#f2f2f2;border-radius:10px;padding:10px;max-height:120px;overflow:auto}
</style>
</head>
<body>
<header><h1>고스톱 칩 관리</h1><span id="mult" class="tag hide"></span></header>
<div id="robar" class="robar hide"></div>
<main id="app"></main>

<script id="logic">
// ===== 순수 로직 (node 테스트 대상) =====
var L = (function(){
  function won(n){ n = Math.round(n); return (n<0?'-':'') + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '원'; }
  // limit = 충전 1회 금액, start = 1인 시작 금액 (생략하면 충전 1회 금액으로 시작, 화면에서는 기본 0원)
  function newGame(names, limit, ppp, start){
    var st0 = (start===undefined || start===null) ? limit : Math.max(0, +start||0);
    return { limit: limit, ppp: ppp, start: st0, nextMult: 1, round: 0, gwangpal: true, ctScore: 10, giveupMult: 2, gwangPrice: 5000, gwangPayer: 'noSeon',
      players: names.map(function(n){ return {name:n, bal:st0, charges:st0>0?1:0, invested:st0}; }),
      log: [], chg: [], chgSeq: 0 };
  }
  function active(g, i){ return g.players[i].bal > 0; }
  // 이번 판에 실제로 치는 사람: 잔액>0, 광팔이(rest)·죽은 사람(dead) 제외. 광팔이 규칙이 켜져 있으면 치는 사람은 2~3명
  function roundPlayers(g, rest, dead){
    rest = rest || {}; dead = dead || {};
    var act = g.players.map(function(p,i){return i;}).filter(function(i){ return g.players[i].bal>0; });
    if (g.gwangpal === false){ var pl = act.filter(function(i){ return !dead[i]; }); return {ok: pl.length>=2, play: pl, need: 0}; }
    var nDead = act.filter(function(i){ return dead[i] && !rest[i]; }).length;
    var need = Math.max(0, act.length-3-nDead);
    var play = act.filter(function(i){ return !rest[i] && !dead[i]; });
    return {ok: play.length>=2 && play.length<=3, play: play, need: need};
  }
  // 4명 순서 자동 판정: order=[선, 두 번째, 세 번째, 마지막], d2·d3 = 'go'(진행) 또는 'die'(포기)
  // 두 번째·세 번째가 모두 진행하면 마지막 주자가 광팔이, 한 명이라도 포기하면 마지막 주자는 참여
  function autoSeat(order, d2, d3){
    var rest = {}, dead = {};
    if (d2==='die') dead[order[1]] = true;
    if (d3==='die') dead[order[2]] = true;
    if (d2!=='die' && d3!=='die') rest[order[3]] = true;
    return {rest: rest, dead: dead, lastRests: d2!=='die' && d3!=='die'};
  }
  function gwangPriceOf(g){ return g.gwangPrice>0 ? g.gwangPrice : 5000; }
  // 광값 낼 사람: 'noSeon'(기본) = 선 제외, 두 번째·세 번째 주자만 / 'all' = 선 포함 치는 사람 모두. 죽은 사람은 항상 제외
  function gwangMode(g){ return g.gwangPayer==='all' ? 'all' : 'noSeon'; }
  function gwangPayerText(g){ return gwangMode(g)==='all' ? '선 포함 치는 사람 모두 (죽은 사람 제외)' : '선 제외, 두 번째·세 번째 주자만 (죽은 사람 제외)'; }
  // 광값: 광팔이가 든 광·쌍피 개수 x 개당 금액을 낼 사람 각각이 광팔이에게. 죽은 사람은 치는 사람이 아니라 항상 제외
  // 점수 정산 뒤 남는 잔액 안에서만 낸다 (잔액 한도)
  // seon: 선의 번호 (모르면 치는 사람 모두가 냄)
  function gwangCalc(g, res, gwangs, seon){
    var price = gwangPriceOf(g), noSeon = gwangMode(g)==='noSeon';
    var play = [res.winner].concat(res.lines.map(function(x){ return x.idx; }));
    var bal = {}; play.forEach(function(i){ bal[i] = g.players[i].bal; });
    res.lines.forEach(function(x){ bal[x.idx] -= x.pay; }); bal[res.winner] += res.total;
    var out = [];
    (gwangs||[]).forEach(function(r){
      var cnt = Math.max(0, Math.floor(+r.count||0)); if (!cnt) return;
      var each = cnt * price;
      play.filter(function(i){ return i!==r.idx && !(noSeon && i===seon); }).forEach(function(i){
        var pay = Math.min(each, Math.max(0, bal[i])); bal[i] -= pay;
        out.push({from:i, to:r.idx, count:cnt, price:price, each:each, pay:pay, capped: pay<each});
      });
    });
    return out;
  }
  function gwangFormula(g, x){ return '광값: '+x.count+'개 x '+won(x.price)+' = '+won(x.each)+'씩, '+g.players[x.from].name+' → '+g.players[x.to].name; }
  function roundNote(g, res, opt){
    var detail = res.lines.filter(function(x){return x.pay>0;}).map(function(x){return g.players[x.idx].name+' → '+g.players[res.winner].name+' '+won(x.pay);}).join(', ');
    var extra = (opt.deadNames&&opt.deadNames.length?' / 죽음 '+opt.deadNames.join(','):'');
    var gw = (res.gwang||[]).filter(function(x){return x.pay>0;});
    if (gw.length) extra += ' / 광값 '+gw[0].count+'개 x '+won(gw[0].price)+': '+gw.map(function(x){return g.players[x.from].name+' → '+g.players[x.to].name+' '+won(x.pay);}).join(', ');
    var rn = (opt.restNames&&opt.restNames.length?' / 광팔이 '+opt.restNames.join(','):'');
    if (res.chongtong) return g.players[res.winner].name+' 총통 승 ('+res.lines[0].score+'점)'+rn+' / '+detail+extra;
    return g.players[res.winner].name+' '+opt.score+'점 승'+(opt.giveup?' (총통 포기)':'')+(opt.go?' ('+opt.go+'고)':'')+rn+' / '+detail+extra;
  }
  // 고 점수: 1고 +1점, 2고 +2점 (점수에 먼저 더함), 3고부터 점수 그대로 x2, 4고 x4, 5고 x8 ...
  function goScore(base, go){
    if (go<=0) return {score:base, mul:1};
    if (go===1) return {score:base+1, mul:1};
    if (go===2) return {score:base+2, mul:1};
    return {score:base, mul:Math.pow(2, go-2)};
  }
  // opt: {score, go, shake(흔들기 횟수), bomb(폭탄 횟수), losers:[{idx, pi, gwang, meong, gobak}]}
  // 총통 승: 정해진 점수(기본 10점) x 점당 금액, 다른 배수 없음
  function chongtongRound(g, winner, opt){
    var sc = g.ctScore||10;
    var lines = opt.losers.map(function(l){
      var raw = sc * g.ppp;
      return { idx:l.idx, score:sc, mult:1, parts:[], formula: sc+'점 x '+won(g.ppp)+' = '+won(raw), raw: raw };
    });
    lines.forEach(function(x){ var bal = g.players[x.idx].bal; x.pay = Math.min(x.raw, Math.max(0, bal)); x.capped = x.pay < x.raw; });
    var res = { winner:winner, chongtong:true, lines:lines, total: lines.reduce(function(s,x){return s+x.pay;},0) };
    res.gwang = gwangCalc(g, res, opt.gwangs, opt.seon); return res;
  }
  // 총통 포기 진행 배수: 2배(폭탄) 또는 4배(흔들기+폭탄)
  function giveupInfo(g){ var m = g.giveupMult===4 ? 4 : 2; return [m, m===4 ? '총통 포기: 흔들기+폭탄' : '총통 포기: 폭탄']; }
  function calcRound(g, winner, opt){
    if (opt.chongtong) return chongtongRound(g, winner, opt);
    var gu = opt.giveup ? giveupInfo(g) : null;
    var gs = goScore(opt.score, opt.go||0);
    var common = gs.mul * Math.pow(2, (opt.shake||0) + (opt.bomb||0)) * (g.nextMult||1) * (gu ? gu[0] : 1);
    var lines = opt.losers.map(function(l){
      var m = common, f = [];
      if (gs.mul>1) f.push([gs.mul, opt.go+'고']);
      for (var k=0;k<(opt.shake||0);k++) f.push([2,'흔들기']);
      for (var k2=0;k2<(opt.bomb||0);k2++) f.push([2,'폭탄']);
      if (gu) f.push(gu);
      if ((g.nextMult||1)>1) f.push([g.nextMult,'지난 판 무효']);
      if (l.pi){ m*=2; f.push([2,'피박']); }
      if (l.gwang){ m*=2; f.push([2,'광박']); }
      if (l.meong){ m*=2; f.push([2,'멍박']); }
      var base = gs.score * g.ppp, raw = base * m;
      var sc = (opt.go===1||opt.go===2) ? gs.score+'점('+opt.score+'점+'+opt.go+'고)' : gs.score+'점';
      var formula = sc+' x '+won(g.ppp)+' = '+won(base) + (f.length ? f.map(function(x){return ', x'+x[0]+'('+x[1]+')';}).join('') + ' = '+won(raw) : '');
      return { idx:l.idx, score:gs.score, mult:m, parts:f.map(function(x){return x[1]+' x'+x[0];}), formula:formula, raw: raw };
    });
    // 고박: 고를 불렀다가 진 사람이 다른 패자 몫까지 모두 낸다
    var gb = opt.losers.filter(function(l){ return l.gobak; });
    if (gb.length===1){
      var total = lines.reduce(function(s,x){return s+x.raw;},0);
      lines.forEach(function(x){ x.gobakTo = gb[0].idx; x.raw = (x.idx===gb[0].idx) ? total : 0; });
    }
    lines.forEach(function(x){
      var bal = g.players[x.idx].bal;
      x.pay = Math.min(x.raw, Math.max(0, bal));
      x.capped = x.pay < x.raw;
    });
    var res = { winner:winner, lines:lines, total: lines.reduce(function(s,x){return s+x.pay;},0) };
    res.gwang = gwangCalc(g, res, opt.gwangs, opt.seon); return res;
  }
  function applyRound(g, res, note){
    res.lines.forEach(function(x){ g.players[x.idx].bal -= x.pay; });
    g.players[res.winner].bal += res.total;
    (res.gwang||[]).forEach(function(x){ g.players[x.from].bal -= x.pay; g.players[x.to].bal += x.pay; });
    g.round++; g.nextMult = 1;
    g.log.unshift({t:'판', r:g.round, txt: note || (g.players[res.winner].name+' 승, '+won(res.total)+' 받음')});
  }
  function voidRound(g, doubleNext){
    g.round++;
    if (doubleNext) g.nextMult = (g.nextMult||1)*2;
    g.log.unshift({t:'무효', r:g.round, txt:'무효(나가리·쇼당)'+(doubleNext?', 다음 판 x'+g.nextMult:'')});
  }
  // 충전: 충전 내역(chg)에 시각·사람·금액·충전 후 잔액을 남긴다
  function charge(g, i, now){
    var p = g.players[i], amt = g.limit; p.bal += amt; p.charges++; p.invested += amt;
    if (!g.chg) g.chg = [];
    g.chgSeq = Math.max(g.chgSeq||0, g.chg.reduce(function(m,c){ return Math.max(m, c.id); }, 0)) + 1;
    var rec = {id:g.chgSeq, t: now || Date.now(), i:i, amt:amt, after:p.bal};
    g.chg.push(rec);
    g.log.unshift({t:'충전', r:g.round, txt:p.name+' 충전 +'+won(amt)+' (충전 후 잔액 '+won(p.bal)+', '+p.charges+'번째)'});
    return rec;
  }
  // 충전 취소: 그 충전분이 아직 잔액에 남아 있을 때만 (판에서 쓴 칩은 취소 불가)
  function canUndoCharge(g, id){
    var c = (g.chg||[]).filter(function(x){ return x.id===id; })[0];
    return !!c && g.players[c.i] && g.players[c.i].bal >= c.amt;
  }
  function undoCharge(g, id){
    if (!canUndoCharge(g, id)) return false;
    var k = g.chg.map(function(x){ return x.id; }).indexOf(id), c = g.chg[k], p = g.players[c.i];
    p.bal -= c.amt; p.charges = Math.max(0, p.charges-1); p.invested -= c.amt; g.chg.splice(k, 1);
    g.log.unshift({t:'충전 취소', r:g.round, txt:p.name+' 충전 취소 -'+won(c.amt)+' (잔액 '+won(p.bal)+')'});
    return true;
  }
  function lastCharge(g){ var c = g.chg||[]; return c.length ? c[c.length-1] : null; }
  // 충전 요약: 사람별 시작 금액·누적 충전액·넣은 돈, 총 충전액, 딜러 장부 합계
  function chargeSummary(g){
    var rows = g.players.map(function(p,i){
      var ch = (g.chg||[]).filter(function(c){ return c.i===i; });
      var sum = ch.reduce(function(s,c){ return s+c.amt; }, 0);
      return {i:i, name:p.name, count:ch.length, charged:sum, start:p.invested-sum, invested:p.invested};
    });
    var total = rows.reduce(function(s,r){ return s+r.charged; }, 0);
    return {rows:rows, total:total, startTotal: rows.reduce(function(s,r){ return s+r.start; }, 0), pool: pool(g)};
  }
  function pool(g){ return g.players.reduce(function(s,p){return s+p.invested;},0); }
  // 정산: 순손익 = 현재 칩 - 투입금. 채권자/채무자 큰 순서 매칭(최대 n-1회 이체)
  function settle(g){
    var rows = g.players.map(function(p,i){ return {i:i, name:p.name, invested:p.invested, bal:p.bal, net:p.bal-p.invested}; });
    var cred = rows.filter(function(r){return r.net>0;}).map(function(r){return {i:r.i, v:r.net};});
    var debt = rows.filter(function(r){return r.net<0;}).map(function(r){return {i:r.i, v:-r.net};});
    var tr = [];
    // 금액이 정확히 같은 쌍 먼저 (이체 횟수 줄이기)
    debt.forEach(function(d){ var c = cred.find(function(c){return c.v===d.v && c.v>0;}); if (c && d.v>0){ tr.push({from:d.i,to:c.i,amt:d.v}); c.v=0; d.v=0; } });
    while (true){
      cred.sort(function(a,b){return b.v-a.v;}); debt.sort(function(a,b){return b.v-a.v;});
      if (!cred.length || !debt.length || cred[0].v<=0 || debt[0].v<=0) break;
      var a = Math.min(cred[0].v, debt[0].v);
      tr.push({from:debt[0].i, to:cred[0].i, amt:a}); cred[0].v-=a; debt[0].v-=a;
    }
    return {rows:rows, transfers:tr, sumNet: rows.reduce(function(s,r){return s+r.net;},0)};
  }
  // ===== 보기용 링크: 상태 -> 압축(deflate) -> base64url, 해시 #v=... =====
  function b64u(bytes){ var s=''; for (var i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null, Array.prototype.slice.call(bytes, i, i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function unb64u(str){ str=String(str).replace(/-/g,'+').replace(/_/g,'/'); while (str.length%4) str+='='; var s=atob(str), b=new Uint8Array(s.length); for (var i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b; }
  function pipeBytes(bytes, ts){ return new Response(new Blob([bytes]).stream().pipeThrough(ts)).arrayBuffer().then(function(ab){ return new Uint8Array(ab); }); }
  function packState(g, now){
    return { v:1, t: now || Date.now(), g: { limit:g.limit, ppp:g.ppp, nextMult:g.nextMult, round:g.round, gwangpal:g.gwangpal, ctScore:g.ctScore, giveupMult:g.giveupMult, gwangPrice:gwangPriceOf(g), gwangPayer:gwangMode(g),
      players: g.players.map(function(p){ return {name:p.name, bal:p.bal, charges:p.charges, invested:p.invested}; }),
      chg: (g.chg||[]).map(function(c){ return {id:c.id, t:c.t, i:c.i, amt:c.amt, after:c.after}; }),
      log: g.log.map(function(l){ return {t:l.t, r:l.r, txt:l.txt}; }) } };
  }
  function num(x){ x=+x; return isFinite(x) ? x : 0; }
  function cleanState(d){
    if (!d || d.v!==1 || !d.g || !Array.isArray(d.g.players) || !d.g.players.length) throw new Error('잘못된 링크');
    var s=d.g;
    return { t:num(d.t), g: { limit:num(s.limit), ppp:num(s.ppp), nextMult:num(s.nextMult)||1, round:num(s.round), gwangpal:s.gwangpal!==false, ctScore:num(s.ctScore)||10, giveupMult:s.giveupMult===4?4:2, gwangPrice:num(s.gwangPrice)>0?num(s.gwangPrice):5000, gwangPayer:s.gwangPayer==='all'?'all':'noSeon',
      players: s.players.map(function(p){ return {name:String(p&&p.name||''), bal:num(p&&p.bal), charges:num(p&&p.charges), invested:num(p&&p.invested)}; }),
      chg: (Array.isArray(s.chg)?s.chg:[]).map(function(c){ return {id:num(c&&c.id), t:num(c&&c.t), i:Math.floor(num(c&&c.i)), amt:num(c&&c.amt), after:num(c&&c.after)}; }).filter(function(c){ return c.i>=0 && c.i<s.players.length; }),
      log: (Array.isArray(s.log)?s.log:[]).map(function(l){ return {t:String(l&&l.t||''), r:num(l&&l.r), txt:String(l&&l.txt||'')}; }) } };
  }
  function encodeState(g, now){
    var bytes = new TextEncoder().encode(JSON.stringify(packState(g, now)));
    if (typeof CompressionStream === 'undefined') return Promise.resolve('b'+b64u(bytes));
    return pipeBytes(bytes, new CompressionStream('deflate')).then(function(c){ return 'z'+b64u(c); }, function(){ return 'b'+b64u(bytes); });
  }
  function decodeState(code){
    return Promise.resolve().then(function(){
      code=String(code||''); var kind=code.charAt(0), bytes=unb64u(code.slice(1));
      if (kind==='z') return pipeBytes(bytes, new DecompressionStream('deflate'));
      if (kind==='b') return bytes;
      throw new Error('잘못된 링크');
    }).then(function(b){ return cleanState(JSON.parse(new TextDecoder().decode(b))); });
  }
  return {encodeState:encodeState,decodeState:decodeState,packState:packState,won:won,roundPlayers:roundPlayers,autoSeat:autoSeat,gwangCalc:gwangCalc,gwangFormula:gwangFormula,gwangPriceOf:gwangPriceOf,gwangPayerText:gwangPayerText,gwangMode:gwangMode,giveupInfo:giveupInfo,roundNote:roundNote,newGame:newGame,active:active,goScore:goScore,calcRound:calcRound,applyRound:applyRound,voidRound:voidRound,charge:charge,canUndoCharge:canUndoCharge,undoCharge:undoCharge,lastCharge:lastCharge,chargeSummary:chargeSummary,pool:pool,settle:settle};
})();
if (typeof module!=='undefined') module.exports = L;
</script>

<script>
// ===== 화면 =====

 '<p><b>고</b>: 1고는 +1점, 2고는 +2점을 점수에 먼저 더해요. 3고부터는 점수 그대로 2배씩 (3고 x2, 4고 x4, 5고 x8).</p>'+

 '<p><b>피박·광박·멍박</b>: 해당되는 진 사람만 각각 2배. 3명 이상이어도 박은 그 사람에게만 적용해요.</p>'+
 '<p><b>고박</b>: 고를 불렀다가 다른 사람이 이기면, 고 부른 사람이 다른 진 사람 몫까지 혼자 다 내요.</p>'+
 '<p><b>총통 승</b>: 처음 받은 손패에 같은 월 4장이 있으면 바로 이겨요. 승자만 고르면 정해진 점수(기본 10점, 설정에서 변경) x 점당 금액을 진 사람 전원이 내요. 고·흔들기·폭탄·박·지난 판 무효 배수는 적용하지 않아요. 광팔이·죽음·광값 규칙은 똑같아요.</p>'+
 '<p><b>총통 포기하고 진행</b>: 총통을 들고도 그냥 판을 이어 가면, 그 판은 폭탄으로 쳐서 2배만 적용해요(기본). 설정에서 4배를 고르면 흔들기+폭탄을 합쳐 4배로 계산해요. 이때 흔들기·폭탄 횟수는 따로 넣지 마세요.</p>'+

 '<p><b>점수</b>: 고 보너스 빼고 난 점수를 넣어 주세요 (3명이 칠 때 3점부터 남).</p>'+
 SHAREHELP+'</details>';

function render(){

// 1단계: 순서·진행/포기·광팔이·광값 + 이긴 사람
var POS=['선','두 번째','세 번째','마지막'];

function initS1(){
  if (st.init) return; st.init=true; st.rest={}; st.dead={}; st.gw={}; st.manual=false;

function setDec(k,v){ st[k]=v; seatAuto(); render(); }

function checkS1(){

  var losers=rp.play.filter(function(i){return i!==st.w;});

    L.decodeState(hs.slice(3)).then(function(d){ g=d.g; roT=d.t; render(); }, roError);
  } else { load(); render(); }
}
window.addEventListener('hashchange', function(){ location.reload(); });
boot();
